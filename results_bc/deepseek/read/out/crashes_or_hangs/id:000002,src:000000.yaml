exec_code: |-
  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      exe = "./temp_executable"

      try:
          # Create input with a binary character (null byte) to trigger BC_READ_BIN_CHAR error
          # "1+1\x00\n" includes a null byte which should be detected as binary
          binary_input = "1+1\x00\n"
          
          result = subprocess.run(
              [str(exe)],              # no -e
              input=binary_input,      # pass expression with binary character via stdin
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception:
          raise
