exec_code: |-
  import subprocess
  import signal
  import os

  def execute_program(timeout: int) -> tuple[str, int]:
      exe = "./temp_executable"
      
      # Create a file path that doesn't exist to ensure it's unreadable
      # Using a random filename to avoid conflicts
      import random
      import string
      
      # Generate a random filename that definitely doesn't exist
      random_suffix = ''.join(random.choices(string.ascii_lowercase + string.digits, k=8))
      non_existent_file = f"/tmp/nonexistent_file_{random_suffix}.txt"
      
      # Ensure the file doesn't exist
      if os.path.exists(non_existent_file):
          os.remove(non_existent_file)
      
      try:
          # Modified: Add exactly one command-line argument (the non-existent file path)
          result = subprocess.run(
              [str(exe), non_existent_file],  # Added file path as argument
              input="",                       # Empty input since we're reading from file
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception:
          raise
