target_path_constraint: |
  Chronological constraints to reach: if (BC_ERR(bc_read_binary(vec->v, vec->len - 1))) -> true in read.c:bc_read_line.

  1. Program invocation via the existing harness:
     - The executable must be launched with no command-line arguments that alter input mode. Stdin must be provided by the harness (a text/binary stream). No files need to be passed.

  2. Environment and terminal/history configuration:
     - The program must operate in a mode where manual stdin reading is used rather than history/TTY interfaces. Ensure that the standard input is a non-tty pipe or that history is disabled, so that bc_read_line calls bc_read_chars (as observed). No special environment variables are required provided stdin is not a terminal.

  3. Stdin stream structure (exact byte-level requirements):
     - Provide a single line terminated by a newline (LF, byte 0x0A). The line contents must include at least one byte classified as “binary/non-text” by the program’s binary detector before the newline.
     - Let the payload be a sequence of N bytes followed by LF. N >= 1.
     - At least one byte in the first N bytes must be a non-text byte according to the program’s check BC_READ_BIN_CHAR. While the exact predicate is not exposed, typical non-text includes bytes outside the printable ASCII range (i.e., values < 0x20 excluding tab (0x09) and newline (0x0A), or values >= 0x7F). Do not include the newline byte in the payload; it should only appear as the terminator.
     - The entire payload must be delivered in one or more read() calls; partial delivery is allowed, but the logical sequence must still form a single line with a terminating LF.

  4. Data delivery timing and size constraints for bc_read_buf processing:
     - Ensure at least one LF exists in the accumulated stdin buffer so bc_read_buf returns true, placing the line (including the LF) into the vector and null-terminating later.
     - The vector resulting from bc_read_chars must contain the bytes of the line data followed by a null terminator. The non-text byte must be within the part of the vector considered by bc_read_binary (vec->v[0 .. vec->len-2]).

  5. Binary-detection trigger constraint:
     - The byte sequence examined (all line bytes excluding the trailing null) must contain at least one byte that causes BC_READ_BIN_CHAR to report true, making bc_read_binary return true. This triggers BC_ERR(...) in bc_read_line, reaching the selected branch.

  Implications:
  - The newline terminator must be present so read()/bc_read_buf finish the line; otherwise, r==0 (EOF) path may be taken prematurely.
  - Avoid providing only printable ASCII bytes; include at least one high-bit (>=0x80) or control (<0x20 and not tab/newline) byte to satisfy the binary predicate.
