exec_code: |
  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      """
      Execute the target program with a single input line that contains a non-text byte
      before the newline to trigger bc_read_binary(...) and reach the target branch.

      Input sent on stdin (as text encoded to bytes):
      - "1\x01\n"
        * '1' (0x31) is printable ASCII
        * '\x01' (0x01) is a control character (< 0x20, not tab/newline) and should be
          classified as non-text by the program's BC_READ_BIN_CHAR predicate
        * '\n' (0x0A) terminates the line so bc_read_buf/bc_read_line complete normally

      No command-line arguments are passed, and stdin is a non-tty pipe via subprocess,
      ensuring history/TTY interfaces are not used.
      """
      exe = "./temp_executable"

      try:
          # Provide stdin with at least one non-text byte (0x01) before the newline terminator.
          # Using text=True ensures proper newline handling; "\x01" encodes to single byte 0x01 in UTF-8.
          result = subprocess.run(
              [str(exe)],            # no arguments altering input mode
              input="1\x01\n",      # single line payload with a binary byte before LF
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception:
          raise
