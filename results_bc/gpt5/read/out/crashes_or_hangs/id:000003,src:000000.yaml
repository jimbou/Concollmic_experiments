target_path_constraint: |-
  Environment and invocation
  1) Process launch: run the executable with no command-line arguments. Standard input (stdin) is connected (a pipe/TTY is acceptable). No environment variables are required.

  Stdin data requirements (exact semantics)
  2) The program reads from standard input line-by-line, looking for a newline byte (0x0A). Provide at least one line of input terminated by a single newline character (\n, byte 0x0A). The line content must contain at least one byte before the newline (i.e., length >= 1 excluding the newline), because empty input (immediate EOF or just newline) can short-circuit the read path.

  3) Binary-character presence: Within the bytes before the newline, include at least one byte that the program’s binary detector classifies as “non-text.” This means the byte is not a typical printable text character nor permitted whitespace/control for text. To guarantee triggering bc_read_binary’s condition, ensure there exists an index i in [0, size) for the read line buffer such that BC_READ_BIN_CHAR(line[i]) is true. In practical terms, this requires at least one byte with a value that standard C iscntrl() would consider a control character other than tab (0x09), carriage return (0x0D), line feed (0x0A – but do not put 0x0A before the end of line), or other commonly accepted text characters. Also avoid a NUL (0x00) byte in the middle if the input mechanism truncates at NUL; if NUL is preserved, it is acceptable as a binary indicator. The key requirement is: ∃ byte b in the line (before terminating \n) that is not printable ASCII and not an allowed whitespace; that byte must remain in the buffer passed to bc_read_binary.

  4) Input encoding/transport: Ensure the chosen non-text byte is transmitted unmodified through stdin (no shell or encoding layers that would strip or translate it). When providing data programmatically, write raw bytes to stdin; avoid text-mode transformations.

  Termination and buffering assumptions
  5) Do not send EOF before at least one newline-terminated line with the required binary byte is delivered. After the newline, EOF is acceptable.

  Summary as SMT-style constraints over the stdin byte stream S
  - Let S be a sequence of bytes read until the first newline. Let n = len(S). Constraints:
    a) n >= 1
    b) S contains at least one index k in [0, n-1] such that BinaryChar(S[k]) = true, where BinaryChar(x) holds when x is not in the set of printable ASCII characters (0x20..0x7E) nor in the allowed whitespace set {0x09}.
    c) The next byte after S (position n) is 0x0A (newline).
