  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      """
      Executes the original test harness with a stdin line that contains a binary byte before the newline
      to trigger bc_read_binary()'s non-text detection branch.

      Concrete stdin bytes: 0x00 0x0A ("\x00\n")
      - No command-line arguments, as required
      - The input is provided via stdin with text=True; "\x00" encodes to a single 0x00 byte in UTF-8
      - The newline is 0x0A, ensuring the line read completes
      """
      exe = "./temp_executable"
      input_data = "\x00\n"  # Binary byte (NUL) before newline

      try:
          result = subprocess.run(
              [str(exe)],
              input=input_data,
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception:
          raise
