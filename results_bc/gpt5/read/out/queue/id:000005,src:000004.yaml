target_path_constraint: |-
  Chronological path constraints to reach the EINTR-handling branch in read.c:bc_read_chars()

  1) Process invocation constraints
  - Invoke the executable with no command-line arguments. The process must start normally and read from its standard input (stdin) using a blocking POSIX read() call.
  - The standard input stream must be connected to a pipe or other non-TTY descriptor that supports asynchronous signal interruption (typical for subprocess-managed stdin). No need for a terminal or history support.

  2) Input stream state constraints prior to read()
  - Ensure the program has no pending buffered input before the first read() attempt. Concretely, the stdin buffer inside the program must be empty at entry to bc_read_chars(). This means no initial data should be pre-fed such that bc_read_buf(...) would return true before read() is called.
  - The program should be in a state where bc_read_chars() enters its read loop and executes read(STDIN_FILENO, ...).

  3) Signal delivery constraints to force EINTR
  - Deliver a non-terminating, interrupting signal to the running process while it is blocked in read(STDIN_FILENO, ...). The signal must:
    a) Be configured with a handler that does not terminate the process (default or custom), allowing the program to continue execution after interruption.
    b) Cause read() to return -1 with errno set to EINTR. Typical signals include SIGINT, SIGTERM (if handled), SIGHUP, SIGALRM, or a user-defined signal (SIGUSR1/SIGUSR2) delivered during the blocking read.
  - The signal must arrive after the read() call begins and before any data is made available on stdin, ensuring read() is interrupted rather than satisfied.

  4) Environment and timing constraints
  - Do not provide any stdin data until after the interrupt occurs; otherwise, read() would return a positive byte count rather than -1.
  - Ensure the process does not ignore the signal entirely (e.g., SIG_IGN); if the default action would terminate the process, override it to a non-terminating handler. The harness or test environment must install such a handler before or immediately after process start.
  - The program’s internal signal guards (BC_SIG_LOCK/BC_SIG_UNLOCK) must permit signal delivery to set errno=EINTR; thus, the signal should be delivered while the program is within the BC_SIG_LOCK-protected region that performs read().

  5) Post-interrupt continuation constraints
  - After EINTR occurs, allow the process to continue (do not send terminating signals). The program will clear its internal signal state, print messages, and continue the loop.
  - To exit bc_read_chars() gracefully after exercising the EINTR branch, subsequently make a newline-terminated line available on stdin so the read loop can proceed and the function can eventually return success.

  These constraints ensure the read() call yields r < 0 and errno == EINTR, thereby taking the target branch and executing the recovery logic within bc_read_chars().
