exec_code: |
  import os
  import signal
  import subprocess
  import time


  def execute_program(timeout: int) -> tuple[str, int]:
      """
      Execute ./temp_executable with no command-line arguments and orchestrate an EINTR
      during a blocking read() on stdin, then provide a newline-terminated line so the
      program can continue and exit gracefully.

      How constraints are satisfied:
      - Process invocation: no CLI args; stdin is a pipe (non-TTY) managed by subprocess.
      - Input stream state: we initially provide no input so the program blocks in read().
      - Signal delivery: while it is blocked, send SIGINT (program is expected to install
        a non-terminating handler) to cause read() to return -1 with errno=EINTR.
        We send the signal multiple times over a short window to increase likelihood it
        arrives during the blocking read window.
      - Environment/timing: we write no stdin data until after the interrupts have been
        delivered; then we send a newline-terminated line and close stdin.
      - Post-interrupt: after EINTR, the program continues; the newline lets it proceed
        to completion.

      Returns a tuple of (stderr, return_code). On timeout, kills the process and returns
      (-SIGKILL) as the return code as per the original harness behavior.
      """
      exe = "./temp_executable"

      # Sanity check for POSIX signals; required for EINTR behavior
      if os.name != 'posix':
          # Still attempt execution, but note signals may not behave identically
          pass

      try:
          # Start the process with pipes. No command-line arguments per constraint.
          proc = subprocess.Popen(
              [exe],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          # Give the child a brief moment to initialize and reach the blocking read().
          # Then, deliver SIGINT a few times to increase the likelihood of interrupting read().
          # We do not write any stdin data before these signals, satisfying the constraint.
          start = time.monotonic()
          # Small initial delay
          time.sleep(0.15)

          # Send SIGINT a few times over ~0.4s window or until process exits
          for _ in range(5):
              if proc.poll() is not None:
                  break
              try:
                  os.kill(proc.pid, signal.SIGINT)
              except ProcessLookupError:
                  break
              # Short sleep between signals
              time.sleep(0.08)

          # After attempting to cause EINTR, send a newline-terminated line so the
          # program can proceed. Use a simple valid line and then close stdin.
          try:
              if proc.stdin and not proc.stdin.closed:
                  proc.stdin.write("0\n")
                  proc.stdin.flush()
                  proc.stdin.close()
          except BrokenPipeError:
              # Child may have already exited or closed the pipe
              pass

          # Compute remaining timeout budget for waiting
          elapsed = time.monotonic() - start
          remaining = max(0.0, float(timeout) - elapsed) if timeout is not None else None

          try:
              _stdout, _stderr = proc.communicate(timeout=remaining)
              return _stderr, proc.returncode
          except subprocess.TimeoutExpired:
              # Kill and drain outputs
              try:
                  proc.kill()
              except ProcessLookupError:
                  pass
              try:
                  _stdout, _stderr = proc.communicate(timeout=5)
              except Exception:
                  _stderr = ""
              return _stderr, -signal.SIGKILL

      except Exception:
          # Propagate unexpected errors for visibility in the harness
          raise
