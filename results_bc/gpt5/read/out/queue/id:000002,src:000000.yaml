  coverage (unexecuted code at lines 132-135). The current harness feeds a newline-terminated
  line, so only the newline path was taken. Driving execution into the else branch
  (when no newline is present in the buffer) exercises buffered, partial-line handling,
  a distinct behavior that is both reachable via stdin manipulation and important
  for robustness when inputs arrive without line terminators.
target_path_constraint: |-
  Chronological external constraints to reach bc_read_buf’s no-newline branch (nl == NULL):

  1) Program invocation:
  - Execute the program binary with no command-line arguments beyond the executable path.
  - Provide input via standard input (stdin). No environment variables are required.

  2) Terminal/TTY conditions:
  - History/TTY behavior must not divert input away from manual reading. Either ensure the program detects non-tty stdin or that history is disabled. Practically, piping data into stdin suffices (stdin is not a terminal), so manual reading is used.

  3) Stdin input structure and timing (stream semantics):
  - Supply at least one block of bytes to stdin that does NOT contain the newline character ("\n").
  - Ensure the initial buffer content that bc_read_buf processes (the slice of vm->buf whose length is tracked by vm->buf_len) contains no "\n" anywhere.
  - The input must be long enough that read() returns a positive count (> 0) so bc_read_chars continues (not EOF). At minimum, one byte is sufficient.
  - Do NOT terminate the provided data with a newline at the time bc_read_buf is called; the first invocation of bc_read_buf after the read must see no newline. Delaying or omitting a newline ensures nl == NULL.

  4) Stream completion control:
  - Avoid sending EOF immediately after the first chunk; ensure read() returns > 0 at least once so vm->buf_len increases and bc_read_buf is invoked with a non-zero length containing no newline.
  - Newline may be sent later (optional) to allow the overall read routine to eventually complete, but it must not be present before the targeted bc_read_buf call.

  5) Character constraints (binary/text check remains false path):
  - All bytes provided prior to the first newline must be ordinary text characters such that the binary-check routine (bc_read_binary) evaluates to false. Concretely, restrict bytes to typical printable ASCII excluding control characters like '\n' and any byte values flagged as non-text by the program’s check. For safety, use digits, letters, spaces, or operators, but exclude '\n'.

  6) Input example schema (not concrete values, but structural rules):
  - First chunk: one or more printable ASCII bytes without '\n' (e.g., a partial expression), then either:
    a) Follow-up chunk later that includes a '\n' to allow completion, or
    b) Let the program detect EOF only after a later bc_read_buf invocation has already observed nl == NULL.

  Satisfaction of the above ensures that when bc_read_buf examines the buffer, strchr(buf, '\n') returns NULL, taking the no-newline branch.
