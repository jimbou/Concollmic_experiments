exec_code: |
  import subprocess
  import signal


  def execute_program(timeout: int) -> tuple[str, int]:
      """
      Execute the original program with stdin data that contains no newline so that
      the first buffer processed by bc_read_buf has no '\n' (nl == NULL).

      - No command-line arguments are provided (only the executable path), matching the original harness.
      - Stdin is piped (non-tty) and contains printable ASCII without a trailing newline.
      - This ensures read() returns > 0 and bc_read_buf's first check for a newline finds none.
      """
      exe = "./temp_executable"

      try:
          # Provide printable ASCII without a newline to ensure nl == NULL in bc_read_buf
          # Using subprocess.run with input sends the data and then closes stdin (EOF),
          # which is acceptable for triggering the target branch while keeping the harness structure.
          result = subprocess.run(
              [str(exe)],            # no additional command-line arguments
              input="1+1",           # no trailing newline; printable ASCII
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          # On timeout, mimic the original harness behavior
          return e.stderr, -signal.SIGKILL

      except Exception:
          # Propagate unexpected exceptions
          raise
