  Chronological external constraints to reach bc_read_binary()’s non-text detection branch (true):

  1. Program invocation:
  - Launch the executable with no command-line arguments, exactly as the harness does.
  - Provide input via standard input (stdin). No environment variables or files are required.

  2. Input delivery and structure expectations:
  - The program reads a single line from stdin, terminated by a newline byte (ASCII 0x0A). Ensure stdin delivers at least one newline so the line-reading loop completes.
  - The reader accumulates bytes until a newline is encountered; only bytes up to (and including) the newline are considered the line, and the binary check is performed on the line content excluding the final string terminator.

  3. Binary byte requirement (to trigger the target branch):
  - The stdin line must contain at least one byte that the program classifies as a “non-text/binary” character. This byte must appear before the newline terminator.
  - Allowed position: anywhere in the line (beginning, middle, or end), as long as it precedes the newline.
  - Encoding: treat stdin as a raw byte stream. The binary byte must be a value outside printable ASCII and not whitespace characters typically allowed in text expressions. Examples include control bytes in the ranges 0x00–0x08, 0x0B–0x0C, 0x0E–0x1F, or any 8-bit values with the high bit set (0x80–0xFF). Avoid 0x0A (newline) for the binary byte, as that ends the line; place the binary byte elsewhere.

  4. Line composition constraints to ensure the program proceeds to bc_read_binary():
  - The line may contain any additional bytes (e.g., digits, operators, spaces) before/after the binary byte; there is no requirement that the line be a valid expression because the binary check happens immediately after reading the line.
  - Ensure that no prior read error or EOF occurs: stdin must supply the bytes and final newline within the program’s read call timeout and without being interrupted.

  5. Summary SMT-style condition over the stdin byte sequence L[0..k], with L[k] = 0x0A (newline):
  - Exists i in [0, k): BinaryChar(L[i]) = true
  - Where BinaryChar(b) = (b ∈ {0x00..0x08, 0x0B, 0x0C, 0x0E..0x1F} or b ∈ {0x80..0xFF})
  - k ≥ 1
