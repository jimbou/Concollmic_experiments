  - The executable is invoked with no command-line arguments and reads a single line from standard input (stdin). Provide exactly one token representing a number, followed by a single newline character (LF, byte 0x0A). No surrounding whitespace before the token; optional trailing whitespace after the newline must be avoided.

  2) Locale and numeric formatting environment:
  - Ensure the process locale uses a dot as the decimal separator so the lexer recognizes scientific notation correctly. Set environment variables prior to launching the process: LC_ALL=C, LANG=C, LC_NUMERIC=C. Do not set conflicting locale variables that override these.

  3) Scientific-notation requirement to trigger exp != NULL:
  - The numeric token given on stdin must contain the lowercase character 'e' (byte 0x65) that denotes scientific notation, somewhere after at least one decimal digit. Formally: token matches the regular language [0-9]+(\.[0-9]+)?e[+-]?[0-9]+ with no embedded spaces or other characters. Uppercase 'E' is not sufficient unless the lexer treats it equivalently; to guarantee exp != NULL per code that searches with strchr(...,'e'), the token MUST contain a lowercase 'e'.
  - The token must not equal the special short constants "0" or "1" (exactly those single-character strings), because other code paths special-case those. Having more than one character or including decimal/scientific parts ensures this.

  4) NUL-terminated string and non-empty requirement:
  - The stdin token must be a valid, non-empty C string without embedded NUL bytes (no byte 0x00 before the newline). The runtime will provide a trailing NUL terminator when storing the lexeme internally; the input provider must not inject NULs.

  5) Character set constraints:
  - All characters must be ASCII digits '0'..'9' (0x30-0x39), optional single dot '.' (0x2E) for the mantissa, an obligatory lowercase 'e' (0x65), and an optional sign '+' (0x2B) or '-' (0x2D) immediately after 'e', followed by at least one digit. No other characters are permitted in the token.

  6) Length constraints and token boundaries:
  - Provide the token contiguously with no whitespace inside it. Terminate the token with exactly one newline (LF). Do not provide extra tokens or additional lines. Ensure the token length is at least 3 characters after the 'e' (to include optional sign and at least one digit exponent), and overall more than one character so it cannot be mistaken for special-cased "0"/"1".

  7) Signal/interrupt conditions:
  - Do not send signals that would interrupt parsing; let the program run to completion under the default handler.

  These constraints guarantee that bc_parse_number observes exp != NULL (because strchr(...,'e') finds the lowercase 'e' in the token), taking the scientific-notation branch.
