  import subprocess
  import signal
  import os


  def execute_program(timeout: int) -> tuple[str, int]:
      exe = "./temp_executable"

      # Provide a unique, non-"0"/non-"1" decimal number token via stdin and terminate with a newline.
      # Using "42" ensures: starts immediately with digits, no sign, no scientific notation,
      # at least two characters (avoids ZERO/ONE special cases), and a new constant key.
      input_data = "42\n"

      # Ensure a standard C locale so decimal parsing uses '.' and is not altered by environment.
      env = os.environ.copy()
      env.setdefault("LC_ALL", "C")
      env.setdefault("LANG", "C")
      env.setdefault("LC_NUMERIC", "C")

      try:
          result = subprocess.run(
              [str(exe)],
              input=input_data,
              text=True,
              capture_output=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception:
          raise
