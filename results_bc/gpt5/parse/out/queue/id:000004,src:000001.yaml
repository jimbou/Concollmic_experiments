exec_code: |
  import subprocess
  import signal


  def execute_program(timeout: int) -> tuple[str, int]:
      exe = "./temp_executable"

      try:
          # Provide two identical non-zero, non-one numeric tokens separated by a newline,
          # ending with a newline to ensure proper tokenization.
          # This avoids the zero/one special-case fast paths and triggers const_map reuse
          # on the second occurrence.
          input_stream = "42\n42\n"

          result = subprocess.run(
              [str(exe)],
              input=input_stream,
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception:
          raise
