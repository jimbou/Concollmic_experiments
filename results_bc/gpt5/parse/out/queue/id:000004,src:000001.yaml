target_path_constraint: |-
  Chronological constraints to reach parse.c:bc_parse_addNum else branch (const_map reuse path):

  1. Program Invocation:
  - Launch the executable with no command-line arguments beyond the program name. The harness already does this and passes input via standard input (stdin). No environment variables are required, but the process must have permission to read from stdin.

  2. Input Delivery Mode:
  - Provide all text via standard input as a single ASCII/UTF-8 stream. No binary data. Ensure the stream ends with a newline to allow the lexer to finish tokenizing the last number.

  3. Token Format Requirements (what the parser expects for numbers):
  - A “number token” is a sequence of ASCII digits optionally containing a single decimal point ‘.’. Scientific-notation indicators (like ‘e’ or ‘E’) must NOT be present to avoid the BC_ENABLE_EXTRA_MATH branches.
  - The token must be a valid C-string (i.e., the input buffer that forms the token must be terminated by a NUL byte internally by the program). From the external perspective, this means sending plain text; do not include NUL characters in the stdin stream.

  4. Avoid Special-Case Fast Paths:
  - Do not use exactly the single-character token "0" followed by a delimiter, because bc_parse_addNum will take the zero-special-case path and skip the const_map logic entirely.
  - Do not use exactly the single-character token "1" followed by a delimiter, because bc_parse_addNum will take the one-special-case path and skip the const_map reuse/insertion logic we target.

  5. Trigger the const_map Reuse (else branch):
  - Provide two occurrences of the SAME non-zero, non-one numeric token separated by a delimiter (whitespace or newline). The first occurrence must cause insertion into the constant map, and the second occurrence must match the exact same character sequence so that bc_map_insert reports the key already exists, leading to the else branch.
  - Constraints on the repeated token:
    a. The token must be composed only of digits and optionally one decimal point (no exponent markers, leading signs, or trailing characters).
    b. The token must not be the exact two-character sequence "1\0" or "0\0" internally; externally this means avoid the single-character tokens "1" or "0".
    c. The token must be identical across both occurrences byte-for-byte, including any leading zeros or decimal formatting, so that the map key matches.

  6. Stream Structure:
  - Arrange stdin as: <token_A><delimiter><token_A><delimiter_optional>
    where <delimiter> is at least one ASCII whitespace character (space or newline). Ensure the stream ends cleanly (e.g., newline) so tokenization completes.

  7. Optional Avoidance of Other Branches:
  - Do not include any ‘e’ or ‘E’ in the numeric token to avoid the scientific-notation branches.
  - Do not include sign characters ‘+’ or ‘-’ before the token, assuming the lexer would treat them as separate operators or different tokens and could alter parsing flow.

  Under these constraints, the parser will:
  - Read the first occurrence of token_A, insert it into the constants map.
  - Read the second identical token_A; bc_map_insert will detect prior existence and take the else path in bc_parse_addNum (lines 141-142).
