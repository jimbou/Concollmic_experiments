exec_code: |-
  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      exe = "./temp_executable"

      # Input: a single valid expression on stdin containing a numeric literal in
      # scientific notation with a lowercase 'e' and terminated by a newline.
      # This ensures the lexer produces a number token with 'e' so that
      # bc_parse_number() takes the exp != NULL branch.
      stdin_data = "1e2\n"

      try:
          result = subprocess.run(
              [str(exe)],
              input=stdin_data,
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception:
          raise
