target_path_constraint: |-
  Chronological constraints to reach parse.c:bc_parse_number with exp != NULL (scientific notation path):

  1. Program invocation mode:
  - Launch the executable with exactly one command argument (the path to the program itself only), i.e., no additional flags or options are required or permitted by the current harness. The input must be provided via standard input (stdin).

  2. Input channel and encoding:
  - Provide input through stdin using UTF-8 or ASCII encoding. The input should form a single valid expression accepted by the calculator-like parser. Newline characters may be used to terminate the expression.

  3. Token structure to trigger numeric parsing:
  - Ensure the expression contains at least one numeric literal token that the lexer will classify as a number. The token must be contiguous (no embedded whitespace) and directly readable as part of the expression.
  - The expression must cause bc_parse_number() to be invoked on that numeric token. This happens when the lexer produces a number token in a context where a value is expected (e.g., as an operand to an operator or a standalone value).

  4. Scientific-notation requirement (to make exp != NULL):
  - The numeric literal must include a lowercase letter 'e' (0x65) that denotes scientific notation. There must be at least one character before the 'e' (the mantissa) and at least one character after the 'e' (the exponent). No whitespace is allowed inside the literal.
  - Formal token shape: mantissa 'e' exponent
    * mantissa: one or more digits [0-9], optionally with a single decimal point '.', and optionally a leading sign '+' or '-'. At least one digit must appear.
    * 'e': the exact lowercase character 'e'. Uppercase 'E' will not satisfy exp != NULL in code that uses strchr(..., 'e').
    * exponent: an optional sign '+' or '-', followed by one or more digits [0-9]. At least one digit must appear.
  - Examples are NOT to be provided; only the structure above must be met.

  5. Expression validity around the numeric token:
  - Surrounding syntax must be valid for the parser so that lexing and parsing proceed to bc_parse_number(). For instance, the numeric literal may be used as an operand in an arithmetic expression, and operators used must be recognized by the parser (e.g., '+', '-', '*', '/', '(', ')').
  - The expression must end with a newline to ensure the input is consumed and parsing is triggered.

  6. Feature configuration dependency:
  - The branch exists under a compile-time feature guard (BC_ENABLE_EXTRA_MATH). To reach the branch at runtime, the executable used by the harness must be built with BC_ENABLE_EXTRA_MATH enabled. No runtime input can change this; ensure the environment uses such a build.

  7. Environment and state assumptions:
  - Standard input must be readable; no file I/O is involved.
  - No special environment variables are required.

  These constraints guarantee that when the parser processes the provided expression, it will produce a numeric token containing a lowercase 'e', causing strchr(p->l.str.v, 'e') to return a non-null pointer, thereby taking the exp != NULL branch inside bc_parse_number().
