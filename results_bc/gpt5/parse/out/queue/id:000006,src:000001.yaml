target_path_constraint: |
  Chronological constraints to reach the parser’s string-literal path (bc_parse_addString):

  1. Program invocation and input delivery
  - The executable must be invoked with no command-line arguments that alter parsing mode; it must read its program text from standard input (stdin). The harness should provide the entire program text via stdin as a single text stream.

  2. Parsing mode
  - The lexer/parser must be in normal expression parsing mode (not a special numeric-only or binary input mode). If the program supports multiple modes, ensure default textual parsing mode is used. No environment variables or flags should switch the lexer to a non-textual mode.

  3. Input encoding and general format
  - The stdin stream must be ASCII or UTF-8 without a byte-order mark.
  - The stream must contain tokens separated by allowed whitespace (spaces, tabs, or newlines). No NUL bytes are allowed inside the stream other than the implicit C-string terminators used internally; stdin should not contain embedded NUL characters.

  4. Token requirements to reach bc_parse_addString
  - The token sequence must include at least one string-literal token recognized by the lexer. A string-literal token is defined as a sequence enclosed in double quotes (") with optional escape handling consistent with the implementation (e.g., backslash escapes). Examples of valid forms (conceptual, not concrete values): "<printable characters>".
  - The lexer must emit a string token for this literal, and the parser must be in a state where encountering a string literal is valid (e.g., as a value/expression element).

  5. Positioning of the string literal in the input
  - Ensure the first non-whitespace token is a string literal, or place the string literal after syntax that leads the parser into accepting a primary expression. Avoid preceding constructs that would cause the parser to expect an identifier, number-only context, or operator without an operand.

  6. Termination and minimality
  - The input should terminate cleanly with a newline or EOF after the string literal token (with any required trailing delimiters the language expects). Avoid trailing invalid characters that could shift the lexer state.

  7. Exclusion of numeric-special cases
  - Do not begin the input with a numeric token such as 0 or 1, as this may route execution through bc_parse_addNum and its zero/one special-case logic instead of bc_parse_addString.

  Sufficient condition summary (SMT-style):
  - Let S be the stdin byte sequence.
  - Encoding(S) ∈ {ASCII, UTF-8} ∧ no_BOM(S) ∧ no_NUL(S).
  - ∃ i, j with 0 ≤ i < j ≤ len(S): S[i] = '"' ∧ S[j] = '"' ∧ ∀ k ∈ (i, j): S[k] is printable ASCII or valid escaped sequence.
  - The parser’s initial expected token class allows a primary literal at position i.
  - The first token in S is the above string literal, or earlier tokens place the parser into a state expecting a value literal.
  - Stream ends with optional whitespace and newline/EOF.
