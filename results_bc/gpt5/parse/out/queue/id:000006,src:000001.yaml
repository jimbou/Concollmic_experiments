exec_code: |
  import subprocess
  import signal


  def execute_program(timeout: int) -> tuple[str, int]:
      exe = "./temp_executable"

      try:
          # Provide a valid string-literal token as the first non-whitespace token,
          # encoded in UTF-8 without BOM, followed by a newline. No numeric token first.
          program_text = "\"Hello, world!\"\n"

          result = subprocess.run(
              [str(exe)],
              input=program_text,
              text=True,
              encoding="utf-8",
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception:
          raise
