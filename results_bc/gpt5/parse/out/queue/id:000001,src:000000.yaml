exec_code: |
  import subprocess
  import signal


  def execute_program(timeout: int) -> tuple[str, int]:
      exe = "./temp_executable"

      try:
          # Provide exactly the literal zero as the entire expression, followed by a newline
          # This ensures the numeric token is exactly "0" and triggers the zero-special-case path
          result = subprocess.run(
              [str(exe)],
              input="0\n",
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception:
          raise
