target_path_constraint: |-
  Constraints to reach parse.c:bc_parse_addNum zero-special-case branch (condition true):

  1. Program invocation via the given harness:
     - Execute the program as a single executable without any command-line arguments beyond the executable path. The harness runs: ["./temp_executable"]. Ensure the executable starts and reads expressions from standard input (stdin).

  2. Input delivery (stdin stream properties):
     - Provide a text input stream encoded as ASCII or UTF-8 without BOM.
     - The input must contain a single arithmetic expression representing the numeric literal zero followed by a line terminator so the lexer obtains a complete token. Acceptable line terminators: "\n" (LF) or "\r\n" (CRLF).
     - Do not include leading whitespace or a sign before the zero; the parser’s zero-special-case compares the first two characters of the numeric token to a precomputed "0" sequence.

  3. Numeric token format to trigger zero-special-case:
     - The first character of the numeric token must be the digit '0' (byte value 0x30).
     - The second character of the numeric token must be the string terminator (nul byte 0x00) from the lexer’s buffer immediately after the digit '0'. In practice, this requires that the token consist of exactly one character: '0'. Any trailing characters like '.', digits, or whitespace must not be part of the token; they must either not exist or be separated by token delimiters so the token is exactly "0".
     - Do NOT include a sign (+ or -), leading zeros beyond a single '0', a decimal point, exponent, or any suffix. Examples that must be avoided: "00", "0.0", "-0", "+0", "0e0".

  4. Expression structure constraints:
     - Ensure the input is parsed into a number token; avoid operators or identifiers preceding the zero that could change token boundaries. Providing just the literal zero as the entire expression is sufficient.

  5. Environment constraints:
     - No environment variables or files are required. Standard input must be readable, and the process must not time out under the provided harness timeout.

  These constraints guarantee that when bc_parse_number calls bc_parse_addNum with the lexer’s current token, the 2-byte comparison against bc_parse_zero succeeds, taking the zero-special-case branch body.
