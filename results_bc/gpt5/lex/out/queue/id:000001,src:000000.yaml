justification: This branch handles scientific notation in numeric literals. It currently
  has 0% historical coverage (lines 226-251) and represents an important alternative
  path in the lexer, exercising additional logic for parsing exponents. Triggering
  it will expand coverage of number parsing beyond simple integers/decimals used by
  existing tests and can expose edge cases around exponent signs and digit requirements.
target_path_constraint: |-
  Chronological constraints to reach bc_lex_number() with c == 'e' (scientific notation path):

  1. Program invocation through stdin input:
     - The harness runs the executable without command-line options and supplies an expression via standard input. Ensure standard input is provided and is a single ASCII line terminated by a newline ("\n"). No additional arguments or environment variables are required.

  2. Input encoding and general format:
     - Use 7-bit ASCII characters only. Avoid NUL bytes (0x00) within the line. The lexer reads the entire line into an internal buffer and tokens it.

  3. Token placement and separation:
     - Place a numeric literal at the start of the line or preceded only by whitespace, so the lexer immediately recognizes it as a number token.
     - If additional tokens follow on the same line, separate them with whitespace or operators that are valid for the bc-like language. This is not required; a single numeric literal on the line suffices.

  4. Numeric literal structure to trigger scientific notation branch:
     - The literal must contain an exponent marker 'e' (lowercase ASCII 'e', 0x65) following an initial integer or fractional part parsed by bc_lex_num().
     - Structure constraints:
       a) Mantissa (pre-'e'):
          - One of the following forms is required so bc_lex_number() first consumes a valid mantissa via bc_lex_num():
            i. Digits: [0-9]+ (e.g., integer part only), or
            ii. Digits followed by a decimal point and optional more digits: [0-9]+ '.' [0-9]*, or
            iii. A leading decimal point followed by digits: '.' [0-9]+.
          - The mantissa must not end with an invalid character; only digits and at most one decimal point are allowed before 'e'. Backslash-newline continuations are allowed by bc_lex_num(), but to keep constraints simple, do not include backslashes.
       b) Exponent marker:
          - Immediately after the mantissa, include the character 'e'. bc_lex_number() checks the next buffer character at this position.
       c) Exponent sign and digits (handled inside the branch body):
          - After 'e', optionally include a single '+' or '-' sign.
          - After the optional sign, include at least one digit [0-9]. The exponent must comprise only digits thereafter until a token boundary.
          - Do not include a decimal point in the exponent; it must be an integer.

  5. Token termination:
     - Terminate the numeric token with one of: end of line ("\n"), whitespace, an operator, or any character that is not part of a number/exponent. End-of-line newline is sufficient.

  6. Mode and lexer setup conditions (environmental assumptions to keep path stable):
     - The lexer must be initialized to read from an expression text buffer (mode compatible with expressions). The provided harness already calls into text mode with the stdin line. Ensure the input consists of a single line so the initial bc_lex_text() and bc_lex_next() produce BC_LEX_NUMBER for the numeric token.

  These constraints ensure that when bc_lex_number() is invoked to parse the first token, the next character after the mantissa inside the buffer is 'e', causing the branch if (c == 'e') to evaluate true and execute the scientific-notation parsing path.
