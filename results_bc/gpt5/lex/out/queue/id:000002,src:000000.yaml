exec_code: |
  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      exe = "./temp_executable"

      try:
          # Provide stdin that begins with "/*" and contains no closing "*/" before EOF.
          # Minimal satisfier: exactly two bytes "/" and "*" with no trailing newline.
          stdin_data = "/*"
          result = subprocess.run(
              [str(exe)],              # no additional command-line arguments
              input=stdin_data,        # pass expression via stdin
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return (e.stderr if e.stderr is not None else ""), -signal.SIGKILL

      except Exception:
          raise
