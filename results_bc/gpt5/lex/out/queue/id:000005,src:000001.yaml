  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      exe = "./temp_executable"

      # Input: a single ASCII line with a numeric literal in scientific notation
      # - Mantissa: digits only (valid per bc_lex_num())
      # - Exponent marker: lowercase 'e'
      # - Exponent: optional '+' sign followed by at least one digit
      # - Token terminated by newline
      sci_input = "1e+2\n"

      try:
          result = subprocess.run(
              [str(exe)],              # No command-line options, as in the original harness
              input=sci_input,         # Provide the scientific-notation numeric literal via stdin
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception:
          raise
