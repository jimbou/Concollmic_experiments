  def execute_program(timeout: int) -> tuple[str, int]:
      import subprocess
      import signal

      exe = "./temp_executable"

      # Payload satisfies the required constraints:
      # - Starts with "/*" to trigger block comment lexing
      # - Contains at least one newline inside the comment to exercise line counting
      # - Properly terminates with "*/" within the same buffer (single write via subprocess stdin)
      # - Includes valid trailing tokens ("1+1\n") after the comment to avoid interfering with lexing
      payload = "/* This is a block comment\nwith a newline inside */\n1+1\n"

      try:
          result = subprocess.run(
              [str(exe)],              # invoke without additional switches
              input=payload,            # pass entire stdin payload in one write
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          # Return stderr (if any) and a negative SIGKILL to indicate timeout
          return e.stderr, -signal.SIGKILL

      except Exception:
          # Propagate unexpected execution issues
          raise
