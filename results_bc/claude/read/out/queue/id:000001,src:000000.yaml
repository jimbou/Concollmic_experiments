  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      exe = "./temp_executable"

      try:
          # Modified input to include a binary character (SOH - ASCII 0x01)
          # This should trigger the BC_READ_BIN_CHAR condition
          binary_input = "1+1\x01\n"
          
          result = subprocess.run(
              [str(exe)],              # no -e
              input=binary_input,      # modified input with binary character
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception:
          raise
