  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      exe = "./temp_executable"

      try:
          # Modified input to include a binary character (NUL - ASCII 0)
          # This will trigger the BC_READ_BIN_CHAR check to return true
          result = subprocess.run(
              [str(exe)],              # same executable, no -e flag
              input="1+1\x00\n",       # added NUL character to the expression
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception:
          raise
