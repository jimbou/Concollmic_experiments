  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      exe = "./temp_executable"

      try:
          # Modified input to include a number with a line continuation
          # The input "123\\\n456\n" represents a number split across lines
          # The triple backslash is needed in Python string to represent a single backslash in the actual input
          result = subprocess.run(
              [str(exe)],              # no -e
              input="123\\\n456\n",    # number with line continuation
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception:
          raise
