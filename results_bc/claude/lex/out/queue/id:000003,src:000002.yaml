          result = subprocess.run(
              [str(exe)],              # no -e flag, same as original
              input="123 /* this is a block comment */ 456\n",
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception:
          raise
