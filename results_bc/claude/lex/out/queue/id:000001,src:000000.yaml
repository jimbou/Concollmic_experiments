  1. Program Input Format: The input must be a valid numeric expression containing scientific notation.
     - The input must contain a number followed immediately by the letter 'e'
     - The number can be an integer or a decimal (e.g., "5e" or "3.14e")
     - No spaces or other characters should appear between the number and 'e'

