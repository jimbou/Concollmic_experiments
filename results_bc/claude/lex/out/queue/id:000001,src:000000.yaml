  - The input must start with a digit (0-9) or a decimal point followed by a digit
  - After parsing the digits (and possibly a decimal point), the next character must be 'e'
  - The 'e' must be followed by an optional sign (+ or -) and at least one digit

  Example constraint structure (not a concrete example):
  number + 'e' + [sign] + digits
