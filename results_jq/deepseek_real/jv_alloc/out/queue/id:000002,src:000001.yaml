target_path_constraint: |-
  1. Environment Setup: The program must be executed with LD_PRELOAD set to a shared library that overrides malloc, calloc, and realloc to always return NULL, simulating memory allocation failure.

  2. Thread Initialization: The program must reach the point where pthread_once() is called for the first time, triggering tsd_init() to execute. This requires that the program uses thread-local storage functionality.

  3. pthread_key_create Failure: The pthread_key_create() function must fail (return non-zero) when called. This can be caused by:
     - Insufficient system resources to create a new thread-specific data key
     - The maximum number of thread-specific data keys (PTHREAD_KEYS_MAX) has been reached
     - System-level constraints preventing key creation

  4. Execution Flow: The program must follow this sequence:
     - A memory allocation request fails (due to LD_PRELOAD override)
     - memory_exhausted() is called
     - pthread_once() triggers tsd_init() for thread-local storage initialization
     - pthread_key_create() fails during this initialization
