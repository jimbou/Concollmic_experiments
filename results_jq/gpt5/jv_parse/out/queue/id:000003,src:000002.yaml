  1. Process invocation and arguments
  - The executable is invoked with exactly one non-empty filter argument and no input file paths: argv count must be 2; argv[0] = path to the executable; argv[1] = a non-empty string (e.g., ".") used as a filter. No other command-line arguments are present.
  - No environment variables are required; defaults are acceptable. Standard input (stdin) provides the JSON; no file reading is performed.

  2. Standard input properties
  - Encoding: UTF-8 without a Byte Order Mark (BOM). The first three bytes MUST NOT be 0xEF, 0xBB, 0xBF.
  - Input is a single, complete JSON text. The first non-whitespace byte must be '[' because an array is being parsed.
  - The parser operates in non-streaming mode: ensure that the API entry point that the executable uses sets the parser flags to 0 (no JV_PARSE_STREAMING or JV_PARSE_SEQ). No RS (record separator) characters (ASCII 0x1E) appear in input.
  - The input is provided as one contiguous buffer with is_partial = 0 (no incremental streaming), but this is a property of the runtime; the input must be syntactically complete so the runtime can mark EOF after consumption.

  3. JSON grammar constraints ensuring comma token is produced and handled in parse_token()
  - Structure: The top-level JSON value MUST be an array with at least two elements so that a comma is encountered between elements. This guarantees that the scanner classifies ',' as STRUCTURE and dispatches token(p, ',') to parse_token().
  - Elements must be valid JSON values and must not require streaming semantics. Examples of valid element kinds: numbers, strings (with proper escapes, no unescaped control characters U+0000–U+001F), booleans, null, arrays, or objects.
  - There must be no trailing commas and no syntax errors.

  4. Additional constraints to ensure non-object paths and exercise the array comma handling (not object comma handling)
  - The array elements should be primitive literals (e.g., numbers or strings) so that object-specific paths ('{' and ':') are not triggered. Avoid '{' and ':' tokens inside elements, unless nested arrays/objects are properly closed; however, to isolate the comma path in arrays, prefer elements without '{' or ':' at the top level.
  - The array must contain at least two adjacent elements separated by a single comma. Whitespace between elements and comma is optional; if present, it must be standard JSON whitespace (space, tab, CR, LF).

  5. Tokenization and literal handling constraints
  - If elements are numeric: each numeric token must be a valid JSON number per RFC 8259 (no leading '+', properly formed exponent if present, no trailing non-numeric characters). The scanner will call check_literal() before handling the comma; numbers must be fully recognized so that p->next becomes valid and the comma is then processed.
  - If elements are strings: they must be enclosed in double quotes ("…"), with escapes validated by found_string(); no single quotes are allowed. Control characters must be escaped.
  - Booleans/null: must be exactly "true", "false", or "null" with no extra characters.

  6. Array closure constraints (to keep the parser in non-error state after comma processing)
  - After the comma and the second element, the array must be properly closed with a ']' and the input must end there (modulo optional trailing whitespace). No extra top-level tokens may follow.
  - The array must not be empty before encountering the comma; at least one complete element must precede the comma, and at least one valid element must follow it.

  7. Error-avoidance constraints
  - Depth limit: The nesting depth must remain below MAX_PARSING_DEPTH (10000). Using a shallow array satisfies this.
  - Matching brackets: Ensure '[' has a matching ']' and that the stack top is an array when ']' is encountered.
  - No BOM stripping paths: Because no BOM is present, BOM-related branches remain bypassed; this keeps execution in the non-BOM path.

  These constraints collectively guarantee that the parser receives a non-streaming JSON array with two or more valid elements, causing the scanner to classify ',' as a STRUCTURE token and dispatch to parse_token(), thereby executing the comma-handling branch body in the non-streaming parser.
