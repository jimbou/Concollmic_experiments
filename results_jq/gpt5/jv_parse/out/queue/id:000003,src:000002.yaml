  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      # Executable path (jq-compatible binary)
      exe = "./temp_executable"

      # Provide a single, complete JSON array so the first non-whitespace byte is '['
      # No BOM, UTF-8 encoded, single top-level value, properly closed with ']'
      json_input = "[]"

      try:
          result = subprocess.run(
              [str(exe), "."],          # Exactly one non-empty filter argument, no input files
              input=json_input,            # Provide JSON via stdin
              text=True,                   # Text mode
              encoding="utf-8",          # Explicit UTF-8 encoding (no BOM)
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr or "", -signal.SIGKILL
