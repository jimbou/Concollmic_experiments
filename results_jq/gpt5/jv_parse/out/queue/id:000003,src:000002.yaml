    p->stack = 0;
    p->stacklen = p->stackpos = 0;
    p->last_seen = JV_LAST_NONE;
    p->output = jv_invalid();
    p->next = jv_invalid();
    p->tokenbuf = 0;
    p->tokenlen = p->tokenpos = 0;
    if ((p->flags & JV_PARSE_SEQ))
      p->st = JV_PARSER_WAITING_FOR_RS;
    else
