        c = *in++;
        switch (c) {
        case '\\':
        case '"':
        case '/': *out++ = c;    break;
        case 'b': *out++ = '\b'; break;
        case 'f': *out++ = '\f'; break;
        case 't': *out++ = '\t'; break;
        case 'n': *out++ = '\n'; break;
        case 'r': *out++ = '\r'; break;

        case 'u':
