              input=json_input,            # Provide JSON via stdin
              text=True,                   # Text mode
              encoding="utf-8",          # Explicit UTF-8 encoding (no BOM)
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

