  import subprocess
  import signal
  from pathlib import Path

  def execute_program(timeout: int) -> tuple[str, int]:
      # Executable path (jq-compatible binary)
      exe = "./temp_executable"

      # Valid JSON object with at least one key/value pair to ensure ':' is parsed
      # Starts directly with '{' (no BOM), uses a valid key string and a simple numeric value
      json_input = "{\"key\": 1}"

      try:
          result = subprocess.run(
              [str(exe), "."],        # Exactly one filter argument, no files
              input=json_input,         # Provide complete JSON via stdin
              text=True,                # UTF-8 text input
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr or "", -signal.SIGKILL
