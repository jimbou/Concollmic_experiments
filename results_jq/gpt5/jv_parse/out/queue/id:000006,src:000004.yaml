  import subprocess
  import signal
  from pathlib import Path

  def execute_program(timeout: int) -> tuple[str, int]:
      # Target executable (jq-compatible binary)
      exe = "./temp_executable"

      # JSON input designed to satisfy constraints:
      # - Starts with '[' as the very first byte (no BOM, no whitespace prefix)
      # - Valid JSON array (empty), single top-level value, UTF-8 compatible
      # - Short enough to likely be read in a single chunk
      json_input = "[]"

      try:
          # Enable streaming mode with --stream and use identity filter '.'
          # Inputs are provided on stdin as a single JSON value
          result = subprocess.run(
              [str(exe), "--stream", "."],
              input=json_input,
              text=True,
              encoding="utf-8",
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr or "", -signal.SIGKILL
