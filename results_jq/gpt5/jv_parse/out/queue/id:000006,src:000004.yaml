  import subprocess
  import signal
  import os
  from pathlib import Path

  def execute_program(timeout: int) -> tuple[str, int]:
      # Target executable (jq-compatible binary)
      exe = "./temp_executable"

      # JSON input satisfying the target constraints:
      # - First byte is '{' (0x7B)
      # - Valid single JSON value rooted at an object
      # - No BOM and no leading whitespace
      json_input = "{}"

      # Validate executable availability and permissions
      exe_path = Path(exe)
      if not exe_path.exists():
          raise FileNotFoundError(f"Executable not found: {exe}")
      if not os.access(exe, os.X_OK):
          raise PermissionError(f"Executable is not executable: {exe}")

      try:
          result = subprocess.run(
              [str(exe), "--stream", "."],
              input=json_input,
              text=True,
              encoding="utf-8",
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr or "", -signal.SIGKILL
