  static chclass classify(char c) {
    switch (c) {
    case ' ':
    case '\t':
    case '\r':
    case '\n':
      return WHITESPACE;
    case '"':
      return QUOTE;
    case '[':
    case ',':
    case ']':
    case '{':
    case ':':
    case '}':
      return STRUCTURE;
    default:
      return LITERAL;
    }
