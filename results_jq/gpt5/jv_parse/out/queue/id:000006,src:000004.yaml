  static int unhex4(char* hex) {
    int r = 0;
    for (int i=0; i<4; i++) {
      char c = *hex++;
      int n;
      if ('0' <= c && c <= '9') n = c - '0';
      else if ('a' <= c && c <= 'f') n = c - 'a' + 10;
      else if ('A' <= c && c <= 'F') n = c - 'A' + 10;
      else return -1;
      r <<= 4;
      r |= n;
    }
    return r;
  }

