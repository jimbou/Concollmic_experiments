  2. Input delivery method
  - Provide input via standard input (stdin) as a single JSON value. Encoding must be UTF-8, with no leading byte-order mark (BOM) and no preceding whitespace or other characters before the first byte.
  - The very first byte of the input must be the left-brace character '{' (0x7B), so that the parser’s first STRUCTURE token encountered is '{'. This ensures stream_token() is invoked with ch == '{'.

  3. JSON syntactic well-formedness up to at least the object start
  - The input must remain syntactically valid JSON so that the parser stays in JV_PARSER_NORMAL state and does not error out before or at '{'.
