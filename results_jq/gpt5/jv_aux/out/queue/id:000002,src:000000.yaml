  import subprocess
  import signal
  import os

  def execute_program(timeout: int) -> tuple[str, int]:
      """
      Execute the original test harness with concrete inputs satisfying the target path constraints:
      - argv: ["./temp_executable", "."]
      - stdin: a single, well-formed UTF-8 JSON value that is NOT an object (here: an empty array "[]")
      - No additional flags/options
      - Small input to avoid timeouts
      Returns: (stderr, return_code)
      """
      exe = "./temp_executable"

      # Non-object, valid JSON value to force jv_get_kind(x) != JV_KIND_OBJECT
      json_input = "[]"  # UTF-8, single value, no BOM, no extra tokens

      # Pre-flight checks for executable presence and permissions
      if not os.path.isfile(exe):
          raise FileNotFoundError(f"Executable not found at path: {exe}")
      if not os.access(exe, os.X_OK):
          raise PermissionError(f"Executable is not runnable: {exe}")

      try:
          result = subprocess.run(
              [exe, "."],            # Exactly two argv entries: program path and filter "."
              input=json_input,        # Provide the JSON on stdin
              text=True,
              encoding="utf-8",       # Ensure UTF-8 encoding per constraint
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          # Return stderr if available and a negative code indicating kill
          return e.stderr or "", -signal.SIGKILL
