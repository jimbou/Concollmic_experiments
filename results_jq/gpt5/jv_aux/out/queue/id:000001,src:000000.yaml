  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      exe = "./temp_executable"  # jq binary path

      # Provide non-object JSON to satisfy jv_get_kind(x) != JV_KIND_OBJECT
      # Using an empty array ensures the top-level JSON type is Array, not Object
      json_input = "[]"

      try:
          result = subprocess.run(
              [str(exe), "."],       # Keep filter as a single dot
              input=json_input,        # UTF-8 JSON on stdin
              text=True,
              encoding="utf-8",
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr or "", -signal.SIGKILL
