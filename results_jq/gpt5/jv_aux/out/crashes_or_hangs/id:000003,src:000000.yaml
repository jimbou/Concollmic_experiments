  import subprocess
  import signal
  from pathlib import Path

  def execute_program(timeout: int) -> tuple[str, int]:
      # Path to jq-compatible executable
      exe = "./temp_executable"

      # Use a filter that triggers jv_keys_unsorted
      # and provide a non-object JSON value so that jv_get_kind(x) != JV_KIND_OBJECT is true
      filter_str = "keys_unsorted"

      # Valid, non-object JSON input (UTF-8 encoded string)
      json_input = "\"abc\"\n"

      try:
          result = subprocess.run(
              [str(exe), filter_str],  # FILTER only, no extra args
              input=json_input,        # Single, well-formed non-object JSON value
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr or "", -signal.SIGKILL
      except FileNotFoundError as e:
          raise RuntimeError(f"Executable not found or not executable: {exe}") from e
      except Exception as e:
          # Surface unexpected execution issues
          raise
