     - Formal constraint (size/shape): Let N be the total byte length of stdin. Require N to be large enough that, in the implementation, at least one call to realloc attempts to allocate a new block of size S where S exceeds available memory under the environment constraints in steps 3–4. The JSON must remain well-formed (no syntax errors) to ensure the parsing continues to the point of allocation growth.

