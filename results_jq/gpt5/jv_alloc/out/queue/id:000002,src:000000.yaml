justification: This branch guards the out-of-memory error-handling path when a heap
  allocation fails. It has 0% historical coverage (the body is annotated as Unexecuted).
  Exercising it will validate the allocator’s failure-handling and invoke the nomem
  handler pathway, which is critical for robustness. Importantly, this branch can
  be reached without changing the test harness by constraining the runtime environment
  (process memory limits) so that malloc returns NULL early in program startup, even
  with the fixed filter "." and minimal JSON input. This provides new behavior distinct
  from normal runs and meaningfully increases coverage in core error paths.
target_path_constraint: |-
  Chronological constraints to reach jv_alloc.c:jv_mem_alloc(size_t sz) with malloc() returning NULL (if (!p) -> true):

  1) Program invocation (command-line arguments):
  - The executable must be invoked exactly as: <path-to-exe> followed by a single argument that is the jq filter string ".". No input file path is provided; instead, JSON is provided via standard input.
  - Standard input must contain valid JSON (any minimal valid JSON suffices; e.g., an empty object). This ensures the JSON parser initializes and proceeds far enough to perform heap allocations through jv_mem_alloc().

  2) Environment and resource limits (to force allocation failure):
  - Impose a strict soft and hard limit on the process’s virtual memory (address space) and data segment (heap) such that any attempt to allocate memory larger than a small threshold fails immediately with malloc() returning NULL. This can be achieved using OS-level resource limit controls prior to launching the process. Requirements:
    a. RLIMIT_AS (virtual memory size) hard and soft limits must be set to a very small value in bytes, smaller than the first allocation size requested by the program during startup. Both rlim_cur and rlim_max must be equal and set (the exact byte value is not specified here; it must be below the program’s initial allocation request).
    b. RLIMIT_DATA (maximum size of the data segment) must also be set to the same very small value, below the initial allocation request.
    c. If the platform enforces memory overcommit or ignores RLIMITs, additionally disable memory overcommit or configure the environment such that malloc adheres to these limits, ensuring it returns NULL immediately when limits are exceeded.
    d. No ulimit or cgroup configuration should allow more memory than specified above. If cgroups are in use, the memory.max (or equivalent) must be set to a value below the initial allocation request.

  3) Platform feature constraints related to thread-local storage (to keep control predictable but not required for this branch):
  - The platform may or may not define USE_TLS / HAVE_PTHREAD_KEY_CREATE. No specific setting is required to reach malloc failure; however, the process must not crash prior to the first jv_mem_alloc call and must run far enough to attempt heap allocation.

  4) I/O and permissions:
  - The executable must be readable and executable.
  - Standard input must be readable by the process and supply valid JSON as above.

  5) Timing:
  - No timeout should terminate the process before the initial allocation occurs; the process must be allowed to reach the first call to jv_mem_alloc().

  6) Functional relationship to trigger the branch:
  - Let S be the size of the first allocation performed through jv_mem_alloc() during program initialization or parsing. The environment memory limits must satisfy: RLIMITs and/or cgroup limits < S, causing malloc(S) to return NULL. Symbolically: Limit_bytes < S.
  - Additionally, any earlier allocations required to start the process must succeed or be negligible compared to the configured limits so that the program execution reaches the jv_mem_alloc(size_t sz) call that requests S bytes. If unavoidable, configure limits to allow startup but fail at or before this jv_mem_alloc call.

  These constraints, applied before launching the executable, will force malloc() to return NULL for the first relevant allocation in jv_mem_alloc(), making the branch condition (!p) evaluate to true.
