  1. Program invocation via harness:
     - Command-line must be exactly two arguments to the executable: the executable path and a JSON filter string. The filter provided must be a valid jq-style identity filter to force JSON parsing and evaluation without prematurely aborting. Constraint: argv = ["./temp_executable", "."].

  2. Standard input content (JSON document):
     - Provide a syntactically valid JSON text (UTF-8 encoded) that is extremely large, such that the process needs to allocate memory via malloc() in its parsing or evaluation pipeline. The JSON must not be malformed to avoid early parse errors that bypass heavy allocations.
     - Structural constraint: The top-level value must be valid JSON (object, array, string, number, boolean, or null). Prefer an object or array with a very large number of elements or very large strings to ensure allocator pressure.
     - Size constraint: The total byte length of stdin must exceed the process’s available memory budget so that at least one malloc(size_t sz) call returns NULL. This can be achieved by:
       a) A single string value whose declared length (number of characters between quotes) is huge, or
       b) An array/object with an enormous count of elements/entries, or
       c) Deeply nested structures that trigger exponential or very large allocations.
     - Validity requirement: Despite its size, the JSON must obey RFC 7159/ECMA-404 rules—proper commas, colons, brackets/braces matching, proper escaping in strings—so the parser continues attempting to parse and allocate.

  3. Process and environment conditions:
     - No OS-imposed input size caps in the harness (stdin accepts full content). Ensure the environment does not prematurely truncate or signal errors before allocation attempts (e.g., avoid timeouts shorter than needed; the harness already sets a timeout but it must be sufficiently long for allocation to occur until OOM).
     - System memory limits must be constrained relative to the JSON size to force malloc() to fail. Constraints:
       a) The process RLIMIT_AS (address space) and/or RLIMIT_DATA must be set low enough (or left at default if small) so that the parser’s attempted allocations exceed these limits.
       b) Alternatively, available physical+swap memory must be insufficient to satisfy allocations of the given sizes.
     - The locale/encoding must be UTF-8 or compatible; stdin must not include invalid byte sequences that would cause immediate parse errors unrelated to memory allocation.

  4. Parsing/evaluation continuity constraints:
     - The filter "." must be syntactically valid and not invoke operations that avoid parsing (e.g., empty filter). It must consume the input and produce/propagate the parsed value, ensuring allocator calls for token buffers, AST, and value storage.
     - The JSON must avoid special cases that are optimized with small fixed allocations (e.g., tiny literals like {} or []). It must be large enough to trigger multiple allocations via jv_mem_alloc so that one call has sz > 0 and malloc returns NULL.

  5. OOM triggering predicate:
     - There must exist at least one allocation request malloc(sz) during parsing or value construction such that sz > 0 and malloc returns NULL due to memory exhaustion or resource limits. Formally: ∃ sz ∈ N, sz > 0, during execution of parsing/evaluation over the provided JSON, malloc(sz) == NULL.

