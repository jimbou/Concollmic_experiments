exec_code: |-
  import subprocess
  import signal
  import resource
  from pathlib import Path

  def execute_program(timeout: int) -> tuple[str, int]:
      # Set very restrictive memory limits to force malloc to fail
      # We limit the address space (RLIMIT_AS) to 500KB
      memory_limit_kb = 500
      resource.setrlimit(resource.RLIMIT_AS, (memory_limit_kb * 1024, memory_limit_kb * 1024))
      
      # Also limit the data segment (RLIMIT_DATA) as a backup strategy
      resource.setrlimit(resource.RLIMIT_DATA, (memory_limit_kb * 1024, memory_limit_kb * 1024))
      
      exe = "./temp_executable"  # jq binary
      json_input = "{}"  # Minimal valid JSON

      try:
          result = subprocess.run(
              [str(exe), "."],  # FILTER only
              input=json_input,  # JSON provided explicitly
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr or "", -signal.SIGKILL
