  import subprocess
  import sys
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      
      # Create XML input with an unrecognized encoding
      # Using "UNKNOWN_ENCODING" as specified in the constraints
      xml_input = "<?xml version=\"1.0\" encoding=\"UNKNOWN_ENCODING\"?>\n<root></root>\n"

      try:
          result = subprocess.run(
              ["./temp_executable"],     # xmlwf binary
              input=xml_input,           # sent to stdin
              text=True,
              capture_output=True,
              timeout=timeout,
          )

          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception as e:
          raise e
