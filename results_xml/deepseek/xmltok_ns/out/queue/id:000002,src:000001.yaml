target_path_constraint: |-
  1. XML Input Format: The input must be a valid XML declaration with an encoding attribute
     - Must start with "<?xml" declaration
     - Must contain "encoding=" attribute with a recognized encoding name

  2. Encoding Recognition: The encoding specified in the XML declaration must be a recognized encoding
     - The encoding name must match one of the supported encodings (e.g., "UTF-8", "UTF-16", "ISO-8859-1", "ASCII")
     - The encoding name must NOT be "UNKNOWN_ENCODING" or any other unrecognized value

  3. XML Declaration Parsing: The XML declaration must be syntactically correct
     - Proper XML declaration syntax: <?xml version="1.0" encoding="ENCODING_NAME"?>
     - The encoding attribute value must be properly quoted and formatted
     - No parsing errors in the XML declaration

  4. Buffer Constraints: The encoding name must fit within the internal buffer
     - Encoding name length must be less than ENCODING_MAX (128 characters)
     - No buffer overflow during encoding name conversion

  5. UTF-16 Special Case: If the encoding is "UTF-16", additional constraints apply
     - The current encoding's minBytesPerChar must be 2 (indicating UTF-16 encoding)
     - This would trigger a different code path (line 116), so for our target branch, either:
       a) Encoding is not "UTF-16", OR
       b) Encoding is "UTF-16" but current encoding's minBytesPerChar is not 2
