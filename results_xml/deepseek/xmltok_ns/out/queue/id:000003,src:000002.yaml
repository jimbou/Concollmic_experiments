exec_code: |-
  import subprocess
  import sys
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      
      # Create XML input that satisfies all constraints:
      # - Valid XML declaration with prolog
      # - Contains actual XML content (not empty)
      # - Complete element with opening and closing tags
      # - Element contains text content
      # - UTF-8 encoding specified and compatible
      xml_input = """<?xml version="1.0" encoding="UTF-8"?>
  <root>test content</root>"""

      try:
          result = subprocess.run(
              ["./temp_executable"],     # xmlwf binary
              input=xml_input,           # sent to stdin
              text=True,
              capture_output=True,
              timeout=timeout,
          )

          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception as e:
          raise e
