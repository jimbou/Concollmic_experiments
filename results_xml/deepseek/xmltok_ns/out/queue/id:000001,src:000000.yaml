justification: This branch has 0% historical coverage and represents error handling
  for unknown XML encodings. It's important because it tests the program's ability
  to handle invalid or unsupported encoding specifications, which is a critical error
  condition in XML parsing. Unlike some other 0% coverage branches that depend on
  compile-time constants (like BYTEORDER), this branch can be reached through runtime
  input manipulation by providing an unknown encoding name.
target_path_constraint: |-
  1. XML Input Format: The input must be valid XML that includes an encoding declaration
  2. Encoding Declaration: The XML declaration must specify an encoding name that is not recognized by the parser
     - The encoding name must appear in the XML declaration: `<?xml version="1.0" encoding="UNKNOWN_ENCODING"?>`
     - The encoding name must not match any of the supported encodings (UTF-8, UTF-16, ASCII, Latin1, etc.)
  3. XML Structure: The XML must be well-formed enough to reach the encoding parsing stage
     - Must start with a valid XML declaration
     - Must not contain syntax errors that would cause parsing to fail before encoding detection

  Specifically, the XML input must contain an encoding attribute with an unsupported value, such as:
  - An encoding name that doesn't exist in the parser's encoding table
  - A misspelled encoding name (e.g., "UTF8" instead of "UTF-8")
  - A custom or proprietary encoding name not implemented in the parser
selected_cnt: 1
successful_generation_cnt: 1
exec_code: |-
  import subprocess
  import sys
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      
      # Create XML input with an unrecognized encoding
      # Using "UNKNOWN_ENCODING" as specified in the constraints
      xml_input = "<?xml version=\"1.0\" encoding=\"UNKNOWN_ENCODING\"?>\n<root></root>\n"

      try:
          result = subprocess.run(
              ["./temp_executable"],     # xmlwf binary
              input=xml_input,           # sent to stdin
              text=True,
              capture_output=True,
              timeout=timeout,
          )

          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception as e:
          raise e
