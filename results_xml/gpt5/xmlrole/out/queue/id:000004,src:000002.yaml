exec_code: |
  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      # Concrete input to satisfy the target path constraints:
      # 1) Start with <!DOCTYPE in uppercase and no leading whitespace
      # 2) Provide a valid root name ("root") and open internal subset with '['
      # 3) Inside the internal subset, immediately provide a declaration starting with <!ELEMENT
      # 4) Use a valid ELEMENT declaration body and close it with '>'
      # 5) Close the internal subset with ']' and close the DOCTYPE with '>'
      # 6) Provide a matching root element instance
      # All bytes are plain ASCII and newlines are LF.
      xml_input = "<!DOCTYPE root [<!ELEMENT root ANY>]>\n<root></root>\n"

      try:
          result = subprocess.run(
              ["./temp_executable"],
              input=xml_input,
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          # Return consistent tuple on timeout
          return (e.stderr if hasattr(e, 'stderr') else ''), -signal.SIGKILL

      except Exception as e:
          # Propagate unexpected execution issues
          raise e
