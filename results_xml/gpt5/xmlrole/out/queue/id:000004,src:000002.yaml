  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      # Construct input to reach doctype1() with XML_TOK_OPEN_BRACKET:
      # - Start immediately with "<!DOCTYPE" (ASCII, no BOM, no leading whitespace)
      # - Uppercase "DOCTYPE", followed by a space and a valid Name ("root")
      # - Optional whitespace, then an open bracket '[' to begin an internal subset
      # - Immediately close the internal subset with ']' and close the DOCTYPE with '>'
      # - Provide a matching root element instance
      xml_input = "<!DOCTYPE root [ ]>\n<root></root>\n"

      try:
          result = subprocess.run(
              ["./temp_executable"],
              input=xml_input,
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception as e:
          raise e
