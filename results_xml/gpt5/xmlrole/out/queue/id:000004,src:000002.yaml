target_path_constraint: |-
  Input/Environment model to reach internalSubset(): XML_TOK_DECL_OPEN with keyword ELEMENT matched

  Channel & encoding
  1) The program reads a single XML document from standard input as a Unicode-free 8-bit byte stream. Use plain ASCII characters only (no BOM, no multibyte encodings). Do not prefix the stream with a Byte Order Mark. Newlines may be either LF or CRLF; assume LF for simplicity.

  High-level structure constraints (chronological)
  2) The very first non-whitespace characters must start a DOCTYPE declaration so that the tokenizer enters prolog0 -> doctype0 path:
     - Start of stream: the two-character sequence "<!" followed immediately by the uppercase keyword "DOCTYPE" (ASCII letters D O C T Y P E). The bytes must exactly spell "<!DOCTYPE" with no leading whitespace and with letters in uppercase.
  3) Immediately after the literal "<!DOCTYPE", there must be at least one whitespace character (space or newline) followed by a valid XML Name for the root element (e.g., letters and digits with the first character being a letter or underscore). Name must be non-empty and ASCII-only.
  4) After the DOCTYPE name, the next token must open an internal subset by providing an open square bracket '[' before closing the DOCTYPE. There may be optional whitespace before '['. This causes doctype1 to produce XML_TOK_OPEN_BRACKET and transition to internalSubset.

  Triggering the target branch within the internal subset
  5) Inside the internal subset (between '[' and the matching ']'), the next markup must be a declaration opening sequence that begins with "<!ELEMENT" in uppercase immediately after the "<!". The exact bytes must be:
     - A literal '<', then '!', then the uppercase letters 'E','L','E','M','E','N','T' with no intervening characters.
     - At least one whitespace character after the keyword to separate it from its parameters.
     These bytes ensure the tokenizer yields XML_TOK_DECL_OPEN and XmlNameMatchesAscii(..., KW_ELEMENT) evaluates true.
  6) The <!ELEMENT ...> declaration must be syntactically well-formed so the tokenizer can progress to a token boundary. Provide a minimal but valid element declaration body and close it with a closing angle bracket '>'. Examples of valid forms include declaring a content model like "EMPTY", "ANY", or a parenthesized model. Do not rely on examples here; instead enforce:
     - After whitespace following "<!ELEMENT", provide a valid XML Name for the element being declared (ASCII, starts with letter or underscore, followed by letters/digits/._-: as per Name rules; avoid colon if namespaces are not enabled).
     - Provide at least one whitespace, then a valid content model token (choose one of: the uppercase keywords "EMPTY" or "ANY"; or a parenthesized model with valid names and separators). Ensure ASCII uppercase for these keywords.
     - Close the declaration with '>'.
  7) Close the internal subset with a closing square bracket ']' after any necessary whitespace, then immediately close the DOCTYPE with '>'.

  Post-prolog instance to keep the parser advancing
  8) After the DOCTYPE is closed, provide a matching root element instance in the document entity so that tokenization of subsequent prolog states can complete without error:
     - A start-tag: '<' + the same root name used in step 3 + '>'
     - A matching end-tag: '</' + same name + '>'
     - Optionally, place a newline between markup; ensure ASCII only.

  Whitespace rules and case-sensitivity
  9) All XML keywords in the DOCTYPE and ELEMENT declarations must be uppercase exactly as specified. Whitespace between tokens is allowed where XML permits but must not break required adjacency like between '<' and '!'.

  Summary of minimal byte-sequence ordering
  10) Concatenate in order with optional single spaces/newlines where indicated:
     a) "<!DOCTYPE" + space + RootName + space + '['
     b) "<!ELEMENT" + space + DeclaredElementName + space + ContentModel + '>'
     c) ']' + '>'
     d) '<' + RootName + '>' + '</' + RootName + '>'
