  - Immediately after the document type name, insert optional whitespace, then an open square bracket '[' character to begin an internal subset. This must occur before any closing '>' of the DOCTYPE declaration. The '[' character must be followed by valid internal subset content or by a closing bracket and declaration close later; however, for reaching the target branch, only the presence of '[' is required at this point.

