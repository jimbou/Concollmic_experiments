  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      # Construct input that satisfies the DOCTYPE prolog0 path constraints:
      # - Starts immediately with "<!DOCTYPE" (no BOM, no leading whitespace)
      # - Uppercase "DOCTYPE" followed by a space and a valid Name ("root")
      # - Closes the declaration with '>' and then provides a matching root element
      xml_input = "<!DOCTYPE root>\n<root></root>\n"

      try:
          result = subprocess.run(
              ["./temp_executable"],
              input=xml_input,
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception as e:
          raise e
