  1. Program invocation and I/O mode:
  - The executable must be run without command-line arguments affecting encoding; input is provided exclusively via STDIN.
  - STDIN must be supplied as raw bytes (no re-encoding by the harness). The harness already sets text=False, which satisfies this.

  2. Initial byte pattern (first two bytes at the very beginning of the input stream):
  - Byte[0] == 0xFE and Byte[1] == 0xFF (big-endian UTF-16 BOM). This ensures that the 16-bit value formed by (Byte[0] << 8) | Byte[1] equals 0xFEFF, matching the BOM case in the switch.

  3. Parser state and external encoding index constraints (to avoid early-break conditions):
  - The detection must not be in XML_CONTENT_STATE with INIT_ENC_INDEX(enc) set to ISO_8859_1_ENC. Since the harness is feeding a document entity (not an external parsed general entity) and does not specify an external protocol encoding, this condition is naturally avoided. To be explicit:
    • Ensure the input represents a well-formed XML document (starts with XML prolog or an element) so the parser runs in prolog state, not external content state.
    • No external encoding is declared via protocol (e.g., no Content-Type header is provided); INIT_ENC_INDEX(enc) must be anything other than ISO_8859_1 when state == XML_CONTENT_STATE. The simplest way in STDIN context is to rely on default behavior (no external encoding specified).

  4. Post-BOM continuation bytes (to allow tokenization to proceed after selecting UTF_16BE encoding):
  - Provide at least one complete UTF-16BE code unit (2 bytes) following the BOM to avoid partial token conditions and to allow XmlTok to return a token. The next two bytes must encode a legal XML character in UTF-16BE.
  - The first non-BOM character must be a legal starting character for an XML document, ideally the ASCII character '<' encoded in UTF-16BE: high byte 0x00, low byte 0x3C (i.e., 0x00 0x3C). This ensures the tokenizer can proceed without hitting partial or illegal token paths.

  5. Stream completeness:
  - Ensure the input provides enough bytes to represent a minimal well-formed XML document in UTF-16BE, to keep the tokenizer from returning XML_TOK_PARTIAL. For example, after BOM and '<', include a minimal element name and proper termination encoded in UTF-16BE, ending cleanly with no trailing partial code unit. While exact content is not required here, it must meet these constraints:
    • All UTF-16 code units are complete: total byte length after BOM is a multiple of 2.
    • The document forms a syntactically valid XML element or prolog + element so that tokenization succeeds.

  Summary SMT-style (for the first bytes):
  - b0 = 0xFE, b1 = 0xFF
  - b2..bN form pairs (b2k, b2k+1) with k>=1 such that for all k, 0 <= b2k, b2k+1 <= 255 and total count after BOM is even.
  - First non-BOM pair equals (0x00, 0x3C) representing '<'.
  - The remaining pairs encode a legal, complete minimal XML document in UTF-16BE.
