  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      # UTF-16LE without BOM, starts with 0x3C 0x00 ('<')
      # Minimal well-formed XML element: "<a/>"
      xml_bytes = b"\x3C\x00\x61\x00\x2F\x00\x3E\x00"

      try:
          result = subprocess.run(
              ["./temp_executable"],
              input=xml_bytes,          # send raw bytes to stdin
              text=False,               # ensure no implicit re-encoding
              capture_output=True,
              timeout=timeout,
          )

          stderr = result.stderr
          if isinstance(stderr, bytes):
              try:
                  stderr = stderr.decode('utf-8', errors='replace')
              except Exception:
                  stderr = stderr.decode('latin-1', errors='replace')

          return stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          stderr = e.stderr
          if isinstance(stderr, bytes):
              try:
                  stderr = stderr.decode('utf-8', errors='replace') if stderr is not None else ''
              except Exception:
                  stderr = stderr.decode('latin-1', errors='replace') if stderr is not None else ''
          elif stderr is None:
              stderr = ''
          return stderr, -signal.SIGKILL

      except Exception as e:
          raise e
