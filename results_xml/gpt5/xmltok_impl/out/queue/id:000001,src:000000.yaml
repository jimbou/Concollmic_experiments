exec_code: |-
  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      # XML crafted to ensure the tokenizer reads '<' followed by '!' (BT_EXCL),
      # by starting with a well-formed comment declaration in the prolog.
      # ASCII-only, UTF-8 encoding, no BOM.
      xml_input = "<!--concolic--><root></root>\n"

      try:
          result = subprocess.run(
              ["./temp_executable"],
              input=xml_input,
              text=True,
              encoding="utf-8",  # ensure UTF-8 single-byte classification
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception as e:
          raise e
