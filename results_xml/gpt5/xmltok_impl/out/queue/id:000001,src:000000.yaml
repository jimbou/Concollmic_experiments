  1. Program invocation and I/O channel:
  - The executable must be invoked with no required command-line arguments (the harness already runs "./temp_executable"), and data must be supplied via standard input (stdin). Ensure stdin is a text stream encoded in UTF-8 (single-byte per character) without BOM, so that token classification uses 1-byte code units.

  2. Overall XML well-formedness up to the target point (to ensure the tokenizer advances into content scanning and reaches a '<' that is part of markup):
  - The input must start with optional prolog or root element markup that is syntactically acceptable to the tokenizer so it proceeds into content tokenization. The tokenizer must read until a '<' character that begins markup. No invalid characters or incomplete multibyte sequences may appear before the target sequence.

  3. Positioning the target sequence:
  - After the tokenizer reaches a position where it calls PREFIX(contentTok) and then PREFIX(scanLt) (which happens whenever a '<' is read in content or prolog), the next character following '<' must be the exclamation mark '!'. Formally, ensure the byte sequence "<!" occurs at a point where markup is allowed (either in the prolog or within element content).

  4. Avoid confounding conditions that could divert control flow:
  - Do not place a '?' immediately after '<' at the targeted position (which would route to processing-instruction path), nor '/' (which would route to end-tag), nor a valid name-start character (which would route to start-tag). It must be '!'.
  - Ensure that the input up to and including "<!" is complete within stdin (no premature EOF), so REQUIRE_CHAR(enc, ptr, end) succeeds and BYTE_TYPE(enc, '!') is classified as BT_EXCL.

  5. Minimal structural constraints around the "<!" to keep the tokenizer progressing:
  - Immediately following "<!", provide at least one additional ASCII character to avoid partial tokens. Depending on the declaration kind, different continuations are acceptable (e.g., "--" for a comment, "[CDATA[" for a CDATA section, or "DOCTYPE" for a doctype declaration). The exact continuation is flexible for this target; the only requirement is that the tokenizer sees '!'.

  6. Termination and completeness:
  - The stdin must contain enough trailing characters to allow scanLt to return a token (e.g., completing the comment/decl opener sufficiently for the tokenizer to produce a token rather than XML_TOK_PARTIAL). Avoid truncation right after "<!".

  These constraints ensure the tokenizer executes PREFIX(contentTok) → PREFIX(scanLt), takes the BT_EXCL branch when switching on the character after '<', and enters the comment/markup-declaration handling path.
