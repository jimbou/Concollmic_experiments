     b. An equals sign “=” optionally surrounded by whitespace.
     c. An attribute value enclosed in matching quotes: either double quotes “"” or single quotes “'”. Inside the quotes, provide at least one character that is not a closing quote. Entity references are optional and not required; plain ASCII characters suffice.
