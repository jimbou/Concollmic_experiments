  def execute_program(timeout: int) -> tuple[str, int]:
      import subprocess
      import signal

      # Construct XML that satisfies the target path constraints:
      # - Starts with a valid element name
      # - Immediately followed by a whitespace byte (space 0x20)
      # - Contains at least one syntactically valid attribute
      # - Terminates the start tag with '>' (not '/>')
      # - Avoids colons and ampersands, uses plain ASCII
      # - Includes a matching end tag and simple content
      xml_input = '<root id="1">ok</root>\n'

      try:
          result = subprocess.run(
              ["./temp_executable"],
              input=xml_input,
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception as e:
          raise e
