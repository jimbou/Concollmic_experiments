target_path_constraint: |-
  Chronological, self-contained constraints to reach NS(findEncoding): if (ptr != end) -> true

  1. Process execution and I/O encoding
  - Launch the program executable with no command-line arguments.
  - Provide input exclusively via standard input (stdin), as a single UTF-8 encoded text stream without a byte order mark (BOM).
  - Ensure the operating system and locale do not alter or re-encode stdin (no external transcoding); stdin bytes must be interpreted as UTF-8 by the program.

  2. XML document structure (well-formedness)
  - The first bytes of stdin must start with an XML declaration, followed immediately by a well-formed minimal document to allow parsing to proceed to and through the declaration. Example structure (described, not instantiated):
    a) XML declaration: begins with "<?xml" followed by whitespace, attributes, and ends with "?>".
    b) After the declaration, include a single root element with a matching closing tag.

  3. XML declaration attribute requirements
  - The XML declaration must include the attribute "version" with a syntactically valid value (e.g., "1.0") before any other attributes, to allow the parser to accept the declaration.
  - The XML declaration must include the attribute "encoding" whose value meets the following conditions (see 4): the value consists solely of valid XML Name characters encoded in UTF-8 and is enclosed in double quotes (or single quotes) per XML rules.

  4. Encoding attribute value size and conversion pressure (to force ptr != end)
  - The encoding attribute value must be a single token (no spaces) whose UTF-8 byte length strictly exceeds the capacity available in the destination buffer used by the parser for the encoding name.
  - Capacity baseline: The parser copies the encoding name into an internal buffer of fixed maximum size ENCODING_MAX = 128 bytes and reserves space for a trailing NUL terminator. Therefore, the effective maximum storable length is 127 bytes.
  - Constraint: Let L be the number of bytes of the encoding attribute value when encoded in UTF-8. Require L > 127.
  - Additionally, the value must be composed of bytes that represent valid XML Name characters and are valid UTF-8 so that the converter (XmlUtf8Convert) consumes some bytes successfully before reaching buffer capacity.
  - The encoding name must not include characters that terminate the attribute value early (no quote characters matching the opener inside the value, no whitespace, no "?>").

  5. Document completeness
  - Close the encoding attribute quote properly and terminate the XML declaration with "?>".
  - Provide at least one valid element after the declaration (e.g., a root element) to ensure the parser continues without reporting unrelated errors.

  Resulting path effect
  - With an encoding value longer than 127 UTF-8 bytes, the conversion into the internal 128-byte buffer will stop when the destination pointer reaches p + ENCODING_MAX - 1, leaving unconsumed source bytes; hence ptr != end evaluates to true in NS(findEncoding).
