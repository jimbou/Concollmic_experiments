target_path_constraint: |-
  Goal: Take the error branch for an unknown/unsupported encoding name during XML tokenizer initialization.

  Chronological, self-contained constraints at the program-input/environment level:

  1) Process invocation and I/O channel
  - The executable is invoked as a standalone process with no additional command-line arguments that influence parsing behavior.
  - Standard input (stdin) is used as the only input source. The program must read the entire XML document from stdin without requiring filenames or environment variables.

  2) Document well-formedness up to the XML declaration (so that initialization reaches encoding selection)
  - The input starts with an XML declaration of the form: '<?xml ...?>' at the beginning of the stream (no leading BOM or whitespace is required, unless the implementation accepts it; to avoid ambiguity, provide zero leading bytes before '<').
  - The declaration must include an encoding pseudo-attribute with a value that is syntactically valid per XML 1.0: encoding=[quote]EncName[quote], where:
    * [quote] is either a single quote (') or a double quote (").
    * EncName is an XML encoding name token that matches the lexical pattern: [A-Za-z][A-Za-z0-9._\-]* (starts with a letter; subsequent characters may be letters, digits, dot, underscore, or hyphen).
  - Other pseudo-attributes (version, standalone) may be absent or present; if present they must be syntactically valid. The declaration must be properly terminated by '?>'.

  3) Encoding name must be unknown to the tokenizer’s registry
  - The value provided for the encoding pseudo-attribute must NOT match any encoding recognized by the library’s getEncodingIndex(name). Common recognized names typically include (non-exhaustive):
    * 'UTF-8', 'UTF8', 'US-ASCII', 'ASCII', 'ISO-8859-1', 'ISO-8859-2', ..., some UTF-16 related names ('UTF-16', 'UTF-16LE', 'UTF-16BE'), and possibly 'UTF-32' variants depending on build.
  - To guarantee the unknown path, choose an encoding token that is syntactically valid (per step 2) but not in the built-in table. Constraint (symbolic): Name ∈ ValidEncToken ∧ Name ∉ RecognizedEncodings.

  4) Content encoding consistency (to avoid short-circuiting before reaching the branch)
  - The byte stream on stdin must be encoded in a form that the parser can initially consume to read the XML declaration and the encoding attribute. Two safe options:
    a) Provide the entire stdin in ASCII-compatible bytes (subset of UTF-8), using only characters below 0x80, so the initial bootstrap parser can read tokens regardless of the declared (unknown) encoding name; or
    b) If a BOM is provided, it must correspond to a recognized initial autodetectable encoding. To keep constraints minimal and robust, prefer option (a): use ASCII subset bytes only until after '?>'.

  5) Post-declaration content (optional)
  - Any subsequent content after the XML declaration is optional and, if present, must remain within ASCII subset to avoid early decoding errors unrelated to encoding name lookup.

  6) Newlines and whitespace
  - Whitespace between pseudo-attributes in the XML declaration is allowed. Ensure spaces separate attributes if more than one is present. No leading whitespace before '<?xml' to avoid ambiguity with potential BOM handling.

  7) End-of-input handling
  - The input can end immediately after '?>' or include a minimal well-formed element (e.g., '<root/>') in ASCII subset. This prevents early parse termination due to truncated declaration.

  Sufficient condition summary (SMT-style):
  - Let S be the stdin byte sequence.
  - S begins with the ASCII bytes of '<?xml', contains token 'encoding', an equals sign '=', matching quotes q ∈ {'"','\''}, and a token E satisfying: E matches [A-Za-z][A-Za-z0-9._\-]* ∧ E ∉ RecognizedEncodings.
  - All bytes in S up to and including '?>' are in [0x09, 0x0A, 0x0D, 0x20..0x7E].
  - The declaration is syntactically closed by '?>'.

  These constraints ensure the parser reaches XmlInitEncoding, computes i = UNKNOWN_ENC for the provided encoding name, and takes the target branch i == UNKNOWN_ENC.
