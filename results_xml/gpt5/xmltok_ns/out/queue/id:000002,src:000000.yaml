exec_code: |
  import subprocess
  import signal


  def execute_program(timeout: int) -> tuple[str, int]:
      # XML declaration with syntactically valid but intentionally unknown encoding name.
      # ASCII-only bytes up to and including '?>', followed by a minimal root element.
      xml_input = "<?xml version='1.0' encoding='X-FOOBAR-42'?>\n<root/>\n"

      try:
          result = subprocess.run(
              ["./temp_executable"],
              input=xml_input,
              text=True,
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception as e:
          raise e
