  an explicitly declared but unsupported/unknown character encoding name. Exercising
  this error-handling path is important for robustness testing and broadens coverage
  of initialization logic tied to XML prolog processing. It is reachable via stdin
  content alone by declaring an unknown encoding in the XML declaration, consistent
  with the current harness that feeds text input to the program.
target_path_constraint: |-
  1. Program invocation via the existing harness: run the executable with no command-line arguments beyond the binary path. Stdin must deliver a single XML document encoded in UTF-8 (since the harness uses text mode) and free of leading BOM.

  2. XML document must begin with an XML declaration specifying an encoding name that is syntactically valid by XML rules but not recognized by the parser's encoding table. Requirements for the XML declaration:
     - Starts at the very first byte of the input with the exact sequence: "<?xml" followed by whitespace.
     - Includes a version attribute set to a valid XML version (e.g., 1.0) to avoid early rejection unrelated to encoding resolution: version attribute must appear before encoding.
     - Includes an encoding attribute whose value is an unknown/unsupported name per the parser (i.e., when passed to the internal function that maps names to encodings, the result is UNKNOWN_ENC). The value must be enclosed in matching single or double quotes and consist of ASCII letters/digits and optional punctuation allowed by XML, but must not match any of the known encodings (e.g., not "UTF-8", "utf-8", "US-ASCII", "ISO-8859-1", "UTF-16", "UTF-16LE", "UTF-16BE", or any other encoding supported by this parser).
     - The declaration must close properly with "?>" and be immediately followed by optional whitespace and then a root element start tag to keep parsing progressing.

  3. Content after the XML declaration must be well-formed XML so that the parser proceeds far enough to consult XmlInitEncoding and evaluate the encoding name. Minimal well-formedness constraints:
     - A single root element must be present. Provide a start tag "<root>" and a matching end tag "</root>" with no intervening malformed constructs.
     - No illegal characters per XML; content should be plain ASCII within UTF-8 to avoid introducing actual non-ASCII bytes that could be misinterpreted.

  4. Environmental and I/O constraints:
     - Standard input must deliver the entire document in one stream without NUL bytes.
     - No external entity references or DTDs; the parser should not require file system access.

  5. Semantic relationship constraint:
     - The encoding attribute value chosen must be such that the parser's encoding name lookup returns UNKNOWN_ENC. This condition is necessary and sufficient for the target branch i == UNKNOWN_ENC to evaluate to true inside initialization.
