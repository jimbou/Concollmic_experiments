exec_code: |
  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      # XML with a valid version and an unknown/unsupported encoding name.
      # Starts at the first byte with an XML declaration, no BOM, UTF-8 encoded via subprocess encoding param.
      # Well-formed minimal document follows the declaration.
      xml_input = "<?xml version=\"1.0\" encoding=\"X-UNKNOWN-ENC\"?>\n<root></root>\n"

      try:
          result = subprocess.run(
              ["./temp_executable"],  # Run the executable with no extra args
              input=xml_input,
              text=True,
              encoding="utf-8",       # Ensure stdin is UTF-8 encoded, no BOM
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception as e:
          raise e
