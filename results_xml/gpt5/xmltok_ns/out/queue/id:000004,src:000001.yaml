exec_code: |-
  import subprocess
  import signal

  def execute_program(timeout: int) -> tuple[str, int]:
      # Provide an XML document that starts with a valid XML declaration and a known encoding.
      # Use only ASCII characters and declare UTF-8 to ensure the encoding is recognized and fully consumable.
      xml_input = "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<root></root>\n"

      try:
          result = subprocess.run(
              ["./temp_executable"],    # Same executable, no extra args
              input=xml_input,           # Provide the XML via stdin
              text=True,
              encoding="utf-8",         # Ensure stdin transport is UTF-8 without BOM
              capture_output=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode

      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL

      except Exception as e:
          raise e
