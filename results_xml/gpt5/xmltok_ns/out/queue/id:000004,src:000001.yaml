target_path_constraint: |-
  Goal: Reach xmltok_ns.c:NS(findEncoding) and take the branch `if (i == UNKNOWN_ENC)` -> false, so that it returns `NS(encodings)[i]` (line 126).

  High-level effect required: When the XML declaration is parsed, the declared encoding name must be recognized (i.e., mapped by getEncodingIndex to a known encoding), and the bytes of the encoding name must be fully convertible by XmlUtf8Convert without truncation, so that `ptr == end` and `i != UNKNOWN_ENC`.

  Constraints in chronological order:

  1) Process invocation and I/O channel setup
  - The executable is launched with no command-line arguments beyond argv[0]. No reliance on extra args for behavior.
  - The program reads the XML text from standard input (stdin). Ensure stdin is provided as a contiguous text stream in UTF-8 without a byte order mark (BOM). There must be no NUL bytes.

  2) XML document structure requirements
  - The input must begin at its first byte with an XML declaration that conforms syntactically to XML 1.0: `<?xml version="1.0" ... ?>`.
  - The XML declaration MUST include an encoding pseudo-attribute specifying a supported/recognized encoding name. The name must be present as ASCII letters/digits/hyphen/underscore as allowed by XML, without surrounding quotes mismatched or malformed.
  - After the declaration closes with `?>`, a minimal well-formed document element must follow (e.g., a single root element). Whitespace and newlines are permitted but must not introduce invalid characters for the declared encoding.

  3) Encoding name recognition requirement (to force `i != UNKNOWN_ENC`)
  - The value of the encoding pseudo-attribute must be a name that the library recognizes. Concretely, it must map to one of the internal encodings indexed by getEncodingIndex, which includes at least: "UTF-8", "UTF8", "US-ASCII"/"ASCII", "ISO-8859-1" (Latin-1), and similar common labels. The exact accepted set is determined by getEncodingIndex; the requirement is that the chosen name is one of those known labels so that `i != UNKNOWN_ENC`.
  - The bytes of the encoding name in the declaration must be valid UTF-8 and entirely consumable by XmlUtf8Convert so that `ptr == end` holds when scanning the name token. This implies:
    a) Only use characters representable as single-byte ASCII within UTF-8 for the encoding name (A-Z, a-z, 0-9, and '-' or '_'), and
    b) Do not include stray continuation bytes or multi-byte UTF-8 sequences within the encoding token.

  4) Byte-level constraints around the encoding token extraction (to satisfy `ptr == end` in NS(findEncoding))
  - Ensure there are no trailing spaces or extra bytes within the token buffer passed to NS(findEncoding). The substring representing the encoding name must be contiguous and contain only the encoding characters; any surrounding whitespace or delimiters must be outside the bounds specified by `ptr..end` for the token. Practically, this means the XML declaration follows the grammar `encoding="<name>"` (or `encoding='...'`) without embedded whitespace inside `<name>` and with matching quotes immediately before and after the name.
  - The encoding name length must be less than ENCODING_MAX (128) bytes.

  5) Document content consistent with the declared encoding (to avoid early failures elsewhere)
  - All bytes following the XML declaration must be valid for both the transport (stdin being UTF-8) and the declared encoding. To avoid mismatches that could cause alternate error paths, restrict content to ASCII characters common to both encodings (e.g., `<`, `>`, `/`, letters a-z, A-Z, digits, spaces, and newline), which are valid under UTF-8 and typical single-byte encodings. Do not include characters that would be ill-formed under the declared encoding.

  6) No error-triggering conditions before NS(findEncoding)
  - The XML declaration must not include unknown pseudo-attributes, malformed quoting, or duplicated attributes that could divert control flow to error handling before the encoding name is processed.

  Summary (what must be true at the time NS(findEncoding) runs)
  - The encoding attribute exists and its value bytes form a valid ASCII subset token whose length < 128.
  - That token is a recognized label (i maps to a valid index; not UNKNOWN_ENC).
  - The scanner converts the entire token so that `ptr == end` and then `getEncodingIndex(token) != UNKNOWN_ENC`, causing the branch `if (i == UNKNOWN_ENC)` to evaluate false and execution to reach the return of `NS(encodings)[i]`.
