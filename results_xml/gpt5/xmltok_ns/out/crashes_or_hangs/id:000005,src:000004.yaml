  error path during XML declaration encoding name processing. While some branches
  in this file show 0% historical coverage (e.g., UTF-16 specific paths), they are
  not reachable with the current harness because stdin is forced to UTF-8 text and
  we cannot provide UTF-16 byte sequences. In contrast, this branch is reachable via
  stdin by crafting the XML declaration’s encoding attribute so that the internal
  conversion stops early, leaving characters unconsumed. Exercising this branch will
  validate error handling for malformed or oversized encoding names, expanding behavioral
  coverage of XML prolog parsing without requiring harness changes.
target_path_constraint: |
  Program invocation and environment
  1. Launch the executable with no command-line arguments, providing input exclusively via standard input (stdin). Do not set or rely on any environment variables; default environment is sufficient.

  Stdin stream properties
  2. The stdin data stream must be encoded in UTF-8 (no BOM) and contain only ASCII-range bytes (0x20-0x7E plus standard whitespace and line breaks) unless otherwise specified below. Transport from the harness uses text mode with UTF-8 encoding.

  Document structure (high level)
  3. Provide an XML document that begins with an XML declaration and then any minimal root element so that the parser reaches prolog processing and attempts to parse the encoding name:
     - The first non-whitespace characters must start an XML declaration: "<?xml" followed by at least one whitespace character.
     - The XML declaration must contain an encoding attribute of the form encoding='...'(or encoding="...").
     - Close the declaration with "?>" and follow with a well-formed root element (e.g., <r/>) to avoid premature parser termination unrelated to the target branch.

  Encoding attribute value constraints (to trigger ptr != end in findEncoding)
  4. The characters inside the encoding attribute value must be such that the UTF-8-to-internal conversion routine (which copies up to a fixed buffer capacity ENCODING_MAX-1 = 127 characters into a temporary buffer) stops before consuming the entire attribute value substring while the caller still believes there is more data, i.e., leave at least one character in the [ptr, end) range unconsumed. Achieve this by either of the following independent methods:
     4.a. Oversized encoding name: Make the encoding attribute value length strictly greater than 127 characters (ASCII letters, digits, hyphen, underscore allowed). This ensures the conversion stops at buffer end and leaves remaining characters unconsumed, resulting in ptr != end being true when examined inside findEncoding.
     4.b. Introduce a non-decodable sequence for the current input encoding (UTF-8): Insert at least one isolated continuation byte or otherwise invalid UTF-8 byte (e.g., a byte in range 0x80-0xBF not part of a valid multi-byte sequence) within the encoding attribute value. Because stdin transport is UTF-8 text, you must represent such a byte literally in the input stream; the presence of an invalid UTF-8 code unit causes the converter to stop early with ptr positioned before end.

  Syntactic validity constraints (while still satisfying 4.a or 4.b)
  5. The XML declaration must remain syntactically acceptable up to and including the encoding attribute start so that the parser invokes encoding detection; however, the encoding attribute value need not be a valid IANA encoding label. The quote characters must open and close; any oversized content must occur fully within the quotes, and the closing quote must exist in the input after at least 128 characters (for method 4.a) so that more input remains after the conversion stops.
  6. Ensure that after the closing quote of the encoding attribute there is still at least one additional character in the XML declaration (e.g., whitespace or ?>) to guarantee that end marks the true end of the encoding name substring and not the overall input; this preserves the condition that ptr != end is detectable when the conversion halts early.

  Well-formedness after the declaration
  7. After the XML declaration, include a minimal well-formed root element so that any parser error raised by ptr != end happens during processing of the declaration rather than due to absent content.

  Do not satisfy the following (to avoid alternate branches):
  8. Do not set the encoding attribute to the exact token "UTF-16" with a 2-byte-per-char input stream (not applicable here) to avoid the separate UTF-16-specific branch. Do not make the encoding name unknown but fully consumable within 127 characters; otherwise the code would reach the UNKNOWN_ENC path instead of ptr != end.
