justification: |-
  This branch at line 26 has 0% historical coverage (line cov: 0/8) and represents important error handling logic in the hypot function. It's designed to handle cases where the computation of the hypotenuse would result in a non-finite value (infinity or NaN) despite both inputs being finite numbers. This is a critical edge case for numerical stability and correctness of the math library.

  The branch is triggered when:
  1. Both input values x and y are finite numbers
  2. But the result of calculating their hypotenuse (z = __ieee754_hypot(x,y)) is not finite (likely due to overflow)

  This branch is important because it handles potential overflow situations in mathematical calculations, which is a common source of bugs in numerical software. Exploring this branch would significantly improve code coverage and test the program's behavior in edge cases.
target_path_constraint: |-
  To reach the target branch `if((!finite(z))&&finite(x)&&finite(y))` -> true in w_hypot.c:hypot, the following constraints must be satisfied:

  1. Program Execution Path Constraints:
     - The program must be executed with exactly 3 command-line arguments (program name + 2 values): `argc == 3`
     - The two arguments must be parseable as floating-point numbers by `atof()`

  2. Input Value Constraints:
     - Both input values must be finite numbers (not NaN, not infinity)
     - The values must be extremely large positive or negative numbers, but still within the finite range of IEEE 754 double-precision floating-point representation
     - The values must be large enough that when computing sqrt(x²+y²), the result overflows to infinity

  3. Mathematical Constraints:
     - x² + y² must exceed DBL_MAX (the maximum representable finite double value, approximately 1.7976931348623157e+308)
     - A typical approach would be to use values where each is slightly less than sqrt(DBL_MAX), but their squared sum exceeds DBL_MAX
     - For example, values where both x and y are approximately 1.0e+154 would likely trigger this condition, as their squares would each be around 1.0e+308, and their sum would exceed DBL_MAX

  4. Environment Constraints:
     - The program must be compiled without the _IEEE_LIBM macro defined (already satisfied based on the execution trace)
     - The _LIB_VERSION variable must not be equal to _IEEE_ at runtime
