  The constraint is simply:
  - The total number of command-line arguments (including the program name) must be either less than 3 or greater than 3.

  This can be achieved in two ways:
  1. Provide fewer than 2 additional arguments (i.e., run the program with just the program name, or with the program name and only one additional argument)
  2. Provide more than 2 additional arguments (i.e., run the program with the program name and 3 or more additional arguments)

  For example, if the program is invoked as `./temp_executable` (with no arguments) or `./temp_executable 1.0` (with one argument) or `./temp_executable 1.0 2.0 3.0` (with three arguments), the condition `argc != 3` will evaluate to true, and the target branch will be taken.
