  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Using 1.5 as our input value, which satisfies all constraints:
          # 1. It's a valid floating-point number
          # 2. Its exponent bits are 0x3ff, giving j0 = 0, which satisfies 0 <= j0 < 20
          # 3. It's not an integer (has fractional part), so ((i0&i)|i1)!=0 is true
          result = subprocess.run(
              ["./temp_executable 1.5"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
