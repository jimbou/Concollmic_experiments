exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os
      
      # Set up environment variables to ensure _LIB_VERSION != _IEEE_
      # These environment variables influence math error handling in various C libraries
      env = os.environ.copy()
      env["MATH_ERREXCEPT"] = "1"  # Enable exceptions for math errors
      env["MATH_ERRHANDLING"] = "2"  # Set to MATH_ERREXCEPT | MATH_ERRNO
      env["GLIBC_TUNABLES"] = "glibc.math.errhandling=1"  # glibc specific tunable
      
      try:
          # Modified command to include exactly one argument (argc == 2)
          # The argument is a valid floating-point number with absolute value < 710.4758600739439
          result = subprocess.run(
              ["./temp_executable", "123.45"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              env=env,
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
