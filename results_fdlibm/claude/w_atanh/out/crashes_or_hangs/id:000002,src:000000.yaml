  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Using 0.9 as the input value to satisfy the target branch condition
          # This value is within the valid domain of atanh (-1 < x < 1)
          # and produces a result atanh(0.9) ≈ 1.47 which satisfies y >= 1.0
          result = subprocess.run(
              ["./temp_executable 0.9"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
