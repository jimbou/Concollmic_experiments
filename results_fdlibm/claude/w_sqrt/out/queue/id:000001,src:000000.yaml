  1. Program Execution Constraint:
     - The program must be executed with exactly 2 command-line arguments (the program name and one value)
     - This satisfies the condition `argc == 2` in the main function

  2. Input Value Constraint:
     - The command-line argument passed to the program must be parseable as a negative floating-point number
     - Specifically: The string in `argv[1]` must convert to a double value less than 0.0 when processed by `atof()`
     - Examples of valid formats include: "-1.0", "-0.1", "-5", etc.

  3. Library Version Constraint:
     - The code must not be compiled with _IEEE_LIBM defined
     - The condition `_LIB_VERSION == _IEEE_ || isnan(x)` must evaluate to false
