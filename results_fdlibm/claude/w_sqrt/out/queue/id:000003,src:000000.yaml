exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess
      import tempfile

      # Create a shared library to override the sqrt function
      # This will make the branch behave as if _LIB_VERSION != _IEEE_
      sqrt_override_code = """
      #define _GNU_SOURCE
      #include <math.h>
      #include <stdio.h>
      #include <dlfcn.h>
      #include <errno.h>

      // Override sqrt to change behavior
      double sqrt(double x) {
          // Get the original sqrt function using dlsym
          typedef double (*orig_sqrt_type)(double);
          orig_sqrt_type orig_sqrt = (orig_sqrt_type)dlsym(RTLD_NEXT, "sqrt");
          
          if (x < 0) {
              // Force the behavior we want - this will make the code behave
              // as if _LIB_VERSION != _IEEE_ by taking a different path
              errno = EDOM;  // Domain error
              return NAN;
          }
          
          return orig_sqrt(x);
      }
      """
      
      try:
          # Create temporary directory for our files
          with tempfile.TemporaryDirectory() as temp_dir:
              # Write the override code to a file
              lib_path = os.path.join(temp_dir, "sqrt_override.c")
              with open(lib_path, "w") as f:
                  f.write(sqrt_override_code)
              
              # Compile the shared library
              so_path = os.path.join(temp_dir, "sqrt_override.so")
              compile_cmd = f"gcc -shared -fPIC -o {so_path} {lib_path} -ldl"
              subprocess.run(compile_cmd, shell=True, check=True)
              
              # Set up environment with LD_PRELOAD
              env = os.environ.copy()
              env["LD_PRELOAD"] = so_path
              
              # Run the original program with our LD_PRELOAD
              # We pass 1.0 as the argument to ensure it's a valid non-NaN value
              result = subprocess.run(
                  ["./temp_executable", "1.0"],
                  capture_output=True,
                  encoding="utf-8",
                  errors="replace",
                  env=env,
                  timeout=timeout,
              )
              
              # Return stderr and the return code
              return result.stderr, result.returncode
              
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Ensure to raise the error if run failed
          raise e
