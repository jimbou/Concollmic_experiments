  1. The program must be invoked with exactly one command-line argument (to satisfy `if (argc != 2)` in main())
  2. The command-line argument must be a string that, when parsed by atof(), produces a NaN value

  For the second constraint, there are several ways to represent NaN in string form that atof() will recognize:
  - "NaN" (case-insensitive, so "nan", "NaN", "NAN" all work)
