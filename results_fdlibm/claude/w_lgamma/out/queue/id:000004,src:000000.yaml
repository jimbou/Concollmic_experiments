exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os
      import tempfile
      
      # Create the preload library to modify _LIB_VERSION
      with tempfile.NamedTemporaryFile(suffix='.c', delete=False) as f:
          lib_source_path = f.name
          f.write(b"""
  #include <stdio.h>

  // Override _LIB_VERSION to a non-_IEEE_ value
  int _LIB_VERSION = -1;  // -1 is not equal to _IEEE_ (which is typically 0)

  void __attribute__((constructor)) init() {
      // This function runs when the library is loaded
      // No need to print anything in the final solution
  }
  """)
      
      try:
          # Compile the preload library
          lib_output_path = lib_source_path.replace('.c', '.so')
          compile_result = subprocess.run(
              ["gcc", "-shared", "-fPIC", "-o", lib_output_path, lib_source_path],
              capture_output=True,
              timeout=timeout
          )
          
          if compile_result.returncode != 0:
              raise Exception(f"Failed to compile preload library: {compile_result.stderr.decode('utf-8', errors='replace')}")
          
          # Set up environment with LD_PRELOAD
          env = os.environ.copy()
          env["LD_PRELOAD"] = lib_output_path
          
          # Run the program with the preload library
          result = subprocess.run(
              ["./temp_executable", "1.0"],  # Any valid float will work
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              env=env,
              timeout=timeout,
          )
          
          # Return stderr and the return code
          return result.stderr, result.returncode
      
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      
      except Exception as e:
          # Raise any other errors
          raise e
      
      finally:
          # Clean up temporary files
          try:
              os.remove(lib_source_path)
              os.remove(lib_output_path)
          except:
              pass
