       - `x` is our input value (the non-positive integer)
       - This condition checks that the result `y` is not finite (infinity or NaN) while `x` is finite

  4. Finally, our target condition must be true:
     - `floor(x) == x && x <= 0.0`
     - This is satisfied by any non-positive integer value

  The key constraint is that the command-line argument must be a non-positive integer (0, -1, -2, etc.) because:
  1. For these values, the gamma function has mathematical poles (singularities)
  2. The lgamma function will return infinity for these inputs
  3. This will cause `!finite(y) && finite(x)` to be true
  4. Since these are integers, `floor(x) == x` will be true
  5. Since they are non-positive, `x <= 0.0` will be true

  Therefore, the program should be executed with a command like:
  `./temp_executable -1.0` or `./temp_executable 0.0` or `./temp_executable -2.0`
