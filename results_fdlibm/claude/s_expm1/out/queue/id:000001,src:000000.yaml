  In IEEE-754 double-precision format, the condition hx >= 0x7ff00000 checks if the upper 32 bits of the floating-point number have all exponent bits (bits 52-62) set to 1, which indicates either infinity or NaN.

  The simplest way to satisfy this constraint is to pass "inf", "-inf", or "nan" as the command-line argument, as these are recognized by the atof() function as special floating-point values.

