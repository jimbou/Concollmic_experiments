  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Using 0.5 as the input value which satisfies the constraints:
          # - Its high 32 bits (0x3fe00000) > 0x3fd62e42 (target constraint)
          # - Its value (0.5) is between 0.347 and 38.816
          # - Its value is less than the o_threshold (~709.78)
          result = subprocess.run(
              ["./temp_executable 0.5"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
