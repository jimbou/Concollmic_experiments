  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified command to have exactly 3 command-line arguments (program name + 2 arguments)
          # Using "1.0" and "0.0" as the arguments, where at least one is non-zero
          # This satisfies the constraint that !(x==0.0 && y==0.0) must be true
          result = subprocess.run(
              ["./temp_executable", "1.0", "0.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
