target_path_constraint: |-
  To reach the target branch `if (ix>=0x7ff00000) -> true` in the tan function, the following constraints must be satisfied:

  1. Program execution must reach the tan function:
     - The program must be executed with exactly 2 command-line arguments (argc == 2)
     - The second argument (argv[1]) must be parseable as a floating-point number by atof()

  2. The input value must be a special IEEE 754 floating-point value:
     - The input must be either a NaN (Not a Number) or an infinity value
     - In IEEE 754 double-precision format, this means the exponent bits must be all 1s (0x7ff)
     - Specifically, the high word of the double (after masking out the sign bit with ix &= 0x7fffffff) must be >= 0x7ff00000

  3. Valid inputs that satisfy these constraints include:
     - Positive infinity: represented as 0x7ff00000 00000000 in IEEE 754
     - Negative infinity: represented as 0xfff00000 00000000 in IEEE 754
     - Any NaN value: where the exponent is all 1s and the fraction is non-zero

  The simplest way to satisfy these constraints is to pass "inf", "+inf", "-inf", or "nan" as the command-line argument, as these are recognized by the atof() function as the special values Infinity and NaN respectively.
