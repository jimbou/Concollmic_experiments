  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          result = subprocess.run(
              ["./temp_executable 1.0 1.0 1"],  # Changed the third argument from 0 to 1
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
