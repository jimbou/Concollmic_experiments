  2. The input value `x` must be a floating-point number whose high 32 bits in IEEE 754 representation are greater than or equal to 0x3FDA827A

  In practical terms, this means:
  - x must be approximately greater than or equal to 0.4 (the exact threshold value corresponding to 0x3FDA827A in IEEE 754 format)

  To satisfy this constraint, the command-line argument passed to the program must be a string representation of a floating-point number that, when converted to a double using atof(), results in a value whose high 32 bits are greater than or equal to 0x3FDA827A.

