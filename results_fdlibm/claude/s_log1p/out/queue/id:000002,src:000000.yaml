  Where `__HI(x)` extracts the high-order 32 bits of the IEEE 754 double-precision floating-point representation of `x`. This includes the sign bit, the exponent bits, and the most significant bits of the mantissa.

  The constraint `hx >= 0x3FDA827A` translates to a constraint on the input value `x`. In the IEEE 754 format, this represents a specific threshold value.

