  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      try:
          # Set up the environment variables to influence math error handling
          # These help ensure _LIB_VERSION != _IEEE_ inside the program
          env = os.environ.copy()
          env["POSIXLY_CORRECT"] = "1"  # Prefer POSIX behavior over IEEE
          env["MATH_ERRNO"] = "1"       # Ensure errno is set
          env["LIB_VERSION"] = "_SVID_" # Try to influence _LIB_VERSION directly

          # Use "-1.5" as the command-line argument
          # This satisfies:
          # - atof(argv[1]) < 0.0 (negative number)
          # - atof(argv[1]) != 0.0 (not zero)
          # - !isnan(atof(argv[1])) (not NaN)
          result = subprocess.run(
              ["./temp_executable", "-1.5"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed to False for proper argument passing
              timeout=timeout,
              env=env  # Pass the modified environment
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
