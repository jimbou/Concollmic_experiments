  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      try:
          # Set environment variables that might affect math library behavior
          env = os.environ.copy()
          env["POSIXLY_CORRECT"] = "1"
          env["_SVID_SOURCE"] = "1"
          
          # Use x=1.0 and y=1.0 to satisfy the constraints:
          # 1. y is not 0.0
          # 2. Both x and y are valid floating-point numbers (not NaN)
          # This should allow us to reach the target branch "return z;" at line 23
          result = subprocess.run(
              ["./temp_executable", "1.0", "1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Use shell=False for better security
              timeout=timeout,
              env=env  # Pass our modified environment
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
