  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # We're using the same arguments as in the original execution (1.0 1.0)
          # Since we can't directly control the _LIB_VERSION variable, we're relying on
          # the target environment having _LIB_VERSION != _IEEE_
          # The second argument (1.0) ensures that isnan(y) is false
          result = subprocess.run(
              ["./temp_executable 1.0 1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
