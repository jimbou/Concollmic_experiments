  The hexadecimal constant 0x40360000 in IEEE 754 double precision format corresponds to approximately 22.0. For tanh function, when |x| > 22, the result is so close to 1.0 that it's within machine precision.

  This branch is important because:
  1. It has 0% historical coverage (line 53 is marked as uncovered)
  2. It represents an important optimization for large inputs in the tanh implementation
  3. It handles a different range of inputs than what has been tested so far
  4. Exploring this branch would improve the overall test coverage of the tanh function's behavior
