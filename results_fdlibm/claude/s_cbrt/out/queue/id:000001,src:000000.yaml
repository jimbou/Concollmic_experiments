  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use 1.0 as the command-line argument
          # This value satisfies all our constraints:
          # - hx = 0x3FF00000 (after removing sign bit)
          # - 0x3FF00000 > 0x00100000 (constraint 1)
          # - 0x3FF00000 < 0x7ff00000 (constraint 2)
          # - (0x3FF00000|0x00000000) != 0 (constraint 3)
          result = subprocess.run(
              ["./temp_executable 1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
