target_path_constraint: |-
  To reach the target branch `else if (hx<0x7ff00000) { return (hx>>20)-1023; }` in the ilogb function, we need the following constraints:

  1. The program must be executed with exactly one command-line argument (argc == 2) to pass the check in main.

  2. The input floating-point value (parsed from argv[1]) must be a normalized floating-point number. In IEEE 754 double-precision format, this means:
     - The high word of the double (hx) must satisfy: 0x00100000 <= hx < 0x7ff00000
     
     This corresponds to:
     - The exponent bits must not be all zeros (which would indicate a denormalized number)
     - The exponent bits must not be all ones (which would indicate infinity or NaN)
     
  3. To avoid the first branch `if(hx<0x00100000)`, the input must have an exponent that is at least -1022 (the minimum normal exponent in IEEE 754).

  In simpler terms, the input must be a regular, normalized floating-point number with magnitude:
  - Greater than or equal to 2^(-1022) ≈ 2.2250738585072014e-308 (smallest normalized double)
  - Less than infinity

  Examples of such values would be 2.0, 10.0, 1000.0, or even small normalized values like 1e-300, but not denormalized values (which are smaller than 2^(-1022)), zero, infinity, or NaN.
