  3. The argument is converted to a double with atof()
  4. The ilogb function extracts the high word of the double
  5. The high word has the sign bit masked off with &0x7fffffff
  6. The first condition `if(hx<0x00100000)` fails
  7. The second condition `else if (hx<0x7ff00000)` fails
  8. Execution enters the final else branch, which is our target
