  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Swapping the argument order from the original execution:
          # Using 1.0 as first argument and 3.3e+150 as second argument
          # This ensures that (__HI(y) & 0x7fffffff) > (__HI(x) & 0x7fffffff) is true
          # which satisfies the target branch condition "if(hb > ha) -> true"
          result = subprocess.run(
              ["./temp_executable 1.0 3.3e+150"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
