  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Using 4.0e+150 as our first argument, which is greater than the threshold of 0x5f300000
          # The high word of this value is above 0x5f300000, ensuring ha > 0x5f300000 is true
          # We keep the second argument as 1.0 since there are no specific constraints on it
          result = subprocess.run(
              ["./temp_executable 4.0e+150 1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
