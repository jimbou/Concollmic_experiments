  To reach the target branch `if (k==0x7ff) -> true` in the scalbn function, the following constraints must be satisfied:

  1. The program must be executed with exactly 3 command-line arguments (argc == 3), where:
     - argv[0] is the program name
     - argv[1] is a string representing a double value
     - argv[2] is a string representing an integer value

  2. The critical constraint is that the first argument (argv[1]) must be a string that, when converted to a double using atof(), produces a double value where the exponent bits are all set to 1 (0x7ff). 

     In IEEE 754 double-precision format, this means the bits 52-62 (the exponent field) must all be 1s, which occurs in:
     - Infinity values (positive or negative)
     - NaN (Not a Number) values

     This can be achieved by using:
     - "inf", "infinity", "-inf", or "-infinity" as the string input
     - "nan" as the string input
     - A numeric string that exceeds the maximum representable double value (e.g., "1.8e308")

  3. The second argument (argv[2]) can be any valid integer string that atoi() can parse, as its value doesn't affect reaching the target branch.

  The key insight is that we need k==0x7ff, where k is extracted from the input double x using:
  k = (hx&0x7ff00000)>>20

  where hx is the high-order 32 bits of the double value. This extraction isolates the exponent bits, and we need all of them to be 1.
