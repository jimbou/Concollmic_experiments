target_path_constraint: |-
  To reach the target branch `if(z==0.0&&z!=x) -> true` in w_scalb.c:scalb, the following constraints must be satisfied:

  1. Program Execution Path:
     - The program must be executed with exactly 2 command-line arguments (argc == 3)
     - Both arguments must be valid floating-point numbers parseable by atof()

  2. Value Constraints:
     - First argument (a0/x): Must be a non-zero, finite floating-point value
     - Second argument (a1/fn): Must be a large negative floating-point value

  3. Result Constraints:
     - z = __ieee754_scalb(x, fn) must evaluate to exactly 0.0
     - x must not be equal to 0.0 (to ensure z != x)
     - _LIB_VERSION must not be equal to _IEEE_ (to ensure we don't return early)
     - !(finite(z)||isnan(z))&&finite(x) must be false (to avoid taking the first branch)

  The key constraint is selecting values for x and fn such that scaling x by fn (which is essentially x * 2^fn for IEEE floating-point) results in underflow to zero. This happens when x is a small non-zero value and fn is a large negative value, causing the result to be smaller than the smallest representable non-zero floating-point number.
