     - Since scalb effectively computes x * 2^fn (or x * radix^fn)
     - For non-zero a0, a1 must be large enough that a0 * 2^a1 exceeds the maximum representable double value (~1.8e308)

  5. _LIB_VERSION must not equal _IEEE_
