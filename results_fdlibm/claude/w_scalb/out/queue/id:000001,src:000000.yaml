     - This appears to be a compile-time configuration that must be set appropriately

  The key constraint is selecting values for a0 and a1 such that:
  - a0 is finite (not infinity, not NaN)
  - scalb(a0, a1) results in infinity
  - This typically happens when a0 ≠ 0 and a1 is very large positive
