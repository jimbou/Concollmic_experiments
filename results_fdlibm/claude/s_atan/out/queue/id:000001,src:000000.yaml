  In terms of the actual input value:
  - 0x3ff30000 in the IEEE 754 format corresponds approximately to 1.19
  - 0x3fdc0000 corresponds approximately to 0.43
  - 0x44100000 corresponds to a very large number (approximately 2^17)

  Therefore, the input value x should satisfy:
  1.19 <= |x| < 2^17

