  1. The program must be executed with exactly one command-line argument (to satisfy argc == 2)

  2. The command-line argument must be a string representation of a normal floating-point number (not zero, not denormalized, not infinity, not NaN)

  3. For a double-precision floating-point number in IEEE 754 format:
     - The number must have a non-zero exponent field after right-shifting by 20 bits
     - Specifically, in the bit representation of the double:
       * Bits 52-62 (the exponent field) must not be all zeros after right-shifting
