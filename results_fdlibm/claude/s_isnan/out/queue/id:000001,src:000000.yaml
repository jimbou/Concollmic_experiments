     - In IEEE 754 floating-point representation, a NaN is represented by:
       * All bits in the exponent field set to 1 (exponent = 0x7FF for double precision)
       * A non-zero value in the fraction field
     - There are several ways to provide a NaN input:
       * Using a string that represents NaN: "NaN" or "nan"
       * Using an invalid numeric format that atof() will interpret as NaN
       * Using a string that represents an operation that results in NaN, like "0/0" (though atof() might not evaluate this as expected)

  The simplest path constraint is to provide the string "NaN" as the command-line argument, which atof() will convert to a floating-point NaN value, causing the isnan() function body to be executed.
