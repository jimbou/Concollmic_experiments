  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Using -1e-300 as the command-line argument, which satisfies all constraints:
          # 1. It's a negative number (but not zero)
          # 2. It has a high word with the sign bit set (negative)
          # 3. Its exponent is less than 0x100
          result = subprocess.run(
              ["./temp_executable -1e-300"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
