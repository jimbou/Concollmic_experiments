  1. The program must be executed with exactly one command-line argument (argc == 2).

  2. The command-line argument must be a string that represents a valid double-precision floating-point number.

  3. The double-precision floating-point number must be negative but not zero.

  4. The number must have a magnitude small enough that when parsed, it produces a value with an exponent less than 0x00100000 in its IEEE 754 representation.

  In IEEE 754 double-precision format:
  - The sign bit (bit 63) must be 1 (indicating negative)
  - The exponent bits (bits 52-62) must represent a value less than 0x100 (normalized)
  - The specific constraint is that the high word (hx) of the IEEE representation must be negative

  This means the input must be a negative number with an absolute value small enough that its exponent field is less than 0x00100000, which corresponds to numbers with absolute values less than 2^-966.

  For example, a very small negative number like -1e-300 would satisfy these constraints.
