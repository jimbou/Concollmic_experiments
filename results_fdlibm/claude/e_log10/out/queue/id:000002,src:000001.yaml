  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Using "0" as the command-line argument to satisfy the constraint:
          # - This will make both high word (hx) and low word (lx) equal to 0
          # - This satisfies ((hx&0x7fffffff)|lx)==0
