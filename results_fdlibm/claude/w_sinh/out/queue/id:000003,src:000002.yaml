  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      try:
          # Set environment variables to ensure _LIB_VERSION is not _IEEE_
          # POSIX systems typically use POSIX mode by default, but we'll set it explicitly
          env = os.environ.copy()
          env["MATH_ERREXCEPT"] = "1"  # Enable math exceptions
          
          # Execute with exactly one argument (argc == 2)
          # Using 711.0 which is large enough to make sinh() overflow to infinity
          # while the input itself is finite
          result = subprocess.run(
              ["./temp_executable", "711.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Using shell=False with arguments as a list
              timeout=timeout,
              env=env
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
