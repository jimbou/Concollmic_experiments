  2. The command-line argument must represent a floating-point value that, when converted to a double-precision floating-point number, has its high-order word (the most significant 32 bits) containing a value greater than or equal to 0x7ff00000 when the sign bit is masked off.

  In IEEE 754 double-precision format, a value with high bits of 0x7ff00000 represents either infinity or NaN (Not a Number):
  - Infinity is represented as 0x7ff00000 00000000 (positive infinity) or 0xfff00000 00000000 (negative infinity)
  - NaN is represented by having the exponent field all 1s (as in infinity) but with a non-zero fraction field

  Therefore, the command-line argument must be one of:
  - "inf", "infinity", or any string that `atof()` interprets as infinity
  - "-inf", "-infinity", or any string that `atof()` interprets as negative infinity
  - "nan", or any string that `atof()` interprets as NaN

