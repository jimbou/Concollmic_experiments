  The constraint is:
  - The total number of command-line arguments (argc) must not be equal to 3.

  This can be satisfied in two ways:
  1. Execute the program with fewer than 2 arguments (argc < 3)
     - For example, run the program with no arguments or just the program name
     
  2. Execute the program with more than 2 arguments (argc > 3)
     - For example, run the program with 3 or more arguments after the program name

  Note that argc counts the program name itself as the first argument (argv[0]), so:
  - argc = 1 means no additional arguments (just the program name)
  - argc = 2 means one additional argument
  - argc = 3 means two additional arguments (which is the current execution case)
  - argc > 3 means three or more additional arguments
