  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to run with no additional arguments (argc = 1)
          result = subprocess.run(
              ["./temp_executable"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
