target_path_constraint: |-
  To reach the target branch (the else branch with __ieee754_rem_pio2 call in the sin function), we need to satisfy the following constraints:

  1. The program must be executed with exactly one command-line argument:
     - argc == 2

  2. The command-line argument must be a valid floating-point number that can be parsed by atof().

  3. The floating-point value (x) must satisfy:
     - ix > 0x3fe921fb, where ix is the high-order word of x with the sign bit masked off
     - ix < 0x7ff00000, to avoid triggering the NaN/infinity branch

  In more concrete terms:
     - The absolute value of x must be greater than approximately π/4 (≈ 0.7853981634)
     - The absolute value of x must be less than infinity

  This can be achieved by providing a command-line argument with an absolute value greater than π/4 but still a normal floating-point number (not NaN or infinity). For example, values like 1.5, 2.0, 10.0, or -5.0 would satisfy these constraints.
