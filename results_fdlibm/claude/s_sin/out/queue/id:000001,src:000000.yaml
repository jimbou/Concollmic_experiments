target_path_constraint: |-
  To reach the target branch `if (ix>=0x7ff00000) -> true` in the sin function, the following constraints must be satisfied:

  1. Program Input Constraint:
     - The program must be executed with exactly 2 command-line arguments (argc == 2)
     - The second argument (argv[1]) must represent either a floating-point infinity or NaN

  2. Technical Constraint on Input Value:
     - The high word of the double value passed to sin(), after masking off the sign bit, must be >= 0x7ff00000
     - In IEEE 754 floating-point representation, this corresponds to either:
       * Positive infinity: 0x7ff00000 00000000
       * Negative infinity: 0xfff00000 00000000
       * Any NaN value: high word with exponent bits all set (0x7ff) and at least one non-zero bit in the mantissa

  3. Execution Path:
     - The program must enter the sin() function
     - The condition `ix <= 0x3fe921fb` must be false (this value is approximately π/4)
     - The condition `ix >= 0x7ff00000` must be true

  In summary, the input must be a string representation of either infinity ("inf", "infinity", "-inf", "-infinity") or NaN ("nan"), which when converted to a double by atof() will have the IEEE 754 bit pattern with exponent bits all set to 1.
