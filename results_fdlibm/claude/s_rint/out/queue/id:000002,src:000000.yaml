     - In IEEE 754, the exponent field is bits 52-62 (11 bits)
     - For j0 > 51, we need: ((i0>>20)&0x7ff)-0x3ff > 51
     - Simplifying: (i0>>20)&0x7ff > 0x3ff + 51 = 0x3ff + 0x33 = 0x432
