  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use the floating-point value 524288.5 as the command-line argument
          # This value has:
          # - Exponent field of 0x412 (corresponding to j0==19)
          # - The least significant bit of the high word set to 1
          # This satisfies all the constraints to reach the target branch
          result = subprocess.run(
              ["./temp_executable 524288.5"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
