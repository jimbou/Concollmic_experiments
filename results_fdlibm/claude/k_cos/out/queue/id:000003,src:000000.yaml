  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Using 0.5 for the first argument which has a high word of 0x3fe00000
          # This is within the required range (0x3FD33333 to 0x3fe90000)
          # The second argument can be any valid floating-point value, so we'll keep it as 1.0
          result = subprocess.run(
              ["./temp_executable 0.5 1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
