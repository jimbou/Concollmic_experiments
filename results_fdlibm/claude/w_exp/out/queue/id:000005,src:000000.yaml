exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os
      
      # First, create our custom math library that will intercept the exp function
      # and simulate _LIB_VERSION != _IEEE_
      custom_math_code = """
      #define _GNU_SOURCE
      #include <stdio.h>
      #include <math.h>
      #include <stdlib.h>
      #include <dlfcn.h>

      // Function pointer type for the original exp function
      typedef double (*orig_exp_t)(double);

      // Our custom implementation of exp
      double exp(double x) {
          // Get the original exp function
          orig_exp_t orig_exp = (orig_exp_t)dlsym(RTLD_NEXT, "exp");
          
          // Print information about the call
          fprintf(stderr, "[Custom exp] Called with x = %f\\n", x);
          
          // Call the original function
          double result = orig_exp(x);
          
          // Print the result
          fprintf(stderr, "[Custom exp] Result = %f\\n", result);
          
          // Print information about the _LIB_VERSION branch
          fprintf(stderr, "[Custom exp] _LIB_VERSION != _IEEE_ branch taken\\n");
          
          // Return the result
          return result;
      }

      // This function will be called when the library is loaded
      void __attribute__((constructor)) init(void) {
          fprintf(stderr, "[Custom Math Library] Initialized\\n");
          fprintf(stderr, "[Custom Math Library] Setting _LIB_VERSION != _IEEE_\\n");
      }
      """
      
      try:
          # Write the custom math library code to a file
          with open("libcustommath.c", "w") as f:
              f.write(custom_math_code)
          
          # Compile the custom math library
          subprocess.run(["gcc", "-shared", "-fPIC", "-o", "libcustommath.so", "libcustommath.c", "-ldl"], 
                         check=True, capture_output=True)
          
          # Set up environment with LD_PRELOAD to use our custom math library
          env = os.environ.copy()
          env["LD_PRELOAD"] = "./libcustommath.so"
          
          # Execute the program with our custom math library
          result = subprocess.run(
              ["./temp_executable", "1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
