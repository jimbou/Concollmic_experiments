  1. Command-line argument constraint:
     - The program must be invoked with exactly 2 arguments (program name + one numeric argument)
     - argv[1] must be a valid string representation of a floating-point number

  2. IEEE 754 representation constraint on the input value:
     - Let x be the double-precision floating-point value parsed from argv[1]
     - Let ix be the high 32 bits of x with the sign bit masked out (ix = __HI(x) & 0x7fffffff)
