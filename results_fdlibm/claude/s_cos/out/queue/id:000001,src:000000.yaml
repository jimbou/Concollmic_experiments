  To reach the branch "if (ix>=0x7ff00000) -> true" in the cos function, the following constraints must be satisfied:

  1. Program Execution Constraint:
     - The program must be executed with exactly 2 command-line arguments (the program name and one numeric argument)

  2. Input Value Constraint:
     - The command-line argument must be convertible to a double-precision floating-point number by atof()
     - The high word of the double-precision floating-point number (after masking off the sign bit) must be greater than or equal to 0x7ff00000

  In IEEE 754 double-precision format, values with exponent bits all set to 1 (0x7ff) represent special values:
     - If the fraction bits are all zero, the value is infinity
     - If the fraction bits are non-zero, the value is NaN (Not a Number)

  Therefore, to satisfy the constraint, the input must be one of:
     - Positive infinity (e.g., represented as "inf" or "infinity" in string form)
     - Negative infinity (e.g., represented as "-inf" or "-infinity" in string form)
     - NaN (e.g., represented as "nan" in string form)
     - Any string that atof() would convert to one of these special values

  The simplest way to satisfy this constraint is to provide "inf", "-inf", or "nan" as the command-line argument.
