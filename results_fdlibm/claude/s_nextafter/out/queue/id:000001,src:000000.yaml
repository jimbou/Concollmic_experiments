  This condition checks if either input is a NaN in IEEE 754 floating-point representation.

  Constraints on program inputs:
  1. The program must be called with exactly 2 command-line arguments (argc == 3, since argv[0] is the program name).
  2. At least one of the arguments must represent a NaN value when converted to a double.

  For a value to be NaN in IEEE 754 double-precision format:
  - The exponent bits must all be 1 (0x7ff in the 11-bit exponent field)
  - The fraction bits must be non-zero

  In string representation, we can use one of these options:
  - "NaN" - Standard representation of Not-a-Number
  - "nan" - Case-insensitive variant
  - "0/0" - Division by zero produces NaN

  Therefore, the program should be invoked with one of the following input patterns:
  - ./temp_executable NaN <any_number>
  - ./temp_executable <any_number> NaN
  - ./temp_executable nan <any_number>
  - ./temp_executable <any_number> nan

  Where <any_number> can be any valid floating-point number (e.g., 1.0).
