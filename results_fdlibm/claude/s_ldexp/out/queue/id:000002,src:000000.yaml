target_path_constraint: |-
  To reach the target branch where `if(!finite(value)||value==0.0)` evaluates to true after the `scalbn(value,exp)` call in the `ldexp` function, the following constraints must be satisfied:

  1. Program must be executed with exactly 3 command-line arguments (argc == 3):
     - The program name (argv[0])
     - A floating-point value (argv[1])
     - An integer exponent (argv[2])

  2. The initial value (parsed from argv[1]) must be finite and non-zero:
     - value != 0.0
     - value must not be infinity or NaN

  3. The scalbn(value, exp) operation must result in either:
     - A non-finite value (infinity or NaN), OR
     - A zero value (underflow)

  This can be achieved in two ways:

  A. Overflow scenario:
     - value must be a very large positive or negative number
     - exp must be a large positive number
     - Their combination must cause overflow beyond the representable range of a double
     - For example, a value close to DBL_MAX and a positive exponent

  B. Underflow scenario:
     - value must be a very small non-zero number
     - exp must be a large negative number
     - Their combination must cause underflow to zero
     - For example, a value close to DBL_MIN and a negative exponent

  In IEEE 754 double-precision format, the maximum finite value is approximately 1.8 × 10^308, and the minimum positive normal value is approximately 2.2 × 10^(-308). The function will set errno to ERANGE when the mathematical result exceeds these limits.
