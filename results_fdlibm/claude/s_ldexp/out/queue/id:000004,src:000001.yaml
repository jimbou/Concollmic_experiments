target_path_constraint: |-
  To reach the target branch where `if(!finite(value)||value==0.0)` evaluates to false in the ldexp function, the following constraints must be satisfied:

  1. Command-line argument constraints:
     - The program must be called with exactly 3 command-line arguments (including the program name): `argc == 3`
     - This ensures we don't trigger the usage message and early return in main()

  2. Input value constraints:
     - The first argument (argv[1]) must be a string representation of a finite, non-zero floating-point number
     - "finite" means the value must not be infinity (positive or negative) and must not be NaN
     - The value must not be zero (0.0)
     
     In mathematical terms:
     - Let x be the floating-point value parsed from argv[1]
     - x must satisfy: isfinite(x) && x != 0.0
     
     Examples of valid values would include normal numbers like "1.0", "3.14", "-2.5", etc.
     Examples of invalid values would include "inf", "-inf", "nan", "0.0", "-0.0"

  3. The second argument (argv[2]) can be any string that represents a valid integer when parsed by atoi()
     - This becomes the exponent parameter and doesn't affect whether we reach the target branch

  These constraints ensure that when ldexp() is called, the condition `!finite(value)||value==0.0` will evaluate to false, allowing execution to proceed to the main functionality of the ldexp function.
