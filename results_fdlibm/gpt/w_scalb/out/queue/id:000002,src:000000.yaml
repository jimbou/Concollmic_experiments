target_path_constraint: |-
  Chronological, self-contained constraints to reach: if (!(finite(z) || isnan(z)) && finite(x)) -> true in scalb.

  Context summary for constraints-only consumer:
  - The executable is invoked via a shell command that passes two command-line arguments to main: argv[1] and argv[2]. These are parsed as decimal floating-point numbers using atof into a0 and a1, then passed to a math routine that computes a scaled result r = scalb(a0, a1).
  - We must choose argv[1] (x) and argv[2] (fn) such that:
    1) x is a finite double (not NaN, not ±infinity), and
    2) The computed result z = scalb(x, fn) is not finite and not NaN (i.e., z is ±infinity). That is, an overflow must occur during scaling while x is finite.

  Inputs and environment constraints:
  1. Command-line invocation constraints:
     - The program must be executed with exactly two arguments after the program name. The harness already supplies two arguments, so no change is needed to argument count.
     - Both argv[1] and argv[2] must be provided as strings that atof can parse into double-precision values.

  2. Parsing constraints (ensuring atof parses as intended):
     - argv[1] must be a valid textual representation of a finite IEEE-754 double (e.g., a decimal number within finite range; exclude "inf", "+inf", "-inf", "nan").
     - argv[2] must be a valid textual representation of a finite IEEE-754 double OR a large-magnitude value that causes scaling overflow according to the library’s scalb semantics. Do not use "nan" for argv[2] for this path; we need overflow, not NaN handling.

  3. Mathematical overflow constraint to force z to ±infinity while x is finite:
     - Define x = atof(argv[1]) and fn = atof(argv[2]).
     - Let z = scalb(x, fn), which multiplies x by 2 raised to the power fn (i.e., z = x * 2^fn under typical scalb semantics; some library variants round fn to integer). We need z to overflow to ±infinity and not be NaN.
     - Constraints:
       a) x is finite and non-zero: isfinite(x) == true and x != 0.0.
       b) The sign of z equals the sign of x (since scaling by a positive factor preserves sign). If x > 0, z = +infinity; if x < 0, z = -infinity.
       c) The magnitude after scaling exceeds the maximum finite double (DBL_MAX): |x| * 2^fn > DBL_MAX.
       d) Avoid NaN: Do not set x to NaN and do not combine values that would produce NaN (e.g., x = 0 and fn = -infinity is not applicable here since fn is parsed by atof and should be finite for this path). Ensure the operation leads to overflow, not undefined signaling NaN.

     Equivalent SMT-style constraints:
     - isfinite(x)
     - x != 0
     - isfinite(fn)
     - |x| * 2^fn > DBL_MAX

  4. Edge-condition compatibility with library variants:
     - If the library variant treats fn as an integer (due to _SCALB_INT), ensure fn parses to a value whose integer part (or rounded value) satisfies the overflow condition when used as the exponent k where z = x * 2^k.
     - If the library variant treats fn as a double exponent (non-integer), the same overflow inequality applies with fn as real.

  5. Environment constraints:
     - No special environment variables or files are required. Ensure standard IEEE-754 behavior and default locale for atof (period as decimal separator). Avoid locales where comma is the decimal separator.

  These constraints together ensure the branch condition evaluates to true: z becomes ±infinity (not finite, not NaN) while x is finite, satisfying !(finite(z) || isnan(z)) && finite(x).
