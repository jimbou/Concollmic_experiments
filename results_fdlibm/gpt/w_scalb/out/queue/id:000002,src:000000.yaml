exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Choose inputs:
      # x = 1.0 (finite, non-zero)
      # fn = 2048 (large positive exponent to ensure |x| * 2^fn > DBL_MAX, causing overflow to +/-inf)
      # This satisfies: finite(x) == True, x != 0, finite(fn) == True, and overflow to infinity
      cmd = "./temp_executable 1.0 2048"

      # Ensure standard C locale so atof parses decimal dot consistently
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
