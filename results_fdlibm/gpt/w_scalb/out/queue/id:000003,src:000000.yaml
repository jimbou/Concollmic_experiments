exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # We choose x = 1.0 (finite, nonzero) and fn = -2000 (finite, large negative integer),
      # so that |x| * 2^fn = 1.0 * 2^-2000 < 2^-1074 (DoubleMinSub), ensuring scalb underflows to signed zero.
      # This satisfies: x != 0.0, fn finite, and z = scalb(x, fn) == +/-0.0 with z != x.
      cmd = "./temp_executable 1.0 -2000"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Ensure to raise the error if run failed
          raise e
