justification: This branch has 0% historical coverage and represents the underflow-to-zero
  path of the floating-point scaling operation. Exercising it will validate edge-case
  behavior of scalb when the result flushes to exactly zero while the input is finite
  and non-zero. The two branches previously attempted target NaN/Inf conditions; this
  one explores a distinct, valuable corner case (underflow) not yet covered. It is
  driven purely by the numeric inputs, making it a high-impact target for improving
  coverage of math error handling.
target_path_constraint: |-
  Goal: Trigger the underflow branch in scalb so that the computed result z equals +0.0 or -0.0 while the input x is not exactly zero (i.e., z == 0.0 and z != x evaluates true).

  Execution interface and environment constraints (chronological):
  1) Program invocation via shell must pass exactly two command-line arguments (strings) after the executable name, since the program expects 3 argv entries total (argv[0], argv[1], argv[2]):
     - The harness already invokes using a single shell-quoted string; ensure that, after shell parsing, the process argv contains exactly three entries: argv[0] is the program path, argv[1] is a textual floating-point representation for x, and argv[2] is a textual floating-point representation for fn.
     - No environment variables need to be set; defaults are acceptable. The process must not be constrained by nonstandard floating-point environment modes.

  2) Argument parseability:
     - argv[1] must be a valid decimal floating-point literal accepted by C atof, representing a finite, nonzero double value x (not NaN, not ±Inf, not exactly 0.0). Examples are not provided; only the property is required.
     - argv[2] must be a valid decimal floating-point literal accepted by C atof, representing a finite double value fn (not NaN, not ±Inf). It can be integer-valued or not, since this build uses the double overload (no _SCALB_INT defined in the trace), but it must be finite.

  3) Mathematical relationship required to reach the target branch inside scalb:
     - Let z = __ieee754_scalb(x, fn), i.e., z = x * 2^fn (IEEE-754 scaling by a power of two). To take the branch, require:
       a) z equals signed zero: z == 0.0. In IEEE-754, this occurs if the magnitude |x| * 2^fn underflows to a subnormal magnitude that rounds to zero under the current rounding mode (assumed default round-to-nearest).
       b) z != x: since x must be nonzero (see 2), this will automatically be true when z == 0.0.
     - Combine as: x ≠ 0, fn ∈ R finite, and |x| * 2^fn is strictly smaller than the smallest positive subnormal double so that the computed result is ±0.0.

  4) Numerical bounds (stated symbolically, not concretely):
     - Denote DoubleMinSub = the smallest positive subnormal double (per IEEE-754 binary64). Require: |x| * 2^fn < DoubleMinSub.
     - Additionally, x must be finite and nonzero; fn finite. No requirement on the sign of x; the resulting signed zero will inherit sign(x) under IEEE semantics.

  5) Library/version guards consistent with reaching the branch body:
     - The compilation must not define _IEEE_LIBM; otherwise scalb would return early and skip the checked branch. In the observed build, the non-IEEE path is compiled, as the branch appears in the trace; thus no action is needed, but the constraint is: program must execute a build where the non-IEEE path is active (i.e., runtime follows the code path showing the branch checks).

  Summary of required input properties:
  - argv[1] parses to a finite, nonzero double x.
  - argv[2] parses to a finite double fn such that |x| * 2^fn < DoubleMinSub, causing z = scalb(x, fn) to underflow to exactly zero.
  - No NaNs or Infs among inputs; no special environment settings that alter default IEEE rounding behavior.
