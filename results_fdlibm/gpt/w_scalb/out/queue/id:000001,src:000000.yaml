exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Provide exactly two arguments: first finite, second non-finite
          # Using 'inf' ensures atof(argv[2]) is non-finite (Infinity) on standard libc implementations
          cmd = "./temp_executable 1.0 inf"
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred; return any captured stderr and a negative signal code
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Propagate unexpected errors
          raise e
