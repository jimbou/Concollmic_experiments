target_path_constraint: |-
  Chronological, external-input constraints to reach w_pow.c:pow’s NaN-base-and-zero-exponent branch (isnan(x) true and y == 0.0 true):

  1. Program invocation shape:
     - The program must be executed with exactly three command-line tokens: the executable path, followed by two separate arguments representing doubles in text form.
     - Given the harness uses a shell and passes a single string ("./temp_executable 1.0 1.0"), adjust the command so the shell expands to three tokens. Specifically, the first token selects the executable, the second becomes argv[1], and the third becomes argv[2]. Do not include additional spaces or quotes that would merge arguments.

  2. Argument count requirement:
     - argc must equal 3 upon entering main. This is achieved by providing exactly two non-empty whitespace-separated arguments after the executable name.

  3. Argument content parsing constraints (using C’s atof):
     - argv[1] must parse as a NaN double via atof. Valid textual forms that atof recognizes as Not-a-Number include case-insensitive "nan" optionally followed by payload annotations (implementation-dependent) such as "nan" or "NaN". The value resulting from atof(argv[1]) must be a NaN, i.e., isnan(a0) is true.
     - argv[2] must parse as exactly 0.0 via atof. Provide a textual representation that atof converts to +0.0 (or -0.0), such that the resulting double compares equal to 0.0 under y == 0.0 in the pow function.

  4. Library mode constraint to avoid early IEEE return:
     - Ensure the environment is such that the pow function does not return early at the condition `_LIB_VERSION == _IEEE_ || isnan(y)`. Concretely, two independent requirements must hold:
       a) The global/library configuration `_LIB_VERSION` must not equal `_IEEE_`. This implies running the build or environment where fdlibm’s non-IEEE error-handling path is enabled (e.g., SVID/Posix mode). No source change is allowed; rely on the existing build configuration to satisfy this.
       b) `isnan(y)` must be false, which is already guaranteed by constraint 3 for argv[2] yielding 0.0.

  5. Pow entry preconditions:
     - The program must successfully start and reach main, then call pow(a0, a1) with a0 being NaN and a1 being 0.0, as established above.

  6. Target branch attainment:
     - Inside pow, with `_LIB_VERSION != _IEEE_` and `isnan(y)` false, execution continues past the early return.
     - With a0 being NaN, the condition `if (isnan(x))` evaluates true.
     - Within that block, with a1 equal to 0.0, the inner condition `if (y == 0.0)` evaluates true, reaching the selected branch.
