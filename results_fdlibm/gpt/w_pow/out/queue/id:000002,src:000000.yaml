exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Concrete inputs derived to satisfy the target constraints:
      # - First argument parses to exactly +0.0 -> "0"
      # - Second argument is finite and strictly negative -> "-1"
      # This ensures argc == 3 (program + two args) and satisfies x == 0.0, y < 0.0, finite(y).
      cmd = "./temp_executable 0 -1"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
