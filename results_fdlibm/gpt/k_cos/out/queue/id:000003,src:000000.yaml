  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Chosen concrete inputs:
      # x = 0.9  -> finite and |x| > threshold (~0.785), ensuring ix > 0x3fe90000
      # y = 0.0  -> finite, satisfies parsing and no additional relation required
      # Command must keep executable name and two numeric arguments
