  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Chosen concrete inputs:
      # x = 0.5 -> high word 0x3fe00000 (within [0x3FD33333, 0x3fe90000])
      # y = 1.0 -> finite double
      # This satisfies all target path constraints while keeping argc == 3
      try:
          result = subprocess.run(
              ["./temp_executable 0.5 1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
