  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Choose x with |x| > value whose high word is 0x3fe90000 (~0.785), e.g., x = 1.0
      # Choose any finite y, e.g., y = 1.0
      # Keep exactly two arguments after the program name, preserving the harness structure
