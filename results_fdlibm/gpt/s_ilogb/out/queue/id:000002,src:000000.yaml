  2. Argument parsing into a double:
     - The sole command-line argument must be parsed by atof into a double value that is exactly +0.0.
     - Acceptable textual forms include representations that atof parses to zero (e.g., optional leading/trailing whitespace, an optional sign, followed by digits that evaluate to zero, and no exponent or an exponent that still results in zero). The key requirement is that the resulting IEEE-754 double is exactly 0.0, not subnormal and not NaN/Inf.

  3. IEEE-754 representation constraint:
     - The resulting double must have both its high 32-bit word (HI) and low 32-bit word (LO) equal to 0. In IEEE-754 binary64, this means:
       - Sign bit = 0
       - Exponent field = 0
       - Fraction (mantissa) field = 0
     - This ensures (__HI(x) & 0x7fffffff) == 0 and __LO(x) == 0, hence (hx | lx) == 0 evaluates true.

  4. No environment or I/O constraints beyond normal execution:
     - No files are read; stderr printing and subsequent printf do not affect the branch selection.

  Summary of input constraint:
