  5) x must be a finite, normal number: it must NOT be NaN and must NOT be Infinity. (Ensures hx < 0x7ff00000 is true rather than the NaN/Inf else-branch.)
  6) Combining 3–5 yields: x is a normal finite double (|x| in [2^-1022, DBL_MAX])

  No additional environmental constraints
  7) Stderr/stdout do not affect control flow; filesystem and environment variables are unused. The program should have permission to execute in the current environment (already true in the harness).

