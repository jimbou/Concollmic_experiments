  Argument format and parsing
  2) The single argument must be a textual representation of a double-precision floating-point number in a format accepted by the C standard library function atof (e.g., optional sign, digits, optional decimal point, optional exponent using e or E). No surrounding NULs are required; ASCII/UTF-8 encoding is assumed by the harness.

  Semantic constraints on the numeric value (mapping to IEEE-754 double)
  Let x be the double value parsed from the argument. Let hx be the high 32 bits of x’s 64-bit IEEE-754 representation with the sign bit zeroed (hx = (__HI(x)) & 0x7fffffff in the code). The branch taken depends only on IEEE-754 class of x:
