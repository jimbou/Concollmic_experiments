target_path_constraint: |-
  The program executes a single binary with one command-line argument; that argument is parsed to a double using the standard C function atof, then passed to a function that branches based on whether the double is finite or not. To force execution into the non-finite branch (returning 0x7fffffff), the constraints must ensure the parsed double is Not-a-Number (NaN) or Infinity.

  Chronological, external input/environment constraints:

  1) Process invocation constraints:
  - The program must be invoked with exactly one command-line argument beyond the program name (argc == 2). No environment changes are required beyond standard execution permissions.

  2) Argument parsing constraints (atof behavior):
  - The single argument string must be such that atof, under the C locale, parses it to a non-finite double value. Acceptable categories:
    a) Positive Infinity
    b) Negative Infinity
    c) Not-a-Number (quiet or signaling NaN)
  - Do not rely on implementation-specific spellings outside common atof-recognized tokens. The string must be one of the commonly recognized forms producing non-finite:
    • "inf" or "infinity" (case-insensitive) for Infinity
    • With optional leading sign '+' or '-' for positive/negative infinity
    • "nan" optionally followed by parentheses with an identifier (e.g., "nan", "nan()", "nan(foo)") for NaN

  3) Numeric range/format constraints (to avoid finite interpretations):
  - The argument must not be a finite numeric literal (decimal, hexadecimal, or scientific notation) and must not include trailing valid digits that could cause atof to accept a finite prefix. The entire string, after leading whitespace and optional sign, must match a non-finite token (inf/infinity/nan forms) so that the resulting parsed double is non-finite.

  4) Locale/encoding constraints:
  - The execution environment should use the default C/POSIX locale where atof recognizes the above tokens. The input string must be plain ASCII/UTF-8 without non-ASCII characters.

  These constraints ensure the parsed double is non-finite, causing the ilogb function to take the else path corresponding to hx >= 0x7ff00000 and return 0x7fffffff.
