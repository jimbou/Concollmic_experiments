exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      # Provide a single non-finite atof-parsable token as the sole argument.
      # "nan" is recognized by standard C atof/strtod under the C/POSIX locale.
      cmd = "./temp_executable nan"

      # Ensure C/POSIX locale so atof recognizes non-finite tokens reliably
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
