target_path_constraint: |-
  Objective: Reach the final `else` branch in ilogb(double x), which executes when x is NaN or ±Infinity, i.e., when the high 32 bits of the IEEE-754 double satisfy (hx & 0x7fffffff) >= 0x7ff00000.

  Harness constraints (chronological):
  1) Program invocation:
     - The program must be executed with exactly one command-line argument (argc == 2). The existing harness already supplies a single argument, so no change is required.

  2) Argument parsability by atof:
     - The single command-line argument must be a string that the C library function atof parses into a double value that is either NaN or ±Infinity. Standard C atof accepts textual representations like “nan”, “+nan”, “-nan”, “inf”, “+inf”, “-inf”, “infinity”, “+infinity”, “-infinity” (case-insensitive), as implementation permits.
     - No leading or trailing non-whitespace characters other than the valid sign and the tokens above may be present; optional leading/trailing whitespace is acceptable per atof.

  3) Numeric value category requirement (core path condition):
     - The parsed double must satisfy isfinite(x) == false, i.e., x is NaN or infinite. In terms of IEEE-754 bit pattern, its exponent field must be all ones (0x7ff) regardless of sign, and for NaN the fraction is non-zero; for infinity the fraction is zero.
     - Equivalently: Let x be the double corresponding to argv[1]. Let hx = high 32 bits of x interpreted as unsigned; then (hx & 0x7fffffff) >= 0x7ff00000 must hold, which occurs uniquely for NaN or ±Infinity.

  4) Environment assumptions:
     - No special environment variables or locale settings should alter atof’s recognition of the tokens above. Use the default “C” locale rules for ASCII tokens.

  Summary (sufficient constraint set):
  - Provide exactly one command-line argument whose atof-parsed double is NaN or ±Infinity. This ensures the branch (hx & 0x7fffffff) >= 0x7ff00000 is taken in ilogb.
