exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Prepare environment to ensure C locale numeric parsing (decimal point '.')
      env = os.environ.copy()
      env["LC_NUMERIC"] = "C"
      # Ensure no overriding of LC_NUMERIC by LC_ALL
      env["LC_ALL"] = "C"

      try:
          # Execute the original harness but with the concrete input that makes atof == -1.0 exactly
          # Using shell=True with a single string ensures one argument is passed to the program
          result = subprocess.run(
              ["./temp_executable -1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              env=env,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred; return any stderr captured before timeout and a killed return code
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed for other reasons
          raise e
