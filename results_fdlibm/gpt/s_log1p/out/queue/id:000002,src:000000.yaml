exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Provide a single finite double argument whose high 32-bit word satisfies hx >= 0x3FDA827A.
      # Chosen value: 0.9 (decimal), which is > ~0.853553390593 and finite.
      # Keep the same shell-based command structure with exactly one argument.
      cmd = "./temp_executable 0.9"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
