exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Environment setup to ensure:
      # - No LD_PRELOAD or LD_LIBRARY_PATH interposition overrides local fabs
      # - Locale ensures atof parses with '.' as decimal separator
      env = {
          "LC_ALL": "C",
          "LANG": "C",
      }

      try:
          # Single numeric argument ensures argc == 2 and atof succeeds.
          # Using a negative finite value exercises the sign-bit mask in local fabs.
          cmd = "./temp_executable -3.14159"
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
