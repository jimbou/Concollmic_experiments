  4) Additional low-level representation constraints (ensuring parsing and IEEE checks behave as expected):
  - The string for n contains only optional leading whitespace, optional leading sign '+', followed by one or more digits (0–9). No trailing non-digit characters.
  - The string for x contains only optional leading whitespace, optional sign, digits, optional decimal point with digits, and optional exponent part using 'e' or 'E' with an integer exponent. No trailing text.
  - Both arguments must fit within typical C ranges: n within 32-bit signed int range; x within double-precision finite range, and not producing overflow or underflow to ±Inf or NaN.

  5) Interactions with __ieee754_yn (called later):
  - __ieee754_yn also processes n and x; to avoid its own early invalid-input branches that might change overall behavior, ensure x > 0 (strictly positive) so that the hx<0 (negative x) path returning zero/zero is not taken. And ensure x is not zero to avoid -one/zero path.

  6) Combined numeric constraints summarizing all requirements:
  - n ∈ Z, 2 ≤ n ≤ INT_MAX.
  - x ∈ R, is finite, x > 0, and x ≥ n.

  These constraints guarantee the following execution:
  - main parses two arguments and calls __ieee754_jn(n, x).
  - In __ieee754_jn: n ≥ 2 avoids n==0/1 early returns; finite x avoids IEEE NaN/Inf checks; fabs(x) = x (since x > 0); (double)n ≤ x selects the targeted branch.
  - Subsequent call to __ieee754_yn(n, x) will also proceed along its normal large-x path for positive finite x, improving coverage further without interfering with the targeted branch.
