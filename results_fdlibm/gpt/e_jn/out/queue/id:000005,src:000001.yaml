  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Concrete inputs chosen to satisfy all constraints:
      # - argc == 3 (program name + 2 args)
      # - n = 2 (atoi("2") == 2, integer >= 2)
      # - x = 1e100 (atof("1e100") is a finite, non-negative double; x >= n;
      #              and its IEEE-754 high 32-bit word satisfies ix >= 0x52D00000)
      try:
          result = subprocess.run(
              ["./temp_executable 2 1e100"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
