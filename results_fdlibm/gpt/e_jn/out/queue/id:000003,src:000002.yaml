  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Chosen concrete inputs satisfying all constraints:
      # - argc == 3 by passing two tokens after the executable name
      # - n = 2 (integer, >= 2)
      # - x = 1.5 (finite double, > 0, and (double)n > x)
      # - x >= 2^-30, since 1.5 >> 9.313225746154785e-10
      try:
          cmd = "./temp_executable 2 1.5"
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return captured stderr (if any) and a negative signal code
          return (e.stderr if getattr(e, 'stderr', None) is not None else ""), -signal.SIGKILL
      except Exception as e:
          # Ensure to raise the error if run failed
          raise e
