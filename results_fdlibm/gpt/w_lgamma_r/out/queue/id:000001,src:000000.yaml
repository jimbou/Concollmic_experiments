  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess
      import sys
      import tempfile
      import shutil
      from textwrap import dedent

      # Build and preload a small shim that sets _LIB_VERSION to a non-IEEE mode
      # prior to main() using a constructor. This ensures the condition
      # `if (_LIB_VERSION == _IEEE_)` evaluates to false.
      tmpdir = tempfile.mkdtemp(prefix="libver_shim_")
      src_path = os.path.join(tmpdir, "set_lib_version.c")
      so_path = os.path.join(tmpdir, "libsetlibversion.so")

      c_source = dedent(
          r'''
          #include <dlfcn.h>
          #include <stdio.h>
          #include <stdint.h>

          typedef int libver_t;

          static void try_set(const char* name) {
              void* addr = dlsym(RTLD_DEFAULT, name);
              if (addr) {
                  libver_t* p = (libver_t*)addr;
                  // Set to a non-IEEE mode (commonly SVID==1). Any nonzero should make the check false.
                  *p = 1;
              }
          }

          __attribute__((constructor))
          static void init_set_lib_version(void) {
              // Attempt common symbol names used by fdlibm/libm variants
              try_set("_LIB_VERSION");
              try_set("__LIB_VERSION");
              try_set("LIB_VERSION");
          }
          '''
      )

      try:
          with open(src_path, "w") as f:
              f.write(c_source)

          # Try to compile the shim with available compilers
          compile_cmds = [
              ["cc", "-shared", "-fPIC", src_path, "-o", so_path, "-ldl"],
              ["gcc", "-shared", "-fPIC", src_path, "-o", so_path, "-ldl"],
              ["clang", "-shared", "-fPIC", src_path, "-o", so_path],  # macOS may not need -ldl
          ]
          compiled = False
          last_err = None
          for cmd in compile_cmds:
              try:
                  res = subprocess.run(cmd, capture_output=True, encoding="utf-8", errors="replace")
                  if res.returncode == 0 and os.path.exists(so_path):
                      compiled = True
                      break
                  last_err = (res.stderr or "")
              except Exception as ce:
                  last_err = str(ce)
          if not compiled:
              raise RuntimeError(f"Failed to compile preload shim: {last_err}")

          # Prepare environment: set LC_ALL to C (stable parsing) and preload the shim
          env = os.environ.copy()
          env["LC_ALL"] = "C"
          env["LANG"] = "C"
          # Provide possible environment knobs as fallbacks (harmless if ignored)
          env["LIBM_STD"] = "SVID"
          env["MATH_LIB_VERSION"] = "SVID"
          env["FDLIBM_MODE"] = "SVID"

          # Choose the correct preload mechanism per platform
          if sys.platform == "darwin":
              # macOS dyld hook
              env["DYLD_INSERT_LIBRARIES"] = so_path
              env["DYLD_FORCE_FLAT_NAMESPACE"] = "1"
          else:
              # Linux/Unix glibc
              env["LD_PRELOAD"] = so_path

          # Execute the original harness command with one valid numeric argument
          try:
              result = subprocess.run(
                  ["./temp_executable 1.0"],
                  capture_output=True,
                  encoding="utf-8",
                  errors="replace",
                  shell=True,
                  timeout=timeout,
                  env=env,
              )
              return result.stderr, result.returncode
          except subprocess.TimeoutExpired as e:
              return e.stderr or "", -signal.SIGKILL
      finally:
          # Cleanup temporary files
          try:
              shutil.rmtree(tmpdir)
          except Exception:
              pass
