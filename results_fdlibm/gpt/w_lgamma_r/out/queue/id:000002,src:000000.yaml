  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess
      import tempfile
      import shutil
      from pathlib import Path

      # We need x to be a finite nonpositive integer so that lgamma hits a pole.
      # Choose x = -1.0 to satisfy:
      #  - argc == 2 (single numeric argument)
      #  - x is finite
      #  - x is integer and x <= 0
      #  - y = lgamma_r(x) becomes non-finite (Inf/NaN)
      arg_value = "-1.0"

      # To ensure the wrapper doesn't return early via the _IEEE_ fast-path,
      # set _LIB_VERSION != _IEEE_ by LD_PRELOADing a tiny shared object that defines
      # the global symbol `_LIB_VERSION` with a non-IEEE value (use 2, matching POSIX in fdlibm).
      # If the platform/libm doesn't use this mechanism, this preload is harmless.
      tmpdir = tempfile.mkdtemp(prefix="libm_preload_")
      so_path = Path(tmpdir) / "liboverride_libm_version.so"
      c_path = Path(tmpdir) / "override_libm_version.c"

      c_src = (
          """
          // Minimal interposer to set fdlibm's _LIB_VERSION away from _IEEE_.
          // Values in fdlibm: _IEEE_=-1, _SVID_=0, _XOPEN_=1, _POSIX_=2, _ISOC_=3.
          // We set to 2 (POSIX), ensuring _LIB_VERSION != _IEEE_.
          int _LIB_VERSION = 2;
          """
      )
      try:
          c_path.write_text(c_src)
          # Compile the shared object. A C compiler is expected to be available in the environment.
          # Use cc to maximize compatibility.
          compile_cmd = [
              "cc", "-shared", "-fPIC", "-o", str(so_path), str(c_path)
          ]
          compile_res = subprocess.run(
              compile_cmd,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              check=False,
          )
          if compile_res.returncode != 0:
              raise RuntimeError(
                  f"Failed to build LD_PRELOAD library (rc={compile_res.returncode}):\n"
                  f"stdout:\n{compile_res.stdout}\nstderr:\n{compile_res.stderr}"
              )

          # Prepare environment with LD_PRELOAD set to our interposer
          env = os.environ.copy()
          env["LD_PRELOAD"] = str(so_path)

          # Build command string exactly as the original harness style (shell=True)
          cmd = f"./temp_executable {arg_value}"

          try:
              result = subprocess.run(
                  [cmd],
                  capture_output=True,
                  encoding="utf-8",
                  errors="replace",
                  shell=True,
                  timeout=timeout,
                  env=env,
              )
              return result.stderr, result.returncode
          except subprocess.TimeoutExpired as e:
              return e.stderr, -signal.SIGKILL
          except Exception:
              raise
      finally:
          # Cleanup temporary files
          try:
              shutil.rmtree(tmpdir)
          except Exception:
              # Best-effort cleanup; ignore errors
              pass
