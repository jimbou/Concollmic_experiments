  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # We pass exactly one command-line argument that atof recognizes as non-finite (Infinity)
      # This ensures hx >= 0x7ff00000 in s_expm1.c:expm1
      try:
          cmd = "./temp_executable inf"  # single non-finite argument; argc == 2
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and indicate killed by SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Propagate unexpected execution failures
          raise e
