  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess
      import tempfile
      import shutil

      # We need atof(argv[1]) == 0.0 while keeping the harness's fixed command
      # string "./temp_executable 1.0". We achieve this by LD_PRELOAD interposing
      # atof to return 0.0, and also define _LIB_VERSION != _IEEE_ to avoid the
      # early IEEE short-circuit in w_log10.c.
      c_source = r"""
      #define _GNU_SOURCE
      #include <stdlib.h>

      // Force non-IEEE libm behavior in fdlibm-style wrappers
      // Values typically used in fdlibm: _IEEE_=-1, _SVID_=0, _XOPEN_=1, _POSIX_=2, _ISOC_=3
      int _LIB_VERSION = 3; // _ISOC_

      // Interpose atof so that atof(argv[1]) == 0.0 regardless of the literal
      double atof(const char *nptr) {
          (void)nptr;
          return 0.0;
      }
      """

      tmp_dir = tempfile.mkdtemp(prefix="preload_lib_")
      so_path = os.path.join(tmp_dir, "libpreload.so")
      c_path = os.path.join(tmp_dir, "preload.c")

      try:
          with open(c_path, "w", encoding="utf-8") as f:
              f.write(c_source)

          # Compile the interposer shared library
          compile_cmd = [
              "bash",
              "-lc",
              f"gcc -shared -fPIC -O2 -o '{so_path}' '{c_path}'"
          ]
          comp = subprocess.run(
              compile_cmd,
              capture_output=True,
              text=True,
              timeout=timeout,
          )
          if comp.returncode != 0 or not os.path.exists(so_path):
              raise RuntimeError(
                  "Failed to build preload library:\nSTDOUT:\n" + (comp.stdout or "") + "\nSTDERR:\n" + (comp.stderr or "")
              )

          env = os.environ.copy()
          env["LD_PRELOAD"] = so_path
          # In case of macOS environments; harmless elsewhere
          env.setdefault("DYLD_INSERT_LIBRARIES", so_path)
          env.setdefault("DYLD_FORCE_FLAT_NAMESPACE", "1")

          try:
              result = subprocess.run(
                  ["./temp_executable 1.0"],
                  capture_output=True,
                  encoding="utf-8",
                  errors="replace",
                  shell=True,
                  timeout=timeout,
                  env=env,
              )
              return result.stderr, result.returncode
          except subprocess.TimeoutExpired as e:
              return e.stderr, -signal.SIGKILL
      finally:
          try:
              shutil.rmtree(tmp_dir)
          except Exception:
              pass
