  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess
      import tempfile
      import textwrap
      import shutil

      # Build a tiny preload library that forces fdlibm/libm into non-IEEE mode
      # by setting the runtime _LIB_VERSION to _POSIX_ (2) before main()
      tmpdir = tempfile.mkdtemp(prefix="fdlibm_preload_")
      c_path = os.path.join(tmpdir, "setlibm.c")
      so_path = os.path.join(tmpdir, "libsetlibm.so")
      c_src = r'''
      #define _GNU_SOURCE
      #include <dlfcn.h>

      typedef void (*setver_fn)(int);

      static void __attribute__((constructor)) set_non_ieee(void) {
          void *handle = RTLD_DEFAULT;

          /* Try the official setter if available */
          setver_fn setver = (setver_fn)dlsym(handle, "__setlibm_version");
          if (setver) {
              setver(2); /* _POSIX_ */
              return;
          }

          /* Fallback: directly set the global version variable (common names) */
          int *p = (int*)dlsym(handle, "_LIB_VERSION");
          if (!p) {
              p = (int*)dlsym(handle, "__libm_version");
          }
          if (p) {
              *p = 2; /* _POSIX_ */
          }
      }
      '''

      try:
          with open(c_path, "w") as f:
              f.write(textwrap.dedent(c_src))

          # Compile the shared object
          compile_cmd = [
              "gcc", "-shared", "-fPIC", "-O2",
              c_path, "-o", so_path, "-ldl"
          ]
          comp = subprocess.run(
              compile_cmd,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              check=False,
          )
          if comp.returncode != 0:
              raise RuntimeError(f"Failed to build preload library: {comp.stderr}\n{comp.stdout}")

          # Prepare environment: enforce C locale for '.' decimal separator and preload the SO
          env = os.environ.copy()
          env["LC_ALL"] = "C"
          env["LD_PRELOAD"] = so_path + (":" + env["LD_PRELOAD"] if "LD_PRELOAD" in env and env["LD_PRELOAD"] else "")

          try:
              result = subprocess.run(
                  ["./temp_executable 1.0"],
                  capture_output=True,
                  encoding="utf-8",
                  errors="replace",
                  shell=True,
                  timeout=timeout,
                  env=env,
              )
              return result.stderr, result.returncode
          except subprocess.TimeoutExpired as e:
              return e.stderr, -signal.SIGKILL
      finally:
          # Cleanup temporary files
          try:
              shutil.rmtree(tmpdir)
          except Exception:
              pass
