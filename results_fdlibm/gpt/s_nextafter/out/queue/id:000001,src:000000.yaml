justification: This branch guards the specialized handling when the first input (x)
  is exactly zero. It has zero historical coverage (lines 38-51 all uncovered) and,
  when taken, executes a multi-statement block that sets up the minimal subnormal
  step away from zero, exercising unique floating-point edge-case logic not covered
  by the current run. Reaching it will significantly increase coverage inside nextafter’s
  core path (bypassing the early x==y return). This branch is reachable by controlling
  the command-line arguments (no harness changes required).
target_path_constraint: |-
  Environment and invocation:
  1) Program must be invoked with exactly two command-line arguments (excluding argv[0]): argc == 3 in the C program. The harness already runs the executable with two arguments, so keep two whitespace-separated tokens after the program name.

  Argument parsing and format:
  2) Both arguments must be valid decimal representations of double-precision floating-point numbers, as parsed by the standard C function atof. They may be in fixed-point or scientific notation. No locale-dependent characters (e.g., commas) may appear.

  Constraint to reach nextafter’s zero-x branch:
  3) Let x be the double parsed from argv[1]. x must be exactly +0.0 or -0.0 in IEEE-754 double format so that its high 32 bits (ix) and low 32 bits (lx) satisfy (ix | lx) == 0 when masking off the sign bit: i.e., the value is numerically zero so both mantissa and exponent bits are zero. Practically, this means argv[1] must represent zero as parsed by atof (e.g., optional sign followed by 0 with optional fractional/exponent part that evaluates to zero). Avoid any representation that would parse to NaN or an underflowed subnormal nonzero; it must be exactly zero.

  4) Let y be the double parsed from argv[2]. y must be any finite double distinct from x to avoid the early x == y return. To ensure we do not enter the NaN-handling branch, y must not be NaN and must not have NaN payload; similarly x must not be NaN (already ensured by constraint 3). No additional restriction is required other than finiteness is preferred but not strictly necessary as long as it’s not NaN, because the NaN-check rejects only NaNs.

  Avoid short-circuiting earlier branches:
  5) Ensure the NaN check in nextafter does not trigger: neither argv[1] nor argv[2] may be NaN (atof must not produce NaN). Infinity is allowed by that check, but keeping both finite is safer to ensure subsequent arithmetic executes deterministically within the zero-x path. Therefore, constrain argv[2] to a finite number and keep argv[1] as exactly zero.

  6) Ensure x != y: since x is exactly zero per (3), constrain y to be any nonzero finite value so that the x==y equality branch is not taken, and execution proceeds into the ((ix|lx)==0) block.

  Summary constraints in SMT-style (conceptual):
  - Parse(argv[1]) = x, Parse(argv[2]) = y
  - is_double(argv[1]) ∧ is_double(argv[2])
  - x = +0.0 ∨ x = -0.0
  - not isNaN(x) ∧ not isNaN(y)
  - isFinite(y)
  - y ≠ 0.0
