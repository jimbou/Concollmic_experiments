exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Concrete inputs satisfying the constraints:
      # argv[1] = "0"  -> exactly +0.0 when parsed by atof
      # argv[2] = "1.0" -> finite, nonzero, not NaN, distinct from x
      cmd = "./temp_executable 0 1.0"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
