  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      # Provide at least one NaN argument per C standard atof parsing rules
      # argv[1] = "nan" -> guaranteed NaN (case-insensitive)
      # argv[2] = "1.0" -> any valid non-NaN numeric literal
      cmd = "./temp_executable nan 1.0"

      # Ensure locale uses dot as decimal separator and recognizes standard NaN token
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"
      env["LC_NUMERIC"] = "C"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
