  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Ensure the executable exists and is runnable
      exe_path = "./temp_executable"
      if not os.path.exists(exe_path):
          raise FileNotFoundError(f"Executable not found at {exe_path}")
      if not os.access(exe_path, os.X_OK):
          raise PermissionError(f"Executable at {exe_path} is not marked as executable")

      # Provide exactly two arguments so argc==3, with at least one NaN for atof parsing
      # Using lower-case 'nan' ensures atof parses it as NaN in the C locale
      cmd = f"{exe_path} nan 1.0"

      # Force C locale to guarantee standard atof behavior
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
