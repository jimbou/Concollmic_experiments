target_path_constraint: |-
  Chronological constraints to trigger the special-value branch in nextafter (NaN handling):

  1. Command-line invocation shape:
     - The program must be invoked with exactly three tokens when parsed by the shell: the executable path, argv[1], and argv[2]. Given the harness uses shell=True with a single string "./temp_executable 1.0 1.0", ensure the executed command expands to a program path followed by two arguments. Do not alter the harness; constraints below focus on values of argv[1] and argv[2].

  2. Argument count constraint:
     - argc must equal 3 at program start so that the argc check does not trigger early termination. This implies argv[1] and argv[2] must be present and non-empty strings.

  3. Parsing constraints (using C standard atof in the C locale):
     - argv[1] and argv[2] are each parsed by atof into double values a0 and a1.
     - atof accepts decimal representations, including special IEEE-754 literals "nan", "nan(...)" and case variations, as well as infinities "inf"/"infinity".
     - Locale must be such that decimal point is '.', but this is typical for default C locale; no locale manipulation is required.

  4. Special-value (NaN) requirement to satisfy the branch condition:
     - At least one of a0 or a1 must be a NaN (Not-a-Number) value when parsed by atof.
     - Formally: isNaN(a0) ∨ isNaN(a1) must hold after parsing.
     - This ensures that ix>=0x7ff00000 and ((ix-0x7ff00000)|lx)!=0 for the NaN input (IEEE-754 double NaN has exponent 0x7ff and a nonzero mantissa), making the overall condition true.

  5. Additional constraints to avoid other early returns overriding coverage:
     - It is acceptable that x==y is false or true; however, when a NaN is present, x==y will be false (NaN is not equal to any value, including itself), so the function will not return at the x==y check. No extra constraint is needed.

  6. Environment constraints:
     - The executable must exist and be runnable in the current working directory.
     - No files are read; standard environment should provide no interfering signals or timeouts beyond the harness timeout.

  Sufficient input-level constraint summary:
     - Provide two command-line arguments such that at least one parses via atof to a NaN double under the C locale. All other conditions (argc==3) must hold by ensuring two arguments are present.
