  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      try:
          # Ensure a C locale so '.' is the decimal point and no thousands separators
          env = os.environ.copy()
          env["LC_ALL"] = "C"
          env["LANG"] = "C"

          # Choose X = 10.0:
          # - finite, non-zero
          # - hi_word(|10.0|) = 0x40240000 which satisfies 0x3fd62e43 <= hi < 0x40360000
          # - ensures mid-range branch (ix < 0x40360000) is true and small-x return is skipped
          cmd = "./temp_executable 10.0"

          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return captured stderr and -SIGKILL as return code
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Propagate other errors
          raise e
