exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Ensure locale where decimal point is '.', so atof parses as intended
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"
      env["LC_NUMERIC"] = "C"

      # Use exactly three argv elements: argv[0]=program, argv[1]=y (finite), argv[2]=x (exact +1.0)
      # Both numbers are valid finite decimal strings; x parses exactly to IEEE-754 double +1.0
      cmd = "./temp_executable 0.5 1.0"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              env=env,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
