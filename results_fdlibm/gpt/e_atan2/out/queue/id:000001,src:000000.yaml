  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Constraints satisfaction reasoning:
      # - Exactly two arguments after program name: provided as "1.0 inf"
      # - y (first arg) is finite: "1.0" -> finite double
      # - x (second arg) is infinity: "inf" -> atof/strtod recognizes as infinity (case-insensitive)
      # - Neither argument is NaN
      # - Invocation uses shell=True with a single command string, matching the original harness pattern

      try:
          cmd = "./temp_executable 1.0 inf"
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
