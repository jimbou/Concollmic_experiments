  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Invoke the original harness structure but substitute argv[1] with a special-value token
          # that atof parses as Infinity, ensuring ix >= 0x7ff00000 in s_cos.c:cos
          result = subprocess.run(
              ["./temp_executable inf"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return captured stderr and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
