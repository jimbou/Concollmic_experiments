target_path_constraint: |-
  Chronological, input-level constraints to reach: else if (ix >= 0x7ff00000) -> true in s_cos.c:cos.

  1. Command invocation and argument count
  - The program must be started with exactly one command-line argument after the executable name (i.e., argc == 2). The harness already invokes: shell command string "./temp_executable 1.0" which passes a single token as argv[1]. Keep the single-argument form.

  2. Argument string must represent an IEEE-754 special value via atof
  - The single argument (argv[1]) must be a string that the C library function atof parses into a double value that is either NaN (Not-a-Number) or Infinity. Examples are forbidden; instead, specify acceptable categories:
    a) A textual representation that parses to positive or negative infinity under atof (platform’s C library typically accepts case-insensitive forms like "inf" or "infinity" with optional sign). Resulting double must have an exponent field of all 1s and a zero fraction (Infinity) to ensure ix >= 0x7ff00000.
    b) A textual representation that parses to NaN under atof (commonly "nan" forms, optionally "nan(...)"), producing a double with exponent all 1s and a nonzero fraction (NaN). This also satisfies ix >= 0x7ff00000.
  - No whitespace or extra tokens should be present that would prevent atof from consuming the intended special value; the entire argv[1] should be the special value token.

  3. Numeric range relative to threshold used in cos
  - The branch in cos is entered when the high 32 bits of the double (after masking sign) are >= 0x7ff00000, which occurs exactly for NaN or Infinity values. Therefore, ensure the parsed double is NaN or ±Infinity; finite values, regardless of magnitude, will not meet this condition.

  4. Environment and encoding
  - Argument string must be encoded in ASCII or UTF-8 without non-ASCII characters, so atof recognizes the special-value keywords.

  5. Shell execution considerations
  - Because the harness uses shell=True with a single string "./temp_executable 1.0", to change argv[1], the provided string must preserve quoting such that the executable receives one argument token equal to the special-value text. Avoid shell metacharacters that could alter tokenization. The final command line should look like: ./temp_executable <special-token>, yielding argc == 2 and argv[1] == <special-token> exactly.

  These constraints guarantee that atof produces NaN or Infinity, making ix >= 0x7ff00000 true, and driving execution into the targeted else-if branch in cos.
