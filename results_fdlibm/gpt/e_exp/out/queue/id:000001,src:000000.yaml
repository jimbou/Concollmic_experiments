  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Chosen concrete input:
      # argv[1] = "0.9" satisfies all constraints:
      # - Exactly one argument after program name
      # - Finite double, not NaN/Inf
      # - |0.9| = 0.9 which is:
      #   > 0.34657359027997264 (ln(2)/2) and < 1.0397207708399179, and < 709.782712893384
      cmd = "./temp_executable 0.9"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
