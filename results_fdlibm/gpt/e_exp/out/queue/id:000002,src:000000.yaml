  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use the same invocation style (shell=True, single string command),
          # but provide a new concrete argument satisfying the constraints:
          # x = 2.0 which is finite, >= 0, and has high word hx = 0x40000000,
          # thus 0x3FF0A2B2 <= hx < 0x40862E42 and follows the required path.
          result = subprocess.run(
              ["./temp_executable 2.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
