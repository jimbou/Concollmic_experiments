  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # We choose x = 1048576.125, which is 2^20 + 1/8.
      # This ensures:
      # - The magnitude satisfies 2^20 <= |x| < 2^52 (j0 = 20)
      # - The value is finite, non-zero, and normal
      # - The low 32-bit mantissa word has a non-zero bit (specifically at position corresponding to 2^{-23})
      # - x is not an integer multiple of 2^(52 - j0) (here, 2^32)
      # - The sole argument is a standard decimal string parsable by atof

      try:
          cmd = "./temp_executable 1048576.125"
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
