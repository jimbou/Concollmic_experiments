  - Run the program with exactly one command-line argument (so that argc == 2). The harness already does this by invoking the executable with a single token argument. Ensure the shell does not split it (already enforced by the harness).

  2) Argument format:
  - The sole argument must be a finite, non-NaN, non-infinite decimal string that atof can parse into a double value x.

  3) Magnitude range for selecting the code region 20 <= j0 <= 51:
  - Let x be the parsed double. Define j0 = floor(log2(|x|)) (the unbiased exponent of x’s IEEE-754 representation), with x ≠ 0. Constrain 20 <= j0 <= 51. Equivalently, require 2^20 <= |x| < 2^52.
  - This excludes subnormals, zeros, very small magnitudes (j0 < 20), and very large magnitudes / special values (j0 > 51 or NaN/Inf).

  4) Ensure the lower-bits test (i1 & i) == 0 evaluates to false at lines 67-70:
  - In this region, the code computes i = 0xffffffff >> (j0 - 20) and then checks (i1 & i) == 0. Here i1 is the low 32 bits of the IEEE-754 double (the fraction’s lower word, plus low sign/exponent bits impact only the high word). To make the condition false, require that at least one bit among the lowest (j0 - 20 + 1) bits of the 32-bit low word i1 is 1.
  - Restated without referring to internals: Require x is not exactly representable at the granularity of 2^(−(j0−20)) in its low 32-bit portion; i.e., x must have a nonzero fractional component when truncated to a multiple of 2^(52−(j0+1)) in binary. Practically: choose x such that, when scaled so that its binary point is just left of bit index (j0), the fraction has at least one 1 within the lower 32-bit portion corresponding to positions [0 .. (j0−20)].

  5) Preserve finiteness and normality:
  - Disallow inputs that parse to NaN, +Inf, −Inf, or ±0.0. Ensure standard decimal syntax without overflows.

  6) Avoid exact integer cases in this exponent band:
  - Ensure x is not an integer multiple of 2^(52−j0). This prevents the check from returning true and short-circuiting to return x unchanged.

  Notes on input encoding/format for the single argument:
  - Acceptable forms include optional leading sign (+/−), digits, optional decimal point, optional fractional digits, and optional exponent part using e or E with an integer exponent. No surrounding whitespace is necessary but permitted by atof; avoid extra tokens since the harness passes a single shell word.
