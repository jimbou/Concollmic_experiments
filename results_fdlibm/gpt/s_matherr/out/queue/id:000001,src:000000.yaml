exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      # Use a NaN literal recognized by strtod: "nan"
      # Ensure the shell expands to two argv entries: argv[0] = ./temp_executable, argv[1] = nan
      # Set locale to C to be robust against any locale quirks, though "nan" is locale-insensitive
      env = os.environ.copy()
      env["LC_ALL"] = "C"

      try:
          result = subprocess.run(
              ["./temp_executable nan"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
