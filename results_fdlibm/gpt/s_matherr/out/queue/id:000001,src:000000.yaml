target_path_constraint: |-
  Constraints are listed in the order they must be satisfied during program execution.

  1. Command invocation format
  - The test harness invokes the program via a shell with a single command-line string: "./temp_executable 1.0".
  - The program expects exactly one additional command-line argument (besides argv[0]), i.e., argc must equal 2. Therefore, ensure the final shell command expands to two argv entries: argv[0] = path to the executable; argv[1] = a single token representing the numeric input.

  2. Argument token must parse as a floating-point number
  - The program uses the C library function strtod(argv[1], NULL) to convert argv[1] to a double.
  - strtod must consume the entire token or at least produce a double value. To reach the target branch (NaN check), the resulting double must be a NaN per IEEE 754.
  - Therefore, argv[1] must be a single token that strtod converts to a NaN. Standard C library behavior on many platforms accepts certain spellings (e.g., case-insensitive forms of "nan"). However, do not rely on unspecified variants; the input must be whatever the specific libc recognizes as a NaN literal. Symbolically: parsed_double = NaN.

  3. Data flow into matherr
  - The program constructs a struct exception with fields:
    - ex.type = 0 (irrelevant to reaching the branch)
    - ex.name = "matherr_test" (string literal; irrelevant)
    - ex.arg1 = parsed_double
    - ex.arg2 = 0.0
    - ex.retval = 0.0
  - The function matherr receives a pointer to this struct and evaluates the condition x->arg1 != x->arg1.
  - In IEEE 754 semantics, any NaN is not equal to itself. Thus, to make the condition true, ensure parsed_double is NaN.

  4. Environmental and encoding constraints
  - No file I/O is performed; only the command-line argument matters.
  - The process locale and encoding should not interfere with strtod recognizing the NaN literal. Avoid locale-dependent decimal separators; use a token that is locale-insensitive for NaN. Symbolically: strtod(token) yields NaN regardless of locale settings used at runtime.

  Summary (SMT-style):
  - Let token be the program’s argv[1] as a byte string in ASCII.
  - Constraint C1: argc == 2.
  - Constraint C2: strtod(token, NULL) returns a double value d.
  - Constraint C3: isNaN(d) == true.
  - Then at matherr: (d != d) evaluates to true, covering the target branch.
