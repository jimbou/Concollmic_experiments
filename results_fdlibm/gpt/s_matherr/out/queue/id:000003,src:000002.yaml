exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Keep locale environment (not required for this branch, but harmless)
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LC_NUMERIC"] = "C"
      env["LANG"] = "C"

      try:
          # Invoke with zero command-line parameters after the program name to make argc = 1
          # This satisfies the target branch condition (argc != 2)
          result = subprocess.run(
              ["./temp_executable"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
