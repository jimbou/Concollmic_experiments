     - Option A: Provide no additional command-line parameters beyond the program name. This sets `argc = 1`, which satisfies `argc != 2`.
     - Option B: Provide two or more parameters after the program name. This sets `argc >= 3`, which satisfies `argc != 2`.
     - Avoid the configuration where exactly one parameter is provided after the program name (which would make `argc = 2`).

  3. Shell/environment considerations:
     - If invoking via a shell, ensure arguments are tokenized such that the final argument count is not 2. For example, use quoting or spacing to make the shell produce either zero parameters or two-or-more parameters as tokens passed to the executable. The exact content of parameters is irrelevant; only the count matters.
