exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Ensure C locale so '.' is the decimal separator for strtod
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LC_NUMERIC"] = "C"
      env["LANG"] = "C"

      # Concrete input to satisfy argc == 2 and a valid numeric string for strtod
      # We keep shell=True and provide the entire command (program + one argument)
      # as a single command string element in the list to preserve the original structure.
      command_with_arg = "./temp_executable 1.0"  # exactly one argument; ASCII; valid C-locale float

      try:
          result = subprocess.run(
              [command_with_arg],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Return SIGKILL (-9) on timeout to mirror original behavior
          return (e.stderr if hasattr(e, 'stderr') and e.stderr is not None else "", -signal.SIGKILL)
      except Exception as e:
          # Propagate unexpected execution issues
          raise e
