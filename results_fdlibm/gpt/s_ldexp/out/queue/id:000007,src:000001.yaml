  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Provide inputs satisfying the target constraints:
      # - argv[1] is a finite, non-zero double: "1.0"
      # - argv[2] is an integer exponent: "2000"
      # This makes scaled_value = 1.0 * 2^2000, which overflows to +inf,
      # causing the post-scale check (!finite(scaled_value) || scaled_value == 0.0) to be true.
      try:
          result = subprocess.run(
              ["./temp_executable 1.0 2000"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred; return the captured stderr and a timeout-indicative return code
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Raise any unexpected execution error
          raise e
