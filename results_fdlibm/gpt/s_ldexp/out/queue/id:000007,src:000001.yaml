target_path_constraint: |-
  Chronological constraints to reach ldexp() post-scale check true branch (triggering errno = ERANGE):

  1. Command-line argument count:
     - The program must be invoked with exactly two arguments after the executable name. In shell terms: three argv entries total (argv[0], argv[1], argv[2]). This satisfies the main() check `argc == 3` and avoids early exit.

  2. Argument parsing types:
     - argv[1] must be a textual representation of a finite, non-zero double-precision floating-point value (IEEE-754). Examples of representations include decimal or scientific notation; however, do not provide non-finite tokens like "nan", "+inf", or "-inf". This ensures the first ldexp() pre-check `(!finite(value) || value == 0.0)` is false, so scaling proceeds.
     - argv[2] must be a textual representation of a decimal integer (possibly with optional leading sign and leading/trailing whitespace allowed by atoi), which will be parsed as an int exponent `exp`.

  3. Scaling behavior requirement (core mathematical relation):
     - Let v be the finite, non-zero double parsed from argv[1]. Let e be the integer parsed from argv[2]. The function computes scaled_value = v * 2^e (semantics of scalbn for doubles).
     - Post-scale condition must evaluate true: `(!finite(scaled_value) || scaled_value == 0.0)`.
     - Therefore, require one of the following sub-constraints:
       a) Overflow to non-finite: scaled_value must become non-finite (+inf or -inf). Formally: |v| * 2^e > DBL_MAX (where DBL_MAX is the maximum finite IEEE-754 double). Any such pair (v, e) causes `finite(scaled_value)` to be false.
       b) Underflow to zero: scaled_value must become exactly 0.0 (signed zero permitted). Formally: |v| * 2^e < DBL_MIN_subnormal_threshold, i.e., the scaled value underflows to zero in the implementation used by scalbn, making `scaled_value == 0.0` true. This typically occurs when e is sufficiently negative given a small |v|.

  4. Environment and locale assumptions:
     - Standard C library behavior for atof/atoi and scalbn must be available. No special locale that alters decimal point should be used; use a dot '.' for decimal separator in argv[1].
     - No environment variables are required, but the process must have permission to run and print to stdout.

  5. Output expectation:
     - When the post-scale check is true, errno will be set to ERANGE within ldexp(), although the program does not print errno. The main path will still print the numeric result, which will be either "inf"/"-inf" formatted by printf for overflow or "0.000000" for underflow to zero.

  Summary of key constraints to solve:
  - argv[1] is finite and non-zero double text.
  - argv[2] is an integer text.
  - The pair (argv[1], argv[2]) must satisfy either overflow (|v| * 2^e > DBL_MAX) or full underflow to zero (|v| * 2^e == 0.0 in practice), ensuring the second ldexp() branch evaluates true.
