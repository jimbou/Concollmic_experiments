exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      # Use values that satisfy the path constraints:
      # V = 1.0 (finite, non-zero), E = -2000
      # S = scalbn(1.0, -2000) = 2^-2000 < DBL_MIN_SUBNORM -> underflows to 0.0
      cmd = "./temp_executable 1.0 -2000"

      # Ensure locale uses '.' as decimal separator for atof
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
