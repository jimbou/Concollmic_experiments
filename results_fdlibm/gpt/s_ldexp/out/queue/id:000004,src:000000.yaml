target_path_constraint: |-
  Inputs and environment requirements to reach the target branch (post-scaling check true in ldexp):

  1) Process invocation and arguments
  - The program is launched via a shell command that is fixed by the harness: ./temp_executable <arg1> <arg2>
  - Exactly two command-line arguments must be supplied (argc == 3 including program name). This is already ensured by the harness, so no additional constraint is required here.

  2) Argument parsing semantics
  - arg1 is parsed as a double-precision floating-point value using standard decimal notation rules (C atof). It must be a finite, non-NaN, non-infinite, non-zero numeric string so that:
    a) The pre-scaling check (!finite(value) || value == 0.0) evaluates to false.
  - arg2 is parsed as a base-10 integer (C atoi) representing the exponent.

  3) File system and locale
  - No files are read; locale must permit decimal point '.' to be parsed by atof (standard "C" locale assumption). If locale differs, ensure arg1 uses the correct decimal separator recognized by atof.

  4) Core mathematical relationship to trigger the target branch after scaling
  - Let V be the finite, non-zero double parsed from arg1, and E be the integer parsed from arg2.
  - The function computes S = scalbn(V, E) = V × 2^E.
  - The target branch triggers when either:
    (T1) S is not finite (i.e., S is +INF or -INF due to overflow), or
    (T2) S equals 0.0 (underflow to signed zero) while V is finite and non-zero.

  5) Constraints ensuring pre-check passes and post-check triggers
  - Pre-check pass:
    C1: V is finite and V ≠ 0.0.
  - Post-check trigger (choose either overflow or underflow path):
    Overflow path:
    C2a: S overflows to infinity in IEEE-754 double. Symbolically: |V| × 2^E > DBL_MAX, where DBL_MAX is the largest finite double.
    Underflow path:
    C2b: S underflows to zero in IEEE-754 double. Symbolically: |V| × 2^E < DBL_MIN_SUBNORM, where DBL_MIN_SUBNORM is the smallest positive subnormal double (effectively below the representable range so the result rounds to 0.0).
  - Either C2a or C2b must hold.

  6) Robustness against parsing edge cases
  - arg1 must not contain leading/trailing characters that atof would ignore in a way that yields 0.0; ensure it begins with an optional sign followed by digits and an optional decimal point/exponent part.
  - arg2 must represent an integer within the typical range supported by atoi; extremely large textual integers are permitted but beware undefined behavior is not an issue for atoi; however, for mathematical intent, E should be treated as an integer possibly large enough in magnitude to cause overflow/underflow as per C2a/C2b.

  Summary of necessary and sufficient conditions for inputs (arg1, arg2):
  - V = atof(arg1) is finite and non-zero. (C1)
  - E = atoi(arg2).
  - Either Overflow: |V| × 2^E > DBL_MAX (C2a), or Underflow: |V| × 2^E < DBL_MIN_SUBNORM (C2b).
  These conditions ensure the first check is false, scalbn applies scaling, and the second check is true, reaching the target branch.
