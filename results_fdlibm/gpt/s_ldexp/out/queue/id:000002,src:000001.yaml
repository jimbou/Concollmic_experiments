  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # We set argv[1] to a non-finite double ("nan") so the ldexp pre-check is true.
      # argv[2] can be any decimal integer; we use "1".
      # This preserves the original harness structure: <program> <arg1> <arg2>.
