exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Use a finite, non-zero floating-point value for argv[1] and a valid decimal integer for argv[2]
      # This preserves the original harness structure: <program> <arg1> <arg2>.
      # argv[1] = "3.14159" satisfies isfinite(atof(argv[1])) == true and atof(argv[1]) != 0.0
      # argv[2] = "42" is a valid decimal integer string for atoi
      try:
          result = subprocess.run(
              ["./temp_executable 3.14159 42"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
