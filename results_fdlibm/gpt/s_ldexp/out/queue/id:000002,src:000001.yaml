target_path_constraint: |-
  Goal: Execute the else-path in ldexp where the pre-check (!finite(value) || value == 0.0) evaluates to false, i.e., value is finite and non-zero.

  Constraints in chronological order:

  1) Process invocation via command line
  - The program must be launched with exactly two user-supplied arguments following the executable name, maintaining the pattern: <program> <arg1> <arg2>.
  - Ensure the process environment allows normal execution (no special environment variables or signals required). Shell usage is acceptable but not required.

  2) Argument count condition (to bypass argc != 3 handling)
  - Provide exactly two arguments so that argc equals 3 (program path + 2 arguments). This ensures execution proceeds past the argc check.

  3) Argument 1 (floating-point value for ldexp)
  - argv[1] must be a textual floating-point literal that the standard C library function atof parses to a finite, non-zero double.
  - Forbidden values and forms for argv[1]: strings that parse to NaN (e.g., "nan", case-insensitive), positive or negative infinity (e.g., "inf", "infinity", possibly with sign), zero in any form ("0", "0.0", "+0", "-0", scientific notation with zero value), empty string, or strings that atof parses to 0 due to no digits.
  - Required property: isfinite(atof(argv[1])) == true and atof(argv[1]) != 0.0.

  4) Argument 2 (integer exponent for ldexp)
  - argv[2] must be a decimal integer string that the standard C library function atoi parses to some integer. Any integer is acceptable for reaching the target branch; no specific range constraints are imposed by the pre-check.
  - Acceptable forms include optional leading whitespace, optional sign (+/-), and digits. Avoid non-numeric content that would cause atoi to parse 0 unintentionally only if such a value would later cause different behavior (it does not affect the pre-check). Therefore, any syntactically valid decimal integer string is sufficient.

  5) Locale/encoding assumptions
  - Arguments must be encoded in a standard ASCII/UTF-8 compatible encoding where decimal digits, optional sign, decimal point '.', and exponent marker 'e' (if used) are recognized by atof according to the C locale. Do not rely on locale-specific decimal separators like commas.

  Satisfaction of these constraints ensures that inside ldexp, the condition (!finite(value) || value == 0.0) evaluates to false, causing execution to proceed into the main computational path (the previously unexecuted block).
