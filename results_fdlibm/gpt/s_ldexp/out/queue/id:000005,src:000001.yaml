exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # We must violate the argc == 3 check. Invoke the executable with no user arguments,
      # so the shell parses only the program name, yielding argc == 1.
      try:
          result = subprocess.run(
              ["./temp_executable"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
