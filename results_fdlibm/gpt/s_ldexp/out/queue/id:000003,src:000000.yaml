target_path_constraint: |-
  Goal: Trigger the second post-scaling check in ldexp so that (!finite(value) || value == 0.0) evaluates to true after value = scalbn(original_value, exp).

  Program entry and invocation constraints (must all hold):
  1) Process invocation via shell is fixed by harness; do not change the executable name. Command must pass exactly two arguments to the program (since argc is fixed in the harness), both provided as strings in the command line: argv[1] and argv[2].

  Argument format constraints:
  2) argv[1] must be a valid decimal floating-point literal, parseable by C atof, representing the initial value v. It can include an optional sign, digits with optional decimal point, and optional exponent part (e.g., [-+]? (digits[.digits]? | .digits) ([eE][-+]?digits)?). No locale-specific characters; ASCII digits only.
  3) argv[2] must be a valid base-10 integer literal, parseable by C atoi, representing the scaling exponent e. It can include an optional sign followed by ASCII digits only; no whitespace beyond standard argv tokenization.

  Semantic relationship constraints to reach the branch (post-scaling failure):
  4) Let v be the double parsed from argv[1] via atof; let e be the int parsed from argv[2] via atoi.
  5) Precondition enforced by code path: The first check (!finite(v) || v == 0.0) must be false to pass it, i.e., v is finite AND v != 0.0.
  6) After scaling by a power of two, value = scalbn(v, e) must be either non-finite (Infinity) OR exactly zero to satisfy the second check. Formally: !isfinite(scalbn(v, e)) OR scalbn(v, e) == 0.0.

  Interpretation in IEEE-754 double semantics (typical on platforms using fdlibm):
  7) Overflow case: Choose v and e such that |v| * 2^e exceeds DBL_MAX, with v finite and nonzero. Symbolically: |v| > 0, isfinite(v), and |v| * 2^e > DBL_MAX. This will make scalbn(v, e) produce +Inf or −Inf, thus !finite(value) becomes true.
  8) Underflow-to-zero case: Choose v and e such that |v| * 2^e is strictly between 0 and the smallest subnormal threshold so that the rounded result is exactly 0. Symbolically: |v| > 0, isfinite(v), and |v| * 2^e == 0.0 in the target’s double arithmetic (i.e., the result underflows to signed zero). Practical sufficient condition: |v| * 2^e < DBL_MIN_SUBNORMAL / 2 (ensures flush to zero under round-to-nearest ties-to-even), but any precise underflow-to-zero condition that the platform observes is acceptable.

  Robustness and portability constraints:
  9) Avoid NaN input: argv[1] must not encode NaN; since atof does not parse “nan” unless explicitly provided, constrain to numeric literals that decode to a finite nonzero double (per 5).
  10) Platform assumes IEEE-754 doubles and fdlibm behavior for scalbn. If the environment differs, the logical requirements in 7 or 8 still apply in terms of the C library’s scalbn producing Infinity or 0.0 from finite nonzero input.

  Summary of constraints to satisfy the target branch:
  - argv[1] parses to a finite nonzero double v.
  - argv[2] parses to an integer e.
  - Either |v| * 2^e > DBL_MAX (overflow) OR scalbn(v, e) == 0.0 (underflow-to-zero).
