exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Chosen concrete inputs to satisfy the target path constraint:
      # argv[1] = "1.0" (finite, nonzero double)
      # argv[2] = "1024" (integer exponent)
      # Rationale: scalbn(1.0, 1024) = 2^1024, which exceeds DBL_MAX and thus overflows to Infinity,
      # making (!finite(value) || value == 0.0) evaluate to true.
      try:
          result = subprocess.run(
              ["./temp_executable 1.0 1024"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
