  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess
      import shlex

      # Concrete arguments to satisfy argc == 3 and parsing constraints:
      # argv[1]: valid floating-point literal; argv[2]: valid integer literal
      float_arg = "3.14159"
      int_arg = "2"
      exe_path = "./temp_executable"

      # Ensure the executable exists and is runnable
      if not os.path.exists(exe_path):
          raise FileNotFoundError(f"Executable not found at {exe_path}")
      if not os.access(exe_path, os.X_OK):
          raise PermissionError(f"Executable is not executable: {exe_path}")

      # Use shell=True with a properly quoted command string so exactly two argv entries reach main
      cmd = f"{shlex.quote(exe_path)} {shlex.quote(float_arg)} {shlex.quote(int_arg)}"

      try:
          result = subprocess.run(
              cmd,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
