  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      try:
          # Ensure POSIX/C locale so atof treats '.' as decimal point
          env = os.environ.copy()
          env["LC_ALL"] = "C"
          env["LANG"] = "C"
          env["LC_NUMERIC"] = "C"

          # Pass exactly one numeric argument that satisfies 1.0 <= |a0| < 22.0
          # Using 5.0 (finite, normal, ASCII, no exponent)
          cmd = "./temp_executable 5.0"
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
