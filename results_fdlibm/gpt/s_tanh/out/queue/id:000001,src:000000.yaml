  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Choose a numeric argument that satisfies: isFinite(x) and 1.0 <= |x| < 22.0
      # "2.0" is finite and within the required magnitude window.
      arg = "2.0"
      cmd = f"./temp_executable {arg}"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Ensure to raise the error if run failed (e.g., file access or subprocess setup)
          raise e
