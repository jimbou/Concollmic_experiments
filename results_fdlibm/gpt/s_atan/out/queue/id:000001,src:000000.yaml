  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Chosen concrete input:
      # a0 = 2.0 satisfies: finite, and 1.796875 <= |a0| < 2.375
      # This ensures the id=1 path is taken in the targeted atan implementation.
      cmd = "./temp_executable 2.0"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
