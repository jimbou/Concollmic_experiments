exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      # Use a single numeric argument that atof parses to X = 2^34 = 17179869184,
      # which satisfies ix >= 0x44100000 in s_atan.c (|X| >= 2^34)
      cmd = "./temp_executable 17179869184"

      # Ensure C locale for deterministic atof behavior (decimal point '.')
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env.setdefault("LANG", "C")

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Raise the error if run failed
          raise e
