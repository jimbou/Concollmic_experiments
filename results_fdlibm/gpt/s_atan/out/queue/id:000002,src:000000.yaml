     - For special values: use case-insensitive alphabetic tokens recognized by atof per the C library implementation (typical implementations accept "inf", "+inf", "-inf", "infinity", "nan").

  5. Environment assumptions:
     - No locale modifications that would change atof behavior (decimal point must be '.' not ',').
