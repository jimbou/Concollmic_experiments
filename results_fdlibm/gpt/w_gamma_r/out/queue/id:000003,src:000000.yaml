exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # We choose argv[1] = "0" so that:
      # - atof("0") -> x = 0.0 (finite)
      # - floor(x) == x and x <= 0.0 -> true
      # - gamma_r(0, &signgamp) is at a pole, so __ieee754_gamma_r returns non-finite (Inf/NaN),
      #   making !finite(y) true while finite(x) remains true.

      try:
          result = subprocess.run(
              ["./temp_executable 0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
