target_path_constraint: |-
  Chronological, external-input and environment-level constraints to reach: (1) the outer branch `if (!finite(y) && finite(x))` -> true, and (2) the inner branch `if (floor(x) == x && x <= 0.0)` -> true in w_gamma_r.c:gamma_r.

  1. Command invocation format and argument count:
     - The program must be launched such that the target executable receives exactly one command-line argument representing a floating-point value. The harness uses a shell invocation string, but the executable itself expects: argc == 2 and argv[1] is a parsable numeric string.

  2. Argument parsing requirements:
     - argv[1] must be a string that atof parses to a finite, exact integer-valued double that is less than or equal to 0.0.
     - Formally: let x = atof(argv[1]). Constraints:
       a) finite(x) == true (x is not NaN, not ±Inf).
       b) floor(x) == x (x is an integer value in double representation).
       c) x <= 0.0.
     - This ensures the inner branch condition `floor(x) == x && x <= 0.0` evaluates to true.

  3. Library configuration constraint for branch availability:
     - The build/runtime must not define the preprocessor macro _IEEE_LIBM. This is already implied by the executed path (lines inside #else were executed). No action required at runtime, but this constraint must hold for the compiled binary.

  4. Behavior of the gamma implementation to trigger the outer branch:
     - When calling gamma_r(x, &signgamp), the implementation sets y = __ieee754_gamma_r(x, signgamp). For integer x <= 0, the gamma function has a pole, and the IEEE754 gamma routine returns a non-finite value (typically ±Inf or NaN). To satisfy the outer branch, require:
       d) The math library’s __ieee754_gamma_r for the given x returns a non-finite y (NaN or ±Inf).
       e) x itself remains finite (reinforced by 2a).
     - At the input level, this is ensured by constraint 2 (x is a non-positive integer), which places x at a pole of Γ.

  5. Side-effect expectations (for completeness, not additional constraints):
     - Passing the outer branch leads to the inner classification and then to calling __kernel_standard(x, x, 41) for non-positive integers, per the code. No further external inputs are needed.

  Summary of required external constraints:
  - Provide a single command-line argument string such that atof(argv[1]) yields a finite, integer-valued double ≤ 0.0.
  - Ensure the compiled binary is built without defining _IEEE_LIBM, so the non-IEEE error-handling branch is present.
  - Rely on standard libm behavior where Γ(x) for integer x ≤ 0 is non-finite, making `!finite(y)` true.
