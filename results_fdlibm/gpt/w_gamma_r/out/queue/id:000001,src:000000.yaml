  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess
      import tempfile
      import textwrap
      import shutil

      # Build and LD_PRELOAD a tiny shared object that sets _LIB_VERSION to a non-IEEE value
      # at process start (constructor). This satisfies the path constraint: _LIB_VERSION != _IEEE_.

      c_source = textwrap.dedent(
          r"""
          #include <dlfcn.h>
          #include <stddef.h> // for NULL

          __attribute__((constructor))
          static void init(void) {
              void *self = dlopen(NULL, RTLD_LAZY);
              if (!self) return;
              void *sym = dlsym(self, "_LIB_VERSION");
              if (!sym) return;
              // fdlibm-style values: _IEEE_=0, _XOPEN_=1, _POSIX_=2, _SVID_=3 (typical)
              // We set to a non-IEEE mode to ensure the condition (_LIB_VERSION == _IEEE_) is false.
              int *p = (int*)sym;
              *p = 3; // _SVID_
          }
          """
      )

      temp_dir = tempfile.mkdtemp(prefix="setlibversion_")
      try:
          c_path = os.path.join(temp_dir, "setlibversion.c")
          so_path = os.path.join(temp_dir, "libsetlibversion.so")
          with open(c_path, "w", encoding="utf-8") as f:
              f.write(c_source)

          # Try compiling with cc, fallback to gcc
          compile_cmds = [
              ["bash", "-lc", f"cc -shared -fPIC -ldl -o '{so_path}' '{c_path}'"],
              ["bash", "-lc", f"gcc -shared -fPIC -ldl -o '{so_path}' '{c_path}'"],
          ]
          compiled = False
          last_compile_err = None
          for cmd in compile_cmds:
              try:
                  res = subprocess.run(cmd, capture_output=True, encoding="utf-8", errors="replace")
                  if res.returncode == 0 and os.path.exists(so_path):
                      compiled = True
                      break
                  else:
                      last_compile_err = (res.stdout or "") + (res.stderr or "")
              except Exception as e:
                  last_compile_err = str(e)
          if not compiled:
              raise RuntimeError(f"Failed to build preload library to set _LIB_VERSION. Details: {last_compile_err}")

          # Prepare environment with LD_PRELOAD to enforce non-IEEE mode
          env = os.environ.copy()
          env["LD_PRELOAD"] = so_path

          try:
              result = subprocess.run(
                  ["./temp_executable 1.0"],
                  capture_output=True,
                  encoding="utf-8",
                  errors="replace",
                  shell=True,
                  timeout=timeout,
                  env=env,
              )
              return result.stderr, result.returncode
          except subprocess.TimeoutExpired as e:
              return e.stderr, -signal.SIGKILL
      finally:
          # Best-effort cleanup
          try:
              shutil.rmtree(temp_dir)
          except Exception:
              pass
