exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # To satisfy the target constraint (argc != 2), we invoke the program with no user-supplied
      # arguments so that argc == 1 (argv = ["./temp_executable"]). This causes the program to
      # take the usage/early-exit path.
      command = "./temp_executable"

      try:
          result = subprocess.run(
              [command],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
