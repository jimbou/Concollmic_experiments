  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import stat
      import signal
      import subprocess
      import shlex

      # We must provide exactly one additional CLI argument so that C's argc == 2.
      # Choose S such that a0 = atof(S) is finite, not NaN, and |a0| > 1.0.
      # Concrete choice: S = "2.5" => a0 = 2.5, finite, not NaN, |a0| > 1.0.
      exe_path = "./temp_executable"
      arg = "2.5"

      # Ensure the executable exists and is executable (environmental constraint)
      if not os.path.exists(exe_path):
          raise FileNotFoundError(f"Executable not found: {exe_path}")
      try:
          if not os.access(exe_path, os.X_OK):
              current_mode = os.stat(exe_path).st_mode
              os.chmod(exe_path, current_mode | stat.S_IXUSR)
      except Exception:
          # If chmod fails, we'll still try to run; subprocess will raise if not executable
          pass

      # Build the command line with exactly one argument; keep shell=True as in the original structure
      cmdline = f"{shlex.quote(exe_path)} {shlex.quote(arg)}"

      try:
          result = subprocess.run(
              cmdline,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
