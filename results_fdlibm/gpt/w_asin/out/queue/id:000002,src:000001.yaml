  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import stat
      import signal
      import subprocess

      # We force argc != 2 by providing NO additional CLI arguments.
      # Command string: program path only -> argv = [program], so C's argc == 1.
      cmd = "./temp_executable"

      # Ensure the executable exists and is executable (environmental constraint)
      if not os.path.exists(cmd):
          raise FileNotFoundError(f"Executable not found: {cmd}")
      try:
          if not os.access(cmd, os.X_OK):
              # Attempt to add user execute permission if possible
              current_mode = os.stat(cmd).st_mode
              os.chmod(cmd, current_mode | stat.S_IXUSR)
      except Exception:
          # If chmod fails, we'll still try to run; subprocess will raise if not executable
          pass

      try:
          result = subprocess.run(
              [cmd],  # single token; shell will run program with no arguments
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
