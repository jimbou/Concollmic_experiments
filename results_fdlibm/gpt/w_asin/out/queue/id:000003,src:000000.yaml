  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess
      import tempfile
      import textwrap
      import shutil

      # We need to ensure a non-IEEE error-handling mode in fdlibm at runtime.
      # Achieve this by LD_PRELOAD-ing a tiny shared library that defines _LIB_VERSION = _POSIX_.
      # Also set the locale to C to enforce '.' as decimal separator for atof.

      tmpdir = tempfile.mkdtemp(prefix="fdlibm_mode_")
      c_path = os.path.join(tmpdir, "libfdlibm_mode.c")
      so_path = os.path.join(tmpdir, "libfdlibm_mode.so")

      c_source = textwrap.dedent(
          r"""
          // Minimal interposer to set fdlibm's global error-handling mode to non-IEEE
          // Matches fdlibm's common declaration of _LIB_VERSION and enum constants.
          // This ensures wrappers like w_asin use the non-IEEE path (e.g., POSIX/SVID).
          typedef enum {
              _IEEE_ = 0,
              _SVID_ = 1,
              _XOPEN_ = 2,
              _POSIX_ = 3
          } _LIB_VERSION_TYPE;
          __attribute__((visibility("default")))
          _LIB_VERSION_TYPE _LIB_VERSION = _POSIX_;
          // Provide a symbol that some variants check for, harmless if unused.
          __attribute__((visibility("default")))
          const char *__fdlibm_version_note = "force POSIX mode via LD_PRELOAD";
          """
      )

      try:
          with open(c_path, "w", encoding="utf-8") as f:
              f.write(c_source)

          # Try compiling the interposer. Attempt common compilers in order.
          compile_cmds = [
              ["cc", "-shared", "-fPIC", "-O2", "-Wall", c_path, "-o", so_path],
              ["gcc", "-shared", "-fPIC", "-O2", "-Wall", c_path, "-o", so_path],
              ["clang", "-shared", "-fPIC", "-O2", "-Wall", c_path, "-o", so_path],
          ]
          compiled = False
          last_err = None
          for cmd in compile_cmds:
              try:
                  res = subprocess.run(cmd, capture_output=True, encoding="utf-8", errors="replace")
                  if res.returncode == 0 and os.path.exists(so_path):
                      compiled = True
                      break
                  last_err = (res.stderr or "")
              except Exception as e:
                  last_err = str(e)
          if not compiled:
              raise RuntimeError(f"Failed to build fdlibm mode interposer: {last_err}")

          # Prepare environment: enforce C locale and preload our interposer.
          env = os.environ.copy()
          env["LC_ALL"] = "C"
          env["LANG"] = "C"
          # Linux/ELF
          env["LD_PRELOAD"] = so_path
          # macOS (DYLD)
          env["DYLD_INSERT_LIBRARIES"] = so_path
          env["DYLD_FORCE_FLAT_NAMESPACE"] = "1"

          # Execute the original harness structure but with the new concrete argument (|x| > 1.0)
          # Single user argument passed as-is; shell runs the exact command string.
          try:
              result = subprocess.run(
                  ["./temp_executable 2.0"],
                  capture_output=True,
                  encoding="utf-8",
                  errors="replace",
                  shell=True,
                  timeout=timeout,
                  env=env,
              )
              return result.stderr, result.returncode
          except subprocess.TimeoutExpired as e:
              return e.stderr, -signal.SIGKILL
      finally:
          # Clean up the temporary build directory
          try:
              shutil.rmtree(tmpdir)
          except Exception:
              pass
