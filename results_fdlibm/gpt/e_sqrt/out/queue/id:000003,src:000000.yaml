  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Provide a finite, strictly negative double value (not -0.0), parsed by atof
      # This will trigger the `else if (ix0 < 0)` path in the IEEE-754 sqrt routine
      # The command-line invocation maintains exactly one argument to the program
      cmd = ["./temp_executable -1"]

      try:
          result = subprocess.run(
              cmd,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
