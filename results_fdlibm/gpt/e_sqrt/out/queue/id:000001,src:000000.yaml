exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # We provide a single command-line argument that parses via atof to +Infinity.
      # Using a numeric overflow form ensures cross-libc compatibility: "1e309" -> +Inf for IEEE-754 double.
      cmd = ["./temp_executable 1e309"]

      try:
          result = subprocess.run(
              cmd,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
