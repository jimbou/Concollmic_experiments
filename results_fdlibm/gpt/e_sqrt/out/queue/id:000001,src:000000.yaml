  - The program must be executed with exactly one command-line argument (excluding the program name), since the harness runs `./temp_executable 1.0` and the program expects `argc == 2`.

  2. Argument format and parsing:
  - The sole argument is parsed using the C standard `atof` function to a double-precision floating-point value. `atof` recognizes decimal numbers and certain textual representations of special IEEE-754 values depending on the C library. To ensure the branch that checks for IEEE-754 non-finite inputs is taken, the parsed double value must be either NaN or Infinity.

  3. Required numeric property of the parsed value:
  - Let `x` be the double produced by `atof(argv[1])`. The constraint is that `x` is non-finite, i.e., either:
    a) x is positive infinity; or
    b) x is negative infinity; or
    c) x is a NaN (Not-a-Number).
  - In terms of IEEE-754 binary64 bit pattern: the exponent field must be all ones (0x7ff), i.e., `(high_word(x) & 0x7ff00000) == 0x7ff00000`, where `high_word(x)` denotes the high 32 bits of the 64-bit double in memory.

  4. Compatibility with `atof` string forms:
  - Provide the command-line string such that `atof` on the target platform parses it into one of the above non-finite values. Common accepted forms are implementation-dependent but typically include strings that map to infinities (e.g., case-insensitive “inf”, “infinity”) or NaNs (e.g., “nan”, possibly with payload). This requirement is that the final parsed double must satisfy the non-finite property described in (3); the exact textual choice must be one that the platform’s `atof` recognizes.

  5. No additional environmental constraints:
  - No files or environment variables are used. Standard output and error streams may be produced, but they do not affect path feasibility.

  Chronological summary:
  - Start program with one argument.
  - Ensure the argument string, when parsed by `atof`, yields a double with exponent bits all ones (NaN or ±Infinity).
  - This guarantees the condition `(ix0 & 0x7ff00000) == 0x7ff00000` is true in `__ieee754_sqrt`, leading execution into the special-value handling branch.
