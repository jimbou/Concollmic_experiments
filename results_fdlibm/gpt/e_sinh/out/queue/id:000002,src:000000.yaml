  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Concrete input satisfying all constraints:
      # - Single argument, ASCII, no whitespace: "-1.0"
      # - atof parses it as a finite negative double
      # - Not NaN/Inf; within finite range
      # - Locale forced to recognize '.' as decimal separator via LC_ALL=C
      cmd = "./temp_executable -1.0"

      # Prepare environment ensuring C/POSIX locale so '.' is the decimal separator
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      # LANG typically overridden by LC_ALL but set it as well for completeness
      env.setdefault("LANG", "C")

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
