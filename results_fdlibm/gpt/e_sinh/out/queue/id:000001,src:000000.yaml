  - The string must not contain extra surrounding tokens that would make it split into multiple shell words by the harness (e.g., no spaces unless escaped/quoted as a single argument).

  3) File-system/environment
  - No files are required. Standard library must be available to parse the argument. No special environment variables are needed.

  4) Mathematical/representation constraint linking to the branch condition
  - Let x be the IEEE-754 double parsed from the argument by atof. The branch tests the high 32-bit word of x to determine finiteness: ix = high_word(x) & 0x7fffffff. The condition ix >= 0x7ff00000 holds exactly when x is NaN or ±Infinity. Therefore the input must satisfy: x is not a finite double (x ∈ {−∞, +∞} ∪ {NaN}).

