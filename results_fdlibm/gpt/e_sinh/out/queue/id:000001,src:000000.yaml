  Chronological input and environment constraints to reach: if (ix >= 0x7ff00000) -> true in __ieee754_sinh

  1) Program invocation
  - The executable must be launched with exactly one command-line argument besides the program name (argc == 2). The test harness already does this by invoking the program with a single token argument.

  2) Argument parsing format
  - The sole command-line argument must be a string that the standard C library function atof parses as a non-finite IEEE-754 double value: either +Infinity, -Infinity, or NaN (Not-a-Number). Typical accepted spellings by atof (implementation-dependent but common to many libc implementations) include:
