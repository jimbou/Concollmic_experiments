  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # We keep the same harness structure but change the sole argument to a non-finite value
      # so that atof(argv[1]) yields +Infinity, making ix >= 0x7ff00000 true.
      cmd = "./temp_executable inf"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
