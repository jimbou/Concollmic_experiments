  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Concrete input selection:
      # Use the exact token "1.0" so that atof(argv[1]) == +1.0 exactly in IEEE-754 double.
      # This ensures |x| == 1.0 and ix == 0x3ff00000 after masking off the sign bit.
      exe_path = "./temp_executable"
      cmd = f"{exe_path} 1.0"

      # Basic validation that the executable exists and is runnable
      if not os.path.exists(exe_path):
          raise FileNotFoundError(f"Executable not found: {exe_path}")
      if not os.access(exe_path, os.X_OK):
          raise PermissionError(f"Executable is not marked executable: {exe_path}")

      # Ensure locale uses '.' as decimal separator so atof parses "1.0" canonically
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"
      env.pop("LC_NUMERIC", None)

      try:
          # Follow the same basic structure as the original harness: shell=True with a single command string
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Propagate unexpected execution issues
          raise e
