exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Use x = 0.00000001 (1e-8), which satisfies all constraints:
      # - Finite IEEE-754 double
      # - 2^-28 (~3.725e-9) <= |x| = 1e-8 < 1, and x != ±1
      # - Standard decimal format parsable by atof
      # - Exactly one command-line argument beyond the program name
      try:
          cmd = "./temp_executable 0.00000001"
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
