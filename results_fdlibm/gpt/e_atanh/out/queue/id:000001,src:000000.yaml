  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Choose x = 0.00000001 (1e-8):
      # - finite double
      # - within (-1, 1) and not equal to +/-1
      # - |x| = 1e-8 >= 2^-28 (~3.725e-9), so it avoids the "very small x" fast-return branch
      # - Parsed by atof in standard C format
      try:
          cmd = "./temp_executable 0.00000001"
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
