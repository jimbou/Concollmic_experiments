target_path_constraint: |-
  Inputs and environment constraints to drive main → isnan(x) with x being NaN (thus taking the “x is NaN” → true branch):

  1) Process invocation via the fixed harness
  - The program is executed as a shell command with one string argument appended: ./temp_executable 1.0
  - We must preserve: exactly one non-empty command-line argument (excluding argv[0]) is passed to main, so that main observes argc == 2.

  2) File system and environment
  - No file I/O is required. The process must have standard C library available; environment variables are irrelevant.

  3) Argument parsing behavior
  - main converts argv[1] to a double using the C standard library function atof, which performs conversion in the current C locale using strtod-like rules.
  - Therefore, argv[1] must be a byte string that atof interprets as a quiet or signaling NaN. Per C library conventions, strings such as those matching the grammar for NaN literals are converted to a NaN double.
  - Formal requirement: Let s = argv[1] (as a sequence of bytes in the active locale). When passed to atof(s), the returned double value a0 satisfies IEEE-754 isNaN predicate: a0 is a NaN (its exponent bits are all 1s and the fraction is non-zero). No other constraints on sign or payload.

  4) Robustness to leading/trailing whitespace
  - atof skips leading whitespace and stops at the first non-number character after a valid NaN token. To avoid relying on undefined vendor extensions, ensure s contains a valid NaN token optionally surrounded by ASCII whitespace only.

  5) Summary as SMT-style predicate on the sole external input argv[1]
  - Domain: argv[1] ∈ ByteString
  - Predicate: is_nan(atof(argv[1])) == true

  Any argv[1] satisfying the above will cause: argc == 2 holds; atof(argv[1]) returns a NaN double; isnan(a0) returns non-zero; thus the selected branch “x is NaN” → true is taken.
