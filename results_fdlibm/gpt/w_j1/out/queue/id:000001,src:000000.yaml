exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Choose a finite double much larger than typical fdlibm X_TLOSS (~1.41e16)
      # to satisfy fabs(x) > X_TLOSS while staying finite and non-NaN.
      arg_value = "1e20"

      # Preserve original structure (shell=True and single command string element)
      cmd = f"./temp_executable {arg_value}"

      # Ensure C locale to match atof expectations
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
