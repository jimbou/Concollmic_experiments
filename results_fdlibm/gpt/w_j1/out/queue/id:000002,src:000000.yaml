  Constraints in chronological order:

  1) Process invocation and argument count
  - The target program must be invoked with exactly one argument in addition to the program name so that `argc == 2` in main. Avoid shell expansions or additional tokens that would introduce extra arguments.
  - The single argument must be directly provided to the executable (no pipes, redirections, or globbing that could alter argv).

  2) Argument format and parsing into a double
  - The only argument must be a valid textual representation of a finite IEEE-754 double-precision number according to the C standard library parsing rules (as consumed by `atof`).
    Accepted forms include: optional leading/trailing ASCII whitespace, optional leading sign (+ or -), sequence of decimal digits optionally containing a single decimal point, and an optional exponent part of the form `e` or `E` followed by an optional sign and digits.
  - The argument must NOT be any NaN form (e.g., "nan", "NaN", "nan(...)") and must NOT represent positive or negative infinity (e.g., "inf", "+inf", "-inf", case-insensitive). This ensures the parsed value x is finite and not NaN.
  - Encoding for the argument string must be UTF-8 (ASCII subset is fine) with no non-printable or non-numeric characters beyond those allowed above.

  3) Library configuration gate (bypass early return)
  - The math library runtime configuration must NOT be in IEEE-only mode: `_LIB_VERSION != _IEEE_` at runtime. This avoids the early return path in j1 and allows evaluation of the loss-of-significance check.
  - Build-time configuration must compile j1 without defining `_IEEE_LIBM` (i.e., the non-IEEE path is compiled in). The current binary already satisfies this, but this remains a required environmental condition.
  - The input must be such that `isnan(x) == false` (already ensured by step 2), which is part of the same early-return condition.

  4) Target branch condition forced to false
  - Let x be the double parsed from argv[1]. The magnitude of x must NOT exceed the fdlibm loss threshold constant `X_TLOSS` for j1. Formally: `|x| <= X_TLOSS`.
    This ensures the condition `fabs(x) > X_TLOSS` evaluates to false and execution enters the else-branch.

  5) Program flow completion
  - No additional environmental constraints (files, FDs, locale) are required, but locales that change decimal separators must be avoided; the C locale (or any locale where the decimal point is ‘.’) should be in effect so that atof interprets the argument correctly. Ensure LC_ALL/LC_NUMERIC do not alter the decimal separator from ‘.’.

