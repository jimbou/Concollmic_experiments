exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      # Ensure C locale so atof parses decimal point '.' correctly
      os.environ["LC_ALL"] = "C"
      os.environ["LC_NUMERIC"] = "C"
      os.environ["LANG"] = "C"

      try:
          # Invoke the original test harness structure with exactly one numeric argument
          # Choose a small finite double within the loss threshold to force fabs(x) > X_TLOSS to be false
          result = subprocess.run(
              ["./temp_executable 0.5"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
