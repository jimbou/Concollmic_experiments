  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess
      import tempfile
      import textwrap
      import shutil

      # We satisfy the constraints as follows:
      # 1) Pass exactly one user argument: a valid finite double in decimal form (use "0.5").
      # 2) Ensure non-IEEE libm runtime mode by interposing the _LIB_VERSION symbol via LD_PRELOAD.
      #    We build a tiny shared library that defines _LIB_VERSION as a non-IEEE value (2 == _POSIX_).
      # 3) |x| <= X_TLOSS: choosing a small value like 0.5 trivially satisfies this since X_TLOSS is large.

      # Prepare a temporary directory for the preload library
      tmpdir = tempfile.mkdtemp(prefix="libm_preload_")
      src_path = os.path.join(tmpdir, "libm_preload.c")
      so_path = os.path.join(tmpdir, "libm_preload.so")

      # C source: define _LIB_VERSION as non-IEEE (_POSIX_ == 2). This symbol is used by libm wrappers.
      # Using a direct definition ensures symbol interposition via LD_PRELOAD so j0 sees non-IEEE mode.
      c_source = textwrap.dedent(
          r"""
          // Interpose libm's runtime mode to NON-IEEE by defining _LIB_VERSION as _POSIX_ (2).
          // Many libm wrappers check `_LIB_VERSION != _IEEE_` to enable error-handling paths
          // and avoid early IEEE returns.
          // We set it to 2, matching fdlibm/glibc's enum ordering:
          // enum _LIB_VERSION_TYPE { _IEEE_ = -1, _SVID_, _XOPEN_, _POSIX_ };
          // To avoid header dependencies, we directly use the integer value 2.
          int _LIB_VERSION = 2; // _POSIX_
          """
      )

      # Write the source file
      with open(src_path, "w", encoding="utf-8") as f:
          f.write(c_source)

      # Compile the shared object
      # Requires a C compiler (gcc/clang). We try gcc first; if unavailable, try clang.
      compiler = shutil.which("gcc") or shutil.which("clang")
      if compiler is None:
          raise RuntimeError("No C compiler (gcc/clang) found to build LD_PRELOAD library")

      compile_cmd = [
          compiler,
          "-shared",
          "-fPIC",
          "-O2",
          "-o",
          so_path,
          src_path,
      ]

      try:
          comp = subprocess.run(compile_cmd, capture_output=True, encoding="utf-8", errors="replace")
          if comp.returncode != 0:
              raise RuntimeError(
                  f"Failed to compile preload library: rc={comp.returncode}\nSTDOUT:\n{comp.stdout}\nSTDERR:\n{comp.stderr}"
              )

          # Set environment to preload our library
          env = os.environ.copy()
          env["LD_PRELOAD"] = so_path

          # Choose a valid finite decimal double that satisfies |x| <= X_TLOSS: use 0.5
          cmd = "./temp_executable 0.5"

          # Execute the original harness structure (shell=True, single token argument)
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception:
          # Re-raise any other exceptions (e.g., build or execution failures)
          raise
      finally:
          # Best-effort cleanup of temporary files
          try:
              if os.path.exists(src_path):
                  os.remove(src_path)
              if os.path.exists(so_path):
                  os.remove(so_path)
              if os.path.isdir(tmpdir):
                  os.rmdir(tmpdir)
          except Exception:
              # Suppress cleanup errors
              pass
