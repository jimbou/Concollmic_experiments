exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      try:
          # Provide exactly one whitespace-separated argument token after the executable path.
          # Choose a finite, non-NaN double whose absolute value greatly exceeds any plausible X_TLOSS.
          # "1e300" satisfies atof parsing and |x| > X_TLOSS.
          cmd = "./temp_executable 1e300"

          # Ensure environment does not suggest IEEE-only mode. While these are typically compile-time
          # settings in fdlibm, we defensively remove any potentially relevant env vars if present.
          env = os.environ.copy()
          for var in [
              "_IEEE_LIBM",
              "IEEE_LIBM",
              "LIBM_MODE",
              "LIBM_LIB_VERSION",
              "FDLIBM_MODE",
              "FDLIBM_LIB_VERSION",
          ]:
              env.pop(var, None)

          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
