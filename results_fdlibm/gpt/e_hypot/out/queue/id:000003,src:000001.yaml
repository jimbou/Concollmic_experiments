  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Concrete inputs chosen to satisfy the target constraints:
      # - Exactly two numeric args: "1" and "1"
      # - Both parseable as finite doubles under C locale, and both nonzero
      # - Magnitude window: A = B = 1 -> A <= 2^500 and B >= 2^-500
      # - Ratio: A/B = 1 <= 2^60, so no early fast-path return
      # - No scaling occurs, so k remains 0 and the final check (k != 0) is false
      cmd = "./temp_executable 1 1"

      # Ensure C/EN locale so atof parses '.' as decimal separator
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"
      env["LC_NUMERIC"] = "C"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
