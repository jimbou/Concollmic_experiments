exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Concrete inputs chosen to satisfy the target constraint:
      # - Both parseable as finite doubles in C locale
      # - |x| = 1, |y| = 1e-100 -> exponent difference ~ 100
      # - In terms of high words: (100 << 20) = 0x06400000 > 0x03C00000
      #   Thus, H(max)-H(min) > 0x3c00000 holds and triggers the fast-path branch.
      cmd = "./temp_executable 1 1e-100"

      # Ensure C/EN locale so atof parses '.' as decimal separator
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"
      env["LC_NUMERIC"] = "C"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
