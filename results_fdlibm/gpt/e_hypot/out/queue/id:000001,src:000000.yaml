target_path_constraint: |
  Inputs and environment must be configured so the program runs normally and reaches the target fast-path branch in __ieee754_hypot where (ha - hb) > 0x3c00000 holds.

  Chronological constraints:

  1) Process invocation (command-line):
  - The executable must be launched with exactly two command-line arguments (excluding argv[0]). The provided harness already runs: ./temp_executable 1.0 1.0
  - Modify the two command-line arguments to be valid string representations of finite IEEE-754 double-precision numbers. No surrounding quotes needed; standard decimal or scientific notation accepted. Locale must be C/EN so atof parses '.' as decimal separator.

  2) Argument parsing success:
  - Both strings must be parseable by atof into finite double values (no NaN or Infinity textual encodings that would yield non-finite values). This ensures main(argc==3) path and avoids usage/early exit.

  3) Magnitude ordering before branch (swap consideration):
  - Inside __ieee754_hypot(x, y), the code may swap (x, y) if |y| > |x| based on their high 32-bit words (ha/hb). To make the subsequent condition (ha - hb) > 0x3c00000 evaluated on the larger magnitude as ha and the smaller as hb, ensure |x| >= |y| so no swap occurs. Alternatively, if |y| > |x|, the code swaps them, which still results in ha being the larger magnitude. Therefore the core requirement reduces to: the larger-magnitude input’s high 32-bit word minus the smaller-magnitude input’s high 32-bit word exceeds 0x3c00000.

  4) Key branch condition expressed on input doubles:
  - Let ulp_hi(z) denote the unsigned 32-bit high word of the IEEE-754 binary64 representation of |z| (absolute value; sign bit masked off). The branch is taken when:
    ulp_hi(max(|x|, |y|)) - ulp_hi(min(|x|, |y|)) > 0x3c00000.
  - This constant corresponds to a gap of more than 0x3c00000 in the exponent/mantissa high-word domain, i.e., a very large difference in exponents. Practically, this requires the larger absolute value input to be many orders of magnitude greater than the smaller one.

  5) Additional gating conditions to reach line 31:
  - The previous swap branch (hb > ha) must not be taken in a way that prevents setting a and b correctly. This is already safe because the code handles swap and then sets __HI(a)=ha and __HI(b)=hb; the condition in 4 applies after this normalization.
  - The earlier “ha > 0x5f300000” (very large numbers) block must not trigger before reaching our target unless it would be reached after the (ha-hb) check. In the code, the (ha-hb) check occurs at line 30-31 before the ha>0x5f300000 check, so no constraint here is needed beyond 4.
  - Avoid the denormal-scaling path interfering before line 31: The denormal handling path is after the (ha-hb) check, so it does not block reaching our target.

  6) Exclude non-finite encodings:
  - Ensure both inputs are not NaN or Infinity. While the code has later handling for infinities/NaNs in the ha>0x5f300000 block, our branch occurs earlier and returns a+b, which must be finite to observe a meaningful output. Therefore, both inputs must be finite and within normal/denormal ranges that still satisfy the high-word gap above.

  7) Summarized constraints suitable for test generation:
  - Two ASCII strings for argv[1] and argv[2], each parseable as finite IEEE-754 double via atof in C locale.
  - Let X=|atof(argv[1])| and Y=|atof(argv[2])|, both finite.
  - Define H(u) := high 32-bit word of IEEE-754 binary64 representation of u with sign bit cleared.
  - Require H(max(X, Y)) - H(min(X, Y)) > 0x3c00000.
  - No further constraints on signs; signs are ignored by the branch due to masking.

  Any pair of inputs satisfying the above will drive execution into the target branch and execute the early return path at e_hypot.c:31 returning approximately the larger magnitude value (since a+b with huge scale separation ≈ a).
