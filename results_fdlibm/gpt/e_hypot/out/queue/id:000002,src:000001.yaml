      # Concrete inputs chosen to satisfy the target constraint:
      # - Both parseable as finite doubles in C locale
      # - |x| = 1, |y| = 1e-100 -> exponent difference ~ 100
      # - In terms of high words: (100 << 20) = 0x06400000 > 0x03C00000
      #   Thus, H(max)-H(min) > 0x3c00000 holds and triggers the fast-path branch.
      cmd = "./temp_executable 1 1e-100"

      # Ensure C/EN locale so atof parses '.' as decimal separator
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"
      env["LC_NUMERIC"] = "C"

      try:
