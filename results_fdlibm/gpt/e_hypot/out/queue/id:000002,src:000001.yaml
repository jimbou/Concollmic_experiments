target_path_constraint: |
  Goal: Trigger the large-number rescaling branch inside __ieee754_hypot by making the high 32-bit word of the larger-magnitude input exceed 0x5f300000, while also preventing the earlier fast-path early return (which occurs if (ha - hb) > 0x3c00000).

  Chronological, externally observable constraints:

  1) Program invocation constraints
  - The executable is invoked as a single command string with two whitespace-separated arguments that represent finite decimal floating-point numbers in the C locale.
  - Environment must ensure decimal point '.' parsing: set LC_ALL="C" (or LANG/LC_NUMERIC to "C").
  - argc must be exactly 3, i.e., provide exactly two arguments besides program name.

  2) Argument parsing constraints
  - argv[1] and argv[2] must be valid textual representations of finite double-precision numbers (no NaN, no Inf). They must parse via atof using the C locale without errors.

  3) Magnitude ordering constraint (affects ha/hb swap):
  - Let a0 = value parsed from argv[1], a1 = value parsed from argv[2]. Inside __ieee754_hypot, ha = high-word of |a0|, hb = high-word of |a1|, then if hb > ha, variables are swapped so that a (the larger magnitude) has high word ha = max(ha,hb).
  - To hit the target branch, the high word of the larger-magnitude absolute value must satisfy ha > 0x5f300000.

  4) Prevent early-return constraint ((ha - hb) <= 0x3c00000):
  - Ensure that the difference between the high words of the larger and smaller magnitudes does NOT exceed 0x3c00000. This keeps execution from returning early via the (ha-hb)>0x3c00000 fast path.
  - Formally: Let Hmax be the high 32-bit word of the IEEE-754 double for the larger |value|, and Hmin for the smaller |value|. Require 0 <= (Hmax - Hmin) <= 0x3c00000.

  5) Large-number threshold constraint (target branch):
  - Require Hmax > 0x5f300000. This corresponds approximately to |value| > 2^(?); in practice, it means the magnitude is extremely large (near overflow range), but still finite and normal.

  6) Finiteness and normality constraints (avoid subnormals/NaN/Inf behavior paths):
  - Both inputs must be finite, non-NaN, and preferably normal (exponent field between 1 and 2046). This avoids alternate branches for denormals or infinities and keeps focus on the large-number scaling path.

  7) Relationship constraints to respect step 4 and 5 simultaneously:
  - Choose both arguments so that their magnitudes are comparable (so Hmax - Hmin is not too large), yet the larger one’s high word exceeds 0x5f300000. For example constraints: the smaller argument should be large enough that its high word Hmin is within 0x3c00000 of Hmax, i.e., Hmin >= Hmax - 0x3c00000, while still strictly less than Hmax so that the swap establishes the larger as ‘a’.

  Representation notes for H(x):
  - H(x) denotes the 32-bit high word of the IEEE-754 binary64 representation of |x| when stored in a 64-bit little-endian system as used by fdlibm (__HI reads the high 32 bits containing sign+exponent+top of mantissa). The constraints above operate on these high-word values of the absolute magnitudes.

  Summary of required properties on argv[1], argv[2]:
  - Both parse to finite doubles under C locale.
  - Let Hmax be the high word of the larger |double| and Hmin for the smaller. Require: Hmax > 0x5f300000 and 0 <= (Hmax - Hmin) <= 0x3c00000.
  - Avoid NaN/Inf/subnormal to keep to normal-path scaling.
