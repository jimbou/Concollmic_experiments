exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Concrete inputs to satisfy the target constraints:
      # - Both are finite, normal doubles under C locale
      # - Larger magnitude high word (Hmax) > 0x5f300000 (e.g., 9e300 -> ~0x7e6ae0c4)
      # - Difference in high words (Hmax - Hmin) <= 0x3c00000 (9e300 vs 8e300 -> ~0x2fc88)
      # - Prevent fast-path early return and trigger large-number rescaling path
      cmd = "./temp_executable 9e300 8e300"

      # Ensure C locale so atof parses '.' as decimal separator and uses C numeric rules
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"
      env["LC_NUMERIC"] = "C"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
