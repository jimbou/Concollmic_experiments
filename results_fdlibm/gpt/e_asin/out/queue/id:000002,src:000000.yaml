  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Concrete input satisfying constraints:
      # - Single numeric argument (argc == 2)
      # - Parseable double by atof
      # - |x| > 1.0 and x != \u00b11.0
      # - Finite value
      # Choose x = 2.0
      try:
          result = subprocess.run(
              ["./temp_executable 2.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred: return captured stderr and -SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Propagate unexpected execution errors
          raise e
