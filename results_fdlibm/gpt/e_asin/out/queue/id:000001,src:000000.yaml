  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      # Provide an argument that atof parses exactly to +1.0 in IEEE-754 binary64
      # This ensures __HI(x) == 0x3ff00000 and __LO(x) == 0x00000000
      cmd = "./temp_executable 1.0"

      # Ensure standard C numeric locale for decimal point parsing
      env = os.environ.copy()
      env["LC_NUMERIC"] = "C"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
