  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Use argv[1] = "inf" to ensure atof parses it as +Infinity, satisfying hx >= 0x7ff00000
      # Keep argv[2] as a normal finite number to preserve argc == 3 and successful parsing
      cmd = "./temp_executable inf 1.0"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return captured stderr (if any) and a negative signal code
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Propagate unexpected execution errors
          raise e
