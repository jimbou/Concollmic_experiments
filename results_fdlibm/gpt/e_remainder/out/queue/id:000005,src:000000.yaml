  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Concrete inputs selected to satisfy the target constraints:
      # argv[1] = 1.6, argv[2] = 1.0
      # - Both are finite, non-NaN doubles
      # - argv[2] (p=1.0) is non-zero and a normal double; hp >= 0x00200000, so the branch hp < 0x00200000 is false
      # - argv[1] != argv[2] exactly
      # - |argv[1]| = 1.6 > 0.5*|argv[2]| = 0.5; after first subtraction x - p = 0.6 >= 0.5 to exercise nested condition
      try:
          cmd = "./temp_executable 1.6 1.0"
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
