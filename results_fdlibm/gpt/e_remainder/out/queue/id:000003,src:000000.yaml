  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Chosen concrete inputs:
      # a0 = 3.25, a1 = 2.0
      # Rationale:
      # - Both parse as finite IEEE-754 doubles via atof
      # - a1 != +/-0.0 and |a1| >= 2^(-1021) (2.0 is normal and large enough)
      # - a0 != a1 and a0 != -a1
      # - a0/a1 = 1.625, not an exact odd integer, avoiding degenerate modulo outcomes

      try:
          cmd = "./temp_executable 3.25 2.0"
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
