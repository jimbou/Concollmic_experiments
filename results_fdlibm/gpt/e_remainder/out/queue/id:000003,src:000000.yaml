  - |a1| ≥ 2^(-1021) (normal double with exponent field ≥ 1 and not tiny; ensures hp ≥ 0x00200000)
  - a0 ≠ a1 and a0 ≠ -a1 (avoid exact equality early return)
  - a0 / a1 is not an exact odd integer in binary64 (to avoid equality after modulo reduction)
