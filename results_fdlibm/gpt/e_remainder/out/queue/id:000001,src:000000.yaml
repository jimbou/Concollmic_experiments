  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # We provide two whitespace-separated arguments:
      # argv[1] = "1.0" (finite double)
      # argv[2] = "+0.0" (parses via atof to positive zero, ensuring (hp | lp) == 0)
      # This yields argc == 3 and meets the target constraint inside __ieee754_remainder(x, p).
      try:
          result = subprocess.run(
              ["./temp_executable 1.0 +0.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
