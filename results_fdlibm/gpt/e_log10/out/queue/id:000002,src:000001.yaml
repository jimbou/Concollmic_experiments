exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      try:
          # Use a single negative, nonzero, subnormal-valued argument: -1e-308
          # - Strictly negative, nonzero
          # - Magnitude < 2**-1022, well within representable subnormal range (no underflow to -0.0)
          # - Single token numeric literal acceptable to atof in C locale
          cmd = "./temp_executable -1e-308"

          # Ensure C locale so atof uses '.' as decimal separator and standard exponent parsing
          env = os.environ.copy()
          env["LC_ALL"] = "C"
          env["LANG"] = "C"

          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
