  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      try:
          # Ensure atof/strtod use the C locale so '.' is the decimal separator
          env = os.environ.copy()
          env["LC_ALL"] = "C"
          env["LC_NUMERIC"] = "C"

          # Provide exactly one negative, finite, non-zero numeric argument
          # Use -1.0 to avoid any possibility of negative zero
          result = subprocess.run(
              ["./temp_executable -1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return any captured stderr and a negative signal code
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Propagate unexpected errors
          raise e
