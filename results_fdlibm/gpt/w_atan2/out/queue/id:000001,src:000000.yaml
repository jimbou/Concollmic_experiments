  - The process must be started with exactly two arguments after the program name (so argc == 3). The existing harness already satisfies this (it calls the executable with two arguments), but the arguments’ content must meet constraints below.

  2) Argument parsing semantics:
  - The program parses both arguments using the C function atof, which interprets text in the current C locale using standard rules for floating-point constants. Therefore, each argument string must be a valid textual representation of a double.
  - Avoid locale changes (use default "C" locale semantics); do not set environment variables (e.g., LC_ALL, LC_NUMERIC) to non-C locales that would use a comma as decimal separator, since atof expects a dot. If the environment is changed, the strings must match that locale’s format yet still represent zero; to keep constraints simple and robust, require the numeric locale to be C/POSIX.

  3) Values required after parsing:
  - Let A0 be the numeric value produced by parsing argv[1] with atof, and A1 be the value produced by parsing argv[2]. The following must hold:
    • A0 == 0.0 (exact double zero)
