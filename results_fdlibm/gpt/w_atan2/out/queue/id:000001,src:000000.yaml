  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Prepare environment to ensure C/POSIX numeric locale
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"
      env["LC_NUMERIC"] = "C"
      # Remove potential environment modifiers that could alter runtime behavior unexpectedly
      for var in ("LD_PRELOAD", "LD_LIBRARY_PATH"):
          env.pop(var, None)

      try:
          # Provide exactly two arguments that parse to +0.0 via atof in C locale
          # Keep the same structure (shell=True, single string command) as the original harness
          cmd = ["./temp_executable 0 0"]
          result = subprocess.run(
              cmd,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
