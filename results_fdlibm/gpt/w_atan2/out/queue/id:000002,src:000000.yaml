exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      try:
          # Ensure a standard C locale so that atof recognizes NaN tokens reliably
          env = os.environ.copy()
          env["LC_ALL"] = "C"
          env["LANG"] = "C"

          # Provide exactly two space-separated arguments; first one is NaN to satisfy isnan(y) || isnan(x)
          # Maintain the same basic structure (single command string executed via the shell)
          result = subprocess.run(
              ["./temp_executable nan 1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
