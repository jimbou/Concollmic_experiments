  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Provide exactly two whitespace-separated tokens after the executable name
          # argv[1] = 2.5 (finite double), argv[2] = 0.0 (exact +0.0)
          cmd = "./temp_executable 2.5 0.0"
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Raise the error if run failed
          raise e
