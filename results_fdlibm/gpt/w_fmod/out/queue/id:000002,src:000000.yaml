  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess
      import tempfile

      # We keep two finite double command-line arguments and ensure a1 != 0.0.
      # Using the same values as the original harness: 1.0 1.0
      # To satisfy the library-mode constraint (_LIB_VERSION != _IEEE_), we preload
      # a small shared library that sets the global _LIB_VERSION to a non-IEEE mode.
      # This enables the wrapper path that evaluates (y == 0.0) and takes the else-branch
      # when y != 0.0.

      # Build a tiny LD_PRELOAD library that sets _LIB_VERSION to 1 (typically _SVID_)
      # via dlsym on the global symbol. This avoids needing headers or compile-time constants.
      preload_c = r"""
      #define _GNU_SOURCE
      #include <dlfcn.h>
      __attribute__((constructor)) static void init(void) {
          void *sym = dlsym(RTLD_DEFAULT, "_LIB_VERSION");
          if (sym) {
              int *p = (int*)sym;
              *p = 1; // set non-IEEE mode so wrappers do not early-return
          }
      }
      """

      try:
          with tempfile.TemporaryDirectory() as td:
              c_path = os.path.join(td, "preload_libm_mode.c")
              so_path = os.path.join(td, "preload_libm_mode.so")
              with open(c_path, "w", encoding="utf-8") as f:
                  f.write(preload_c)
              # Compile the shared object. Requires gcc and libdl.
              compile_cmd = [
                  "bash",
                  "-lc",
                  f"gcc -shared -fPIC -o '{so_path}' '{c_path}' -ldl"
              ]
              compile_res = subprocess.run(
                  compile_cmd,
                  capture_output=True,
                  encoding="utf-8",
                  errors="replace",
                  timeout=30,
              )
              if compile_res.returncode != 0:
                  raise RuntimeError(
                      "Failed to compile LD_PRELOAD library for _LIB_VERSION override.\n"
                      f"STDOUT:\n{compile_res.stdout}\nSTDERR:\n{compile_res.stderr}"
                  )

              # Prepare environment: set LD_PRELOAD (Linux) and DYLD_* (macOS fallback)
              env = os.environ.copy()
              existing = env.get("LD_PRELOAD", "")
              env["LD_PRELOAD"] = f"{so_path} {existing}".strip()
              # macOS attempt (may be ignored if SIP is active; harmless otherwise)
              env["DYLD_INSERT_LIBRARIES"] = so_path
              env["DYLD_FORCE_FLAT_NAMESPACE"] = "1"

              # Execute the original test harness structure with concrete values
              try:
                  result = subprocess.run(
                      ["./temp_executable 1.0 1.0"],
                      capture_output=True,
                      encoding="utf-8",
                      errors="replace",
                      shell=True,
                      timeout=timeout,
                      env=env,
                  )
                  return result.stderr, result.returncode
              except subprocess.TimeoutExpired as e:
                  return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
