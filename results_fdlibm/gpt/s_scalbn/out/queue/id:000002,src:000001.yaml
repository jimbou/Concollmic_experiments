exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Use two command-line arguments:
      #  - First: a NaN token to ensure exponent bits are all ones (k == 0x7ff)
      #  - Second: a syntactically valid decimal integer ("0")
      try:
          result = subprocess.run(
              ["./temp_executable nan 0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return (e.stderr if e.stderr is not None else ""), -signal.SIGKILL
      except Exception as e:
          raise e
