  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # We pass two arguments: first is a double token recognized as Infinity ("inf"),
      # second is a valid decimal integer ("0"). This ensures scalbn sees x with
      # exponent all ones so that (k == 0x7ff) is true.
      try:
          result = subprocess.run(
              ["./temp_executable inf 0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
