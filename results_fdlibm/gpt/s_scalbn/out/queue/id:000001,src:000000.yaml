     - Precondition on x (the parsed double from argv[1]): x must be a NaN or Infinity at function entry to scalbn. This guarantees that the extracted exponent `k` equals 0x7ff and the condition `if (k==0x7ff)` evaluates to true. The sign and NaN payload, if any, are irrelevant.

