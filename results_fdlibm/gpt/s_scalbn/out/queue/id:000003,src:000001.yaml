target_path_constraint: |-
  Chronological, external-input-level constraints to reach branch: if (k > 0x7fe) -> true in s_scalbn.c:scalbn

  Program invocation and argument structure:
  1. Command-line usage must supply exactly two whitespace-separated arguments after the executable name. The harness uses a shell form, but the program itself reads argc/argv normally. Therefore ensure:
     - argc == 3 inside main (program name + 2 arguments).

  Argument encoding and semantics:
  2. First argument (argv[1]) is parsed as a decimal floating-point in C using atof. It defines input double x.
     - x must be a finite, normalized double (i.e., not zero, subnormal, infinity, or NaN) to avoid early special-case branches.
     - This implies its binary exponent field k0 = ((HI(x) & 0x7ff00000) >> 20) is in [1, 0x7fe]. If x is subnormal (k0 == 0) the function rescales by 2^54 before adjusting n; we must avoid that path for simplicity.
  3. Second argument (argv[2]) is parsed as a base-10 integer using atoi. It defines scaling exponent n.

  Core numeric relationship to trigger the target branch:
  4. In scalbn, after reading x and n, the code computes k = exponent(x) then sets k = k + n. The target branch is if (k > 0x7fe). To satisfy this:
     - Let k0 be the initial exponent of x (1 <= k0 <= 0x7fe). Require: k0 + n > 0x7fe.
     - Because k0 <= 0x7fe, this reduces to: n > 0x7fe - k0.

  Supporting constraints to bypass other branches and ensure the target branch is reached directly:
  5. Avoid k == 0 (subnormal or zero): ensure x’s decimal representation corresponds to a normalized finite double; e.g., magnitude in [2^-1022, 2^1024) and not exactly 0.0.
  6. Avoid k == 0x7ff (Infinity or NaN): ensure the first argument is not a string that atof recognizes as infinity or NaN, and its numeric magnitude is finite.
  7. Avoid underflow/denormal pathways: choose n such that k + n is not <= -54 when combined with any rescaling. Since we already require x normalized and k0 >= 1, we only need: k0 + n > 0x7fe (to hit the target) and thus not <= -54.
  8. Maintain standard environment: no special files or permissions are used; standard locale must allow atof/atoi to parse with '.' as decimal separator.

  Formal SMT-like summary:
  - Inputs: s1, s2 are strings.
  - Parse: x = atof(s1); n = atoi(s2).
  - Constraints:
    a) isfinite(x) && x != 0.0 && is_normalized_double(x) // exponent in [1, 0x7fe]
    b) n ∈ Z
    c) ((exponent(x)) + n) > 0x7fe
    d) s1 not in {"inf", "infinity", "nan", case-insensitive variants}
    e) Locale uses '.' for decimal point

  Outcome:
  - With these constraints, scalbn proceeds through the normalized path, computes k = exponent(x) + n, and the condition (k > 0x7fe) evaluates true, reaching the overflow-handling branch.
