exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      # Use normalized finite double for argv[1]: 1.0 (exponent bits = 0x3ff)
      # Choose integer n for argv[2]: 1024 so k0 + n = 1023 + 1024 = 2047 > 0x7fe
      # Ensure locale uses '.' as decimal separator
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"

      try:
          result = subprocess.run(
              ["./temp_executable 1.0 1024"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
