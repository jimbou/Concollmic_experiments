target_path_constraint: |-
  Chronological, self-contained constraints to reach s_scalbn.c:scalbn() overflow branch (k > 0x7fe -> true):

  1. Command invocation shape:
     - Launch the program exactly as a single executable with two command-line arguments. The process must start such that argc == 3 inside main.
     - The first argument (argv[1]) is a textual representation of a finite, normalized IEEE-754 double-precision (binary64) value. “Normalized” means the exponent field (11 bits) is neither all zeros nor all ones; the value is not NaN or Infinity and not subnormal or zero.
     - The second argument (argv[2]) is a textual decimal integer that atof/atoi will parse respectively into double a0 and int a1.
     - Locale must use the dot character '.' as the decimal separator so that atof parses correctly. For example, set LC_ALL=C or LANG=C in the environment. The program does not read files; no other environment dependencies are required beyond permitting standard execution.

  2. Input value properties prior to scalbn:
     - After parsing: a0 must be finite and normalized; a1 must be an integer.
     - Internals used by scalbn (explained without relying on code names): The routine reads the IEEE-754 exponent of a0 (call it E, unbiased exponent), by extracting the 11-bit exponent field and subtracting the bias 1023. It refers to a quantity k which is the raw exponent field value (biased exponent) prior to adding a1. The branch of interest tests if (k + a1) > 0x7fe, where 0x7fe = 2046 is the maximum finite biased exponent (one less than 0x7ff which denotes Inf/NaN). Thus we must ensure k + a1 > 2046 while avoiding earlier special-case branches.

  3. Avoid early branches:
     - Prevent a0 from being zero or subnormal: ensure its biased exponent field k_original is in [1, 2046]. This avoids entering the k==0 path (which rescales by 2^54 and applies different checks).
     - Prevent a0 from being Inf or NaN: ensure its exponent field is not 0x7ff. That keeps us out of the k==0x7ff path.
     - Prevent triggering k <= -54 and n > 50000 paths: choose a1 such that k + a1 does not land ≤ -54 while also avoiding the extremely large positive a1 combined with negative k producing n > 50000 check later. These are automatically avoided if we design for overflow (k + a1 > 2046).

  4. Core overflow constraint:
     - Let k be the biased exponent field of a0 (an integer in [1, 2046]). Require: k + a1 > 2046.
     - Equivalently in terms of the unbiased exponent E = k - 1023: require E + a1 > 1023.
     - Additionally, maintain that a0 is finite normalized so mantissa/sign are arbitrary but not all-zero exponent.

  5. Robust textual formatting constraints so atof/atoi produce intended values:
     - argv[1] must be a decimal string that atof parses to the intended a0 without overflow to Inf or underflow to subnormal/zero. Examples of valid formats include "d.ddd", optional sign, and optional exponent part "e±dd". Do not include non-numeric characters other than those permitted in C locale floating literals.
     - argv[2] must be a base-10 integer string that atoi parses to a1 with no leading/trailing non-digit characters except optional leading sign.
     - No extra whitespace is required but typical C parsers allow leading whitespace; avoid trailing non-numeric characters to prevent partial parsing.

  6. Combined condition summary (SMT-style):
     - Variables: a0 ∈ R (IEEE-754 binary64), a1 ∈ Z.
     - Constraints:
       a) is_finite_normal_binary64(a0) = true.
       b) biased_exponent(a0) = k ∈ [1, 2046].
       c) a1 ∈ Z parsed by atoi from argv[2].
       d) k + a1 > 2046.
       e) Locale: LC_ALL = "C" (decimal separator '.').

  Any inputs satisfying these constraints will cause scalbn to enter the overflow branch where (k + n) > 0x7fe evaluates to true, thus executing the previously uncovered code line.
