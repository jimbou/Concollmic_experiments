  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      # Concrete inputs satisfying the target path constraints:
      # argv[1] = "1.0"  -> finite, normalized double (biased exponent k = 0x3ff = 1023)
      # argv[2] = "1024" -> integer n such that k + n = 1023 + 1024 = 2047 > 0x7fe (2046)
      # Locale ensures '.' is decimal separator for atof
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"

      cmd = "./temp_executable 1.0 1024"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Ensure we always return a string for stderr even if None
          stderr = e.stderr if isinstance(e.stderr, str) else (e.stderr.decode("utf-8", "replace") if e.stderr else "")
          return stderr, -signal.SIGKILL
      except Exception:
          # Bubble up unexpected issues to surface harness/environment problems
          raise
