target_path_constraint: |-
  Chronological input-environment constraints to make the program take the branch `if (argc != 2)` with outcome true:

  1. Process invocation (command-line layout):
     - The program must be executed such that the total count of command-line arguments observed by `main(int argc, char** argv)` is NOT equal to 2.
     - Definition of argc here follows standard C rules: argc counts the program name as the first argument (argv[0]) and each whitespace-separated token provided on the command line thereafter as an additional argument.

  2. Relationship to current harness:
     - The harness currently executes using a single composite shell argument string: `"./temp_executable 1.0"` with `shell=True`, which results in two tokens: the program path, and a single numeric argument `1.0`. In a typical execve-style environment (without shell concatenation anomalies), this yields `argc == 2` inside the program, so the branch would evaluate to false.
     - To force `argc != 2` under the same style of invocation, adjust the shell tokenization outcome so that the number of whitespace-separated arguments after the program name is either 0 (yielding argc == 1) or at least 2 (yielding argc >= 3).

  3. Constraints to achieve argc == 1 (so argc != 2):
     - Ensure the command line contains ONLY the program path token, with no additional tokens. Concretely, the shell command string must have no extra whitespace-separated fields after the program path. Any trailing spaces must not produce additional arguments.
     - Environment conditions: the executable path must resolve and be launchable without requiring additional arguments.

  4. Constraints to achieve argc >= 3 (so argc != 2):
     - Provide at least two whitespace-separated tokens after the program path. Each token will be parsed as a separate string argument (e.g., numbers or words); content is irrelevant to branch reachability so long as tokenization produces at least two arguments.
     - No quoting should merge tokens; avoid quotes that would combine multiple substrings into one argument. Ensure straightforward whitespace separation produces distinct argv entries.

  5. Robustness against environment quirks:
     - Avoid shell expansions (globbing) that could unpredictably alter argument count. Either disable globbing or use tokens that do not match filesystem patterns.
     - Ensure no environment variables or shell aliases rewrite the command line to reintroduce a single argument scenario.

  Any execution satisfying either set of constraints in step 3 or step 4 guarantees `argc != 2` at program start, causing the targeted branch to be taken.
