exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Ensure the executable exists and is runnable
      exe_path = "./temp_executable"
      if not os.path.exists(exe_path):
          raise FileNotFoundError(f"Executable not found at {exe_path}")
      if not os.access(exe_path, os.X_OK):
          raise PermissionError(f"Executable at {exe_path} is not executable")

      try:
          # Invoke with no user-supplied arguments to ensure argc == 1 (thus argc != 2)
          # Keep shell=True and a single command string, matching the original harness structure
          result = subprocess.run(
              ["./temp_executable"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
