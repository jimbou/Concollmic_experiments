target_path_constraint: |-
  To reach the branch where the program checks the number of command-line arguments and takes the path when the check is true (argc != 2), enforce the following constraints in chronological order:

  1) Process invocation (command-line arguments):
  - Launch the executable without providing exactly one user argument after the program name. The program defines argc as the count of argv entries, including the program path itself. Therefore, to satisfy (argc != 2), any of the following patterns suffice:
    a) Zero user arguments (only program name present): argc = 1
    b) Two or more user arguments: argc ≥ 3
  - The content of any provided argument(s) is irrelevant to reaching this branch because the check occurs before any parsing is used to gate behavior; only the count matters.

  2) Environment and I/O conditions:
  - No files, environment variables, or standard input are required by this branch. The program merely evaluates the argument count. Ensure the execution environment permits normal process start.

  3) Early branch observation guarantee:
  - Ensure that the argument count check occurs immediately after program start. Avoid wrappers or shells that could coalesce arguments into a single string unless deliberately used to change argc. The decisive property is that the callee program receives argv such that len(argv) != 2 at exec time.

  These conditions are sufficient for the program to take the argc != 2 branch.
