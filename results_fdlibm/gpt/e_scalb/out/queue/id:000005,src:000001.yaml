exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      try:
          # Ensure standard C locale so atof recognizes special values like "-inf"
          env = os.environ.copy()
          env["LC_ALL"] = "C"
          env["LANG"] = "C"
          env["LC_NUMERIC"] = "C"

          # Execute the original harness structure with concrete arguments:
          # argv[1] = "1.0" (finite), argv[2] = "-inf" (non-finite negative infinity)
          result = subprocess.run(
              ["./temp_executable 1.0 -inf"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return any captured stderr and a negative code indicating kill by signal
          return e.stderr if hasattr(e, "stderr") and e.stderr is not None else "", -signal.SIGKILL
      except Exception as e:
          # raise the error if run failed
          raise e
