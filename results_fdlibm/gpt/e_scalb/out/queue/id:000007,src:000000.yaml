  Program interface and inputs:
  - The executable is invoked via a shell command string "./temp_executable 1.0 1.0" with shell=True. However, to reach the target branch, the same executable must be invokable with two command-line arguments (both strings) representing floating-point numbers in text form. The program expects exactly three argv entries: program name, arg1, arg2.

  Chronological, self-contained constraints:
  1) Argument count and parsing
     - Exactly two user-supplied command-line arguments must be provided (argc == 3 overall including program name). This ensures the program does not take the early-exit path for incorrect argc.
     - Arg1 and Arg2 must each be valid textual representations of real numbers in a C locale (period as decimal separator), acceptable by the C library function atof(). Leading/trailing whitespace is allowed but not required. No thousands separators or locale-specific characters.
     - Let x be the real number parsed from Arg1, and fn be the real number parsed from Arg2.

  2) Finite and non-NaN requirements (to avoid earlier exits and reach the specific check):
     - x must be a finite real number (not NaN, not ±infinity). Any finite x is acceptable because the target branch depends only on fn.
     - fn must be a finite real number (not NaN, not ±infinity). This avoids the isnan(fn) and !finite(fn) branches.

  3) Avoid earlier guards that would divert control flow before reaching the target branch body (note: checks are evaluated sequentially inside __ieee754_scalb):
     - Ensure fn is not NaN: Arg2 must not be a NaN textual form (e.g., avoid "nan", "NaN", or variants). Similarly, avoid infinities (e.g., "inf", "infinity", "+inf", "-inf").
     - Ensure rint(fn) == fn (i.e., fn is an integer-valued real) OR at least, even if this check is performed, we must pass through it without taking that branch. To be certain: require fn to be mathematically an integer value (no fractional part), when interpreted in double precision (e.g., ...,-2, -1, 0, 1, 2,...). This prevents taking the "rint(fn)!=fn" branch.
     - Ensure fn ≤ 65000.0 is not sufficient; we specifically need the later negative-large check. Also avoid triggering the positive-large check: require fn ≤ 65000.0.

  4) Target branch satisfaction:
     - Require (-fn > 65000.0) to be true. Equivalently, require fn < -65000.0.
     - Combine with the avoidance of the positive-large check: fn must satisfy fn < -65000.0 (which automatically ensures fn is not > 65000.0).
     - Also maintain integer-valued constraint to skip the non-integer branch: fn must be an integer-valued finite double strictly less than -65000.0.

  5) Summary of constraints expressed formally:
     - argc == 3
     - Arg1 parses via atof to a finite double x ∈ R (no NaN/Inf). No restriction on value beyond finiteness.
     - Arg2 parses via atof to a finite double fn ∈ R such that:
         a) fn is not NaN or ±Inf
         b) fn is an integer-valued double (rint(fn) == fn)
         c) fn < -65000.0

  6) Environmental conditions:
     - No files or environment variables are needed. Standard C locale should be assumed so that decimal point is '.'.

  Any pair of command-line strings meeting the above will drive execution to the target branch (-fn > 65000.0) in __ieee754_scalb.
