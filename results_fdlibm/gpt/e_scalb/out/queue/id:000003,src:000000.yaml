exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Use a non-integer, finite, |fn| < 65000 for argv[2]; keep argv[1] finite as well
      # Command maintains the exact invocation shape: "./temp_executable <arg1> <arg2>"
      cmd = "./temp_executable 1.0 3.1"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
