  1) Process invocation via shell: The program is executed through a shell with a single command string. Maintain the same invocation shape: "./temp_executable <arg1> <arg2>". No additional arguments should be present and no quoting that would merge arguments beyond these two numeric tokens.

  2) Command-line arity: Exactly 3 argv entries at program start: argv[0] is the executable name, argv[1] and argv[2] are present. Concretely, ensure the final command seen by main provides exactly two separate numeric strings after the program name so that main sees argc == 3.

  3) Argument parseability as doubles:
     - argv[1] must be a text representation of a finite IEEE-754 double value parsable by atof (e.g., optional sign, digits with optional decimal point, optional exponent part). Avoid NaN and infinity spellings because atof should map those to non-finite values which may take other branches.
