  4) Avoid earlier branches in __ieee754_scalb:
     - Not NaN: Both parsed doubles must not be NaN.
     - Finite: The second argument (scale factor) must be finite (neither +inf nor -inf).

  5) Target non-integer condition on the scale factor (second argument): Let fn be the double parsed from argv[2]. Require that fn is NOT an integer value as a double. Formally, rint(fn) != fn must hold. Equivalently, fn must have a fractional component not equal to 0 after rounding to the nearest integer with ties to even. Practical sufficient conditions:
     - fn is finite and not an integer (e.g., its fractional part is not 0), and additionally not exactly a half-integer that would round back to itself under ties-to-even. To make this unambiguous, specify: there exists no integer k such that fn == k, and also fn is not a value such that rint(fn) equals fn; thus require fractional part ≠ 0 and fn not exactly of the form m + 0.0.
     - More directly as an SMT-style constraint: finite(fn) ∧ ¬isnan(fn) ∧ (rint(fn) ≠ fn).

  6) Additional constraints to avoid other guards that could preempt evaluation:
     - Magnitude constraints: Ensure |fn| ≤ 65000.0 does not force taking the overflow-check branches; to keep execution uniform and avoid those branches, choose |fn| < 65000.0.

  7) No environmental dependencies: The program does not read files or environment variables; no special permissions or locale settings are required beyond standard C locale where atof parses a dot as the decimal separator.

