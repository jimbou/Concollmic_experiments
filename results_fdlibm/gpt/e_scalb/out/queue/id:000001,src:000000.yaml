  5) Platform/environment assumptions:
     - Standard C locale for atof, so that the recognized tokens for infinity are the usual English tokens above.
     - No environment variables interfere with locale or parsing (or ensure locale uses '.' as decimal separator and recognizes "inf"/"infinity").

