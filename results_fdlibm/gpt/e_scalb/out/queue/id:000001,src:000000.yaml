  3) String-to-double parsing constraints for both arguments (C standard atof behavior):
     - argv[1] must be a valid textual representation of a finite IEEE-754 double. Its exact value is unconstrained besides finiteness (e.g., any finite number), so that x is finite.
     - argv[2] must be a textual representation of a non-finite IEEE-754 double so that `fn` is not finite. Acceptable non-finite textual forms per atof include case-insensitive variants of: "inf", "+inf", "-inf", "infinity", "+infinity", "-infinity". Trailing whitespace is allowed; no additional non-whitespace trailing characters are allowed.
