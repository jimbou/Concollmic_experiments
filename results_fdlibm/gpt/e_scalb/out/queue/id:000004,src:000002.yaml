exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      try:
          # Use C/POSIX numeric locale so atof/strtod parse with '.' as decimal separator
          env = os.environ.copy()
          env["LC_ALL"] = "C"
          env["LANG"] = "C"
          env["LC_NUMERIC"] = "C"

          # Provide exactly two arguments after the program name:
          # argv[1] = "1.0"  -> finite, not NaN
          # argv[2] = "0.5"  -> finite, not NaN, not an integer, and |fn| <= 65000
          # This ensures rint(fn) != fn while bypassing earlier isnan/!finite guards
          result = subprocess.run(
              ["./temp_executable 1.0 0.5"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred; return captured stderr and a negative signal code
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Re-raise unexpected execution issues
          raise e
