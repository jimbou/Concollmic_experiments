target_path_constraint: |-
  Goal: Reach the branch in __ieee754_scalb where rint(fn) != fn evaluates to true (i.e., fn is finite and not an integer), while ensuring no earlier guards divert execution.

  Chronological, external-input-level constraints:

  1) Process invocation (command-line):
  - The program must be run with exactly two command-line arguments after the executable name (argc == 3). Denote them as arg1 and arg2.

  2) Locale/environment to parse floating-point consistently:
  - The C/POSIX numeric locale must be used for strtod/atof behavior (decimal point is '.'). For example, set environment variables LC_ALL=C and LC_NUMERIC=C (LANG can also be set to C). Any equivalent setup that ensures '.' is the decimal separator is acceptable.

  3) Argument formats (as strings) and their numeric interpretations by atof under the C locale:
  - arg1 must be a string that atof converts to a finite double value x such that isnan(x) is false. Avoid strings that parse to NaN or infinity. Do not rely on locale-specific forms; use standard decimal notation.
  - arg2 must be a string that atof converts to a finite double value fn such that:
    a) isnan(fn) is false
    b) isfinite(fn) is true (i.e., not ±infinity)
    c) rint(fn) != fn (fn is not an integer value). Equivalently: there exists a non-zero fractional part; fn ∉ {..., -2.0, -1.0, 0.0, 1.0, 2.0, ...}.

  4) Interactions with earlier guards in __ieee754_scalb:
  - To bypass the first guard (isnan(x) || isnan(fn)): ensure both parsed numbers (x from arg1 and fn from arg2) are not NaN.
  - To bypass the second guard (!finite(fn)): ensure fn is finite (not ±inf). This also implies arg2 is not a textual infinity representation.
  - To reach the target guard (rint(fn) != fn): ensure fn is finite and non-integer as per 3c.

  5) Additional guards to avoid premature exits:
  - Ensure |fn| ≤ 65000.0 so that neither (fn > 65000.0) nor (-fn > 65000.0) holds. Concretely: -65000.0 ≤ fn ≤ 65000.0.

  Summary (SMT-style):
  - Inputs are strings s1, s2. Let x = atof_C_locale(s1), fn = atof_C_locale(s2).
  - Constraints:
    a) argc = 3
    b) ¬isnan(x) ∧ ¬isnan(fn)
    c) isfinite(fn)
    d) rint(fn) ≠ fn
    e) -65000.0 ≤ fn ≤ 65000.0
