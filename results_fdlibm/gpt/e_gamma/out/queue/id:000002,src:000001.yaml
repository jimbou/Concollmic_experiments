  Constraints in chronological order:

  1) Process invocation (command-line):
     - The program must be started with exactly one user-supplied argument in addition to argv[0] (the executable path). Formally: argc == 2.
     - Using the provided harness style (shell=True with a single command string), ensure the composed command line contains precisely one whitespace-separated argument after the executable name/path. Avoid additional spaces or shell expansions that would create more than one argument.

  2) Argument value format (argv[1]):
     - argv[1] must be a valid C locale numeric string accepted by atof, representing a finite double value. The accepted forms include optional leading/trailing whitespace, optional sign (+/-), digits with optional decimal point, and/or scientific notation (e.g., d.ddde±dd). Avoid strings that result in NaN or infinities via non-numeric content.
     - Do not include embedded NUL bytes; the argument must be a standard null-terminated string.
     - No surrounding quotes should survive as part of the argument token after shell parsing; the actual argv[1] characters passed to the program must be the numeric characters themselves.

  3) Environmental/locale assumptions:
     - Decimal separator must be '.', not ','; execution must use the C/POSIX numeric locale or any locale where atof interprets '.' as the decimal point. Avoid relying on locale-specific formats.

  4) Value domain for gamma computation:
     - The gamma function is undefined (poles) at non-positive integers. While the implementation may still return a value with signgam set, to avoid domain errors or exceptional cases, provide argv[1] that does NOT represent 0, -1, -2, ...
