  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      try:
          # Ensure C/POSIX numeric locale so '.' is the decimal separator for atof
          env = os.environ.copy()
          env["LC_ALL"] = "C"
          env["LC_NUMERIC"] = "C"
          env["LANG"] = "C"

          # Exactly one user-supplied argument to make argc == 2
          # Avoid quotes or shell constructs; a plain numeric string ensures a single argv token
          cmd = "./temp_executable 0.5"

          # Keep the same harness structure: shell=True and a single command string element in the list
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
