  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Chosen concrete input:
      # x = -1.5
      # Justification:
      # - Finite, not NaN/Inf
      # - |x| = 1.5 satisfies 1 <= |x| < 2^20, hence 0 <= j0 < 20
      # - Not an exact integer (fractional part != 0), so early return is avoided
      # - Negative sign ensures the i0<0 branch (line 39) is taken inside the j0<20 inner else
      cmd = "./temp_executable -1.5"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
