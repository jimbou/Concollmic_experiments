  Chronological constraints to reach __ieee754_acosh(x): (hx >= 0x41b00000) and then (hx >= 0x7ff00000) -> true

  1. Command invocation shape
  - The program must be launched via a shell command exactly as the harness does: a single executable followed by one argument. The executable name is fixed by the harness; only the single argument’s textual content can vary.
  - Ensure the process runs without a timeout and no environment restrictions prevent standard C library I/O.

  2. Argument count constraint
  - Provide exactly one non-empty command-line argument after the executable name, so that at program start: argc == 2.

  3. Argument-to-double parsing constraint
  - The sole argument must be a textual representation that, when parsed by the C function atof, yields a non-finite IEEE-754 double value (i.e., either positive infinity or NaN). This satisfies the inner condition (hx >= 0x7ff00000) -> true.
  - Accepted textual forms for atof commonly include representations like “inf”, “infinity”, or “nan”, optionally with sign or payload specifiers. Do not rely on locale-specific decimal separators.
  - The string must not contain trailing characters that would cause atof to return a finite number.

  4. IEEE-754 bit-pattern constraint (outer condition)
  - For the parsed double x = atof(argv[1]), its high 32-bit word (hx) must be >= 0x41b00000 to enter the “very large” bucket, but the inner test supersedes it because non-finite doubles have hx >= 0x7ff00000, which also satisfies hx >= 0x41b00000.
  - Concretely: require that x be either NaN or Infinity in IEEE-754 double-precision format, which guarantees hx >= 0x7ff00000.

  5. File/IO constraints
  - No files are read; stderr must be writable (the program prints a newline to stderr before invoking __ieee754_acosh and inside the large-x branch).

  6. Summary of required properties of argv[1]
  - argv[1] must be a string that atof parses into a non-finite double (NaN or ±Infinity). This ensures:
    a) hx >= 0x41b00000 (outer condition true)
    b) hx >= 0x7ff00000 (inner condition true)
  - No additional arguments should be provided.
