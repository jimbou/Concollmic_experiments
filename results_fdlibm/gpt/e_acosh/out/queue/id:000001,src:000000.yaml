exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Use a single executable followed by exactly one argument that atof parses as +infinity
      # This ensures the parsed double is non-finite, making hx >= 0x7ff00000
      cmd = ["./temp_executable inf"]

      try:
          result = subprocess.run(
              cmd,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred; return captured stderr and -SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Propagate unexpected errors
          raise e
