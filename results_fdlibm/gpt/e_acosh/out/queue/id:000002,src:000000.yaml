exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # The target path requires x == +1.0 (IEEE-754 binary64). The decimal string
      # "1.0" parses exactly to +1.0 under the default C locale and atof semantics,
      # ensuring hx == 0x3FF00000 and __LO(x) == 0. We keep the single argument
      # and shell invocation unchanged as required.
      try:
          result = subprocess.run(
              ["./temp_executable 1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
