exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Choose x = 3.0 which satisfies: x > 2.0, x < 2^28, finite, normal, and parsable by atof
      arg_value = "3.0"
      cmd = f"./temp_executable {arg_value}"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred; return captured stderr (if any) and return code -SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Ensure to raise the error if run failed
          raise e
