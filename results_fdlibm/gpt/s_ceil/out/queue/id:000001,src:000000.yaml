exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Concrete value selection satisfying constraints:
      # - Single CLI arg is an exact integer k with 1 <= |k| < 2^20
      # - Choose k = 1048575 (2^20 - 1), which is exactly representable in double,
      #   yields j0 = 19 (in [0, 19]), and has no fractional bits.
      cmd = "./temp_executable 1048575"

      # Ensure C numeric locale semantics for atof (decimal point '.')
      env = os.environ.copy()
      env["LC_ALL"] = "C"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
