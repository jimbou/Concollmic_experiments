exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Provide exactly one additional, unquoted argument that atof can parse, ensuring argc == 2
      # Shell will split this into: argv[0] = ./temp_executable, argv[1] = 1.0
      cmd = ["./temp_executable 1.0"]

      try:
          result = subprocess.run(
              cmd,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return captured stderr and indicate kill via negative signal code
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Propagate unexpected execution failures
          raise e
