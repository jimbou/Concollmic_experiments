      import signal
      import subprocess

      # Add one more unquoted token beyond the original single argument to ensure argc != 2
      # This results in argv: ["./temp_executable", "1.0", "extra"] => argc == 3
      cmd = ["./temp_executable 1.0 extra"]

      try:
