exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Add one more unquoted token beyond the original single argument to ensure argc != 2
      # This results in argv: ["./temp_executable", "1.0", "extra"] => argc == 3
      cmd = ["./temp_executable 1.0 extra"]

      try:
          result = subprocess.run(
              cmd,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return captured stderr and indicate kill via negative signal code
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Propagate unexpected execution failures
          raise e
