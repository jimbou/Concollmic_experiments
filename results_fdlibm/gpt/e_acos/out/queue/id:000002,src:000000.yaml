  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Ensure C/POSIX locale so atof/strtod parse '.' as decimal separator
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LC_NUMERIC"] = "C"
      env["LANG"] = "C"
      # Remove LANGUAGE to avoid overriding LANG for messages/locales
      env.pop("LANGUAGE", None)

      try:
          # Execute with the exact single argument token "1.0"
          result = subprocess.run(
              ["./temp_executable 1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return captured stderr and -SIGKILL as return code
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Propagate unexpected execution issues
          raise e
