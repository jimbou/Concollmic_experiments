exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Choose a very small finite double value to satisfy |x| < 2^-13 and also the
      # stricter ix <= 0x3c600000 (|x| <= 2^-57). 1e-20 < 2^-57 (~6.94e-18).
      cmd_str = "./temp_executable 1e-20"

      # Ensure locale-independent parsing with '.' decimal conventions
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"

      try:
          result = subprocess.run(
              [cmd_str],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return captured stderr and -SIGKILL as code
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Propagate unexpected execution errors
          raise e
