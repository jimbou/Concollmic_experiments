  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # We ensure the locale uses '.' as the decimal separator and that parsing is in the C locale.
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"
      env["LC_NUMERIC"] = "C"

      # Use exactly one plain numeric argument that atof parses to the IEEE-754 double +1.0.
      # "1" is chosen to avoid any locale-dependent decimal separator concerns while still yielding 1.0 exactly.
      cmd = "./temp_executable 1"

      # Ensure the executable is present and executable; raise if not.
      if not os.path.exists("./temp_executable"):
          raise FileNotFoundError("./temp_executable not found")
      if not os.access("./temp_executable", os.X_OK):
          raise PermissionError("./temp_executable is not executable")

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
