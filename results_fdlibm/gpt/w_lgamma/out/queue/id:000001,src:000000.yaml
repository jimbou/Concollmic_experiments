  1) Process invocation and arguments
  - The program must be launched exactly as the harness does: a single command-line argument is provided (argc == 2). The argument string must represent a valid floating-point number in the C locale accepted by atof (e.g., optional leading/trailing whitespace, optional sign, digits with optional decimal point, optional exponent). Denote this parsed double value as X.

  2) Runtime library configuration (disable IEEE short-circuit return path)
  - The build/runtime must not define _IEEE_LIBM in a way that makes the lgamma wrapper return immediately without checking error conditions. Practically, ensure the lgamma wrapper executes the non-IEEE block that evaluates finite() and _LIB_VERSION. This can be achieved by running with a libm configuration where _LIB_VERSION is not forced to _IEEE_ or where the wrapper is not compiled with _IEEE_LIBM. Environment/dynamic linking should select such a non-IEEE variant.

  3) Libm error-handling mode at runtime
  - Ensure that _LIB_VERSION at runtime is not equal to _IEEE_. This forces the path past the initial check so that the conditional using finite() is evaluated.

  4) Mathematical relation between input and lgamma result to satisfy the target predicate
  - Require finite(X) to be true (X is not NaN and not an infinity), and require that the computed y = __ieee754_lgamma_r(X, &signgam) is not finite (i.e., y is NaN or ±Inf). This satisfies (!finite(y) && finite(x)).

  5) Characterization of X values that achieve step 4 without violating other conditions
  - Select X such that it is a non-NaN, non-infinite real where the gamma function has a pole or causes overflow in the lgamma computation, leading to a non-finite result from __ieee754_lgamma_r. Typical sufficient conditions:
