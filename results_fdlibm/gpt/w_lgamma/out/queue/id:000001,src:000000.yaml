exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # We choose X = 0.0 to ensure:
      # - finite(X) is true (0.0 is finite)
      # - y = lgamma(X) is +Inf because gamma has a pole at non-positive integers
      # This satisfies (!finite(y) && finite(x)).
      # We also enforce the C locale to make atof parse consistently.

      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"

      try:
          # Keep the same structure (shell=True and single command string),
          # but substitute the argument with our concrete value 0
          result = subprocess.run(
              ["./temp_executable 0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
