  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Provide exactly three arguments after the program name, selecting case 6
      # argv[1] = "1.0"   (finite decimal float)
      # argv[2] = "-1.0"  (finite decimal float)
      # argv[3] = "6"     (base-10 integer; atoi == 6 -> selects case 6)
      cmd = "./temp_executable 1.0 -1.0 6"

      # Enforce C locale so '.' is the decimal separator
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"
      env["LC_NUMERIC"] = "C"

      try:
          result = subprocess.run(
              cmd,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return any captured stderr (may be None) and a negative signal code
          stderr = e.stderr if getattr(e, "stderr", None) is not None else ""
          return stderr, -signal.SIGKILL
      except Exception as e:
          # Propagate unexpected execution errors
          raise e
