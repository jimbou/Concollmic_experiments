      cmd = "./temp_executable 3.14 -2.5 5"

      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"
      env["LC_NUMERIC"] = "C"

      try:
          result = subprocess.run(
              cmd,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          stderr = e.stderr if getattr(e, "stderr", None) is not None else ""
          return stderr, -signal.SIGKILL
      except Exception as e:
