  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Provide exactly three arguments so argc == 4, with argv[3] parsing to integer 4
      # argv[1] and argv[2] are finite decimal floats parsed with '.' as decimal separator
      cmd = "./temp_executable 3.14 -2.5 4"

      # Ensure C locale so '.' is the decimal point for numeric parsing
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"
      env["LC_NUMERIC"] = "C"

      try:
          result = subprocess.run(
              cmd,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          stderr = e.stderr if getattr(e, "stderr", None) is not None else ""
          return stderr, -signal.SIGKILL
      except Exception as e:
          raise e
