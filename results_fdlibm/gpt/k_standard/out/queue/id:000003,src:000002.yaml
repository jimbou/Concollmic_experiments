  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Choose concrete inputs satisfying all constraints:
      # argv[1] = "3.14"   (valid finite decimal float)
      # argv[2] = "-2.5"   (valid finite decimal float)
      # argv[3] = "2"      (valid base-10 integer; atoi == 2 -> selects case 2)
      # Invoke via shell with exactly three arguments after program name.
      cmd = "./temp_executable 3.14 -2.5 2"

      # Ensure C locale so '.' is treated as decimal separator deterministically
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"
      env["LC_NUMERIC"] = "C"

      try:
          result = subprocess.run(
              cmd,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return any captured stderr (may be None) and a negative signal code
          stderr = e.stderr if getattr(e, "stderr", None) is not None else ""
