  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Concrete inputs chosen to satisfy constraints:
      # argv[1] = "1.0" (valid decimal float)
      # argv[2] = "1.0" (valid decimal float)
      # argv[3] = "21"  (valid decimal integer; atoi == 21)
      # Invocation via shell ensures exactly three separate arguments after program name -> argc == 4
      try:
          result = subprocess.run(
              ["./temp_executable 1.0 1.0 21"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Ensure to raise the error if run failed
          raise e
