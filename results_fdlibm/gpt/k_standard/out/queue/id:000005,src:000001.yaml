  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Concrete inputs satisfying constraints:
      # argv[1] -> finite double: "1.0"
      # argv[2] -> finite double: "2.0"
      # argv[3] -> atoi == 22:    "22"
      # Keep the same basic structure (shell invocation with a single string command)
      try:
          result = subprocess.run(
              ["./temp_executable 1.0 2.0 22"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
