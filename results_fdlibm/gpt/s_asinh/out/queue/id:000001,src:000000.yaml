target_path_constraint: |-
  Constraints to reach: else-if branch in asinh where 0x40000000 < ix ≤ 0x41b00000, i.e., 2.0 < |x| ≤ ~2^27.

  1) Command invocation
  - The program must be executed with exactly one command-line argument (besides the program name), because main expects argc == 2. The harness already supplies a single argument string.

  2) Argument format
  - The sole argument must be a valid decimal floating-point number string accepted by C’s atof, with no leading/trailing non-numeric characters that would cause parsing to stop before producing a finite double.
  - The parsed value x must be finite (not NaN, not ±Infinity).

  3) Magnitude range to steer control flow in asinh
  - Let x be the parsed double value. Define hx = high 32 bits of x’s IEEE-754 binary64 representation interpreted as signed int, and ix = hx & 0x7fffffff (i.e., ix equals the high word with the sign bit cleared, effectively using |x|’s high word).
  - Ensure ix ≥ 0x3e300000 is false to bypass the very-small branch: i.e., |x| ≥ 2^-28 is NOT required; instead we must avoid taking the early return path. Because the code checks `if (ix < 0x3e300000) { if (huge + x > one) return x; }`, to avoid returning from this block, require ix ≥ 0x3e300000, i.e., |x| ≥ 2^-28. This keeps execution from returning early.
  - Ensure ix ≤ 0x41b00000 to avoid the very-large branch: i.e., |x| ≤ 2^27.
  - Ensure ix > 0x40000000 to enter the selected else-if: i.e., |x| > 2^1 = 2.0.
  - Combined magnitude constraint: 2.0 < |x| ≤ 2^27.

  4) Non-special values to avoid other branches
  - Exclude NaN and infinities: argument string must not represent "nan", "inf", or values whose magnitude overflows to infinity.

  5) String encoding and locale
  - The argument must use a decimal point character '.' consistent with the C locale used by atof (assume "C" locale). No thousands separators. Optional leading sign is allowed.

  6) Whitespace handling
  - Leading/trailing ASCII whitespace is allowed but must not include extra tokens; the string must contain exactly one numeric token so that atof parses a single finite double x satisfying 2.0 < |x| ≤ 2^27.
