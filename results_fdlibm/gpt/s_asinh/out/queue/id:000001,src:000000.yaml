exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Choose x = 2.5 to satisfy 2.0 < |x| <= 2^27, ensure finite, non-special value
      cmd = "./temp_executable 2.5"

      # Ensure C locale for atof parsing rules
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
