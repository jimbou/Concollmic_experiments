exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Choose a moderate-magnitude input satisfying:
      # 2^-28 <= |x| <= 2.0 and finite. We use 0.5 which clearly fits.
      arg = "0.5"

      # Ensure C locale for consistent atof parsing using dot as decimal separator
      env = os.environ.copy()
      env.setdefault("LC_ALL", "C")
      env.setdefault("LANG", "C")

      try:
          result = subprocess.run(
              [f"./temp_executable {arg}"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return captured stderr and -SIGKILL as return code
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Raise other exceptions to surface execution failures
          raise e
