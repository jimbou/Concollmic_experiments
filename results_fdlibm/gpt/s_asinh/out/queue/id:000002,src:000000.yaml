exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Chosen concrete input: single-token argument "inf"
      # Rationale:
      # - atof("inf") parses to +Infinity (non-finite)
      # - This ensures IEEE-754 exponent = 2047, so ix >= 0x7ff00000 is true
      # - No spaces or special shell characters; remains a single token
      try:
          result = subprocess.run(
              ["./temp_executable inf"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
