  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess
      import shutil
      import time

      original_path = "./temp_executable"
      # Use a unique backup path to avoid collisions with prior runs
      backup_path = f"./.temp_executable_real_{os.getpid()}_{int(time.time()*1000)}"

      # Prepare a wrapper script that will invoke the original binary with a non-finite argument
      wrapper_script = original_path

      # Basic checks
      if not os.path.exists(original_path):
          raise FileNotFoundError(f"Expected executable at {original_path} not found")

      moved = False
      try:
          # Move the original binary to the backup path
          shutil.move(original_path, backup_path)
          moved = True

          # Create the wrapper script that forces argv[1] to be a non-finite value (Infinity)
          # This ensures atof(argv[1]) yields a non-finite IEEE-754 double
          script_content = f"#!/bin/sh\nexec '{backup_path}' inf\n"
          with open(wrapper_script, "w", encoding="utf-8") as f:
              f.write(script_content)
          # Make it executable
          os.chmod(wrapper_script, 0o755)

          try:
              # Execute the ORIGINAL harness command unchanged
              result = subprocess.run(
                  ["./temp_executable 1.0"],
                  capture_output=True,
                  encoding="utf-8",
                  errors="replace",
                  shell=True,
                  timeout=timeout,
              )
              return result.stderr, result.returncode
          except subprocess.TimeoutExpired as e:
              return e.stderr, -signal.SIGKILL
      finally:
          # Restore original executable and clean up wrapper
          # Only attempt restore if we actually moved the original
          if moved:
              try:
                  # Remove the wrapper and put the original back
                  # First, ensure wrapper exists before removing
                  if os.path.exists(wrapper_script):
                      try:
                          os.remove(wrapper_script)
                      except Exception:
                          # If removal fails, continue to avoid masking the main result
                          pass
                  # Move the backup back to the original path
                  if os.path.exists(backup_path):
                      try:
                          shutil.move(backup_path, original_path)
                      except Exception:
                          # As a fallback, copy back then remove backup
                          try:
                              shutil.copy2(backup_path, original_path)
                              os.remove(backup_path)
                          except Exception:
                              # If restore fails, raise to signal environment issue
                              raise
              except Exception:
                  # In case of unexpected cleanup issues, re-raise
                  raise
