target_path_constraint: |-
  Chronological, self-contained constraints to reach: if ((ix >>= 20) == 0) -> false in s_logb.c:logb

  1) Command invocation format:
  - The program is run via a shell with a single argument string appended to the executable name. Do not include additional spaces or arguments beyond the single numeric token. The harness executes:
    "./temp_executable 1.0"
  - Replace the numeric token (here shown as 1.0) with a value that is a valid textual representation of a finite, non-zero, normalized IEEE-754 double. The shell passes this as argv[1].

  2) Argument count constraint:
  - Exactly one command-line argument after the program name must be present: argc == 2.

  3) Parsing constraint:
  - The argument must be parsable by the C standard library function atof into a double value (ASCII/UTF-8 digits/sign/decimal point/exponent notation acceptable). No locale-dependent characters (e.g., comma as decimal separator).

  4) Value class constraints for logb to take the else branch (normalized number path):
  - Let x be the double produced by atof(argv[1]). It must satisfy all of the following:
    a) x is not zero: x != +0.0 and x != -0.0. (Avoid the (ix|lx)==0 path.)
    b) x is finite and not NaN or Infinity: |x| < +∞ and x is a number. (Avoid the ix >= 0x7ff00000 path.)
    c) x is normalized (not subnormal/denormal): the unbiased exponent E satisfies E ∈ [−1022, +1023], and the stored exponent field (11-bit) is neither all zeros nor all ones. Equivalently, the exponent bits are in 1..2046.
        - In IEEE-754 double: x is subnormal iff exponent bits == 0; normalized iff exponent bits ∈ [1, 2046]; infinity/NaN iff exponent bits == 2047.
    d) Consequently, the high 32-bit word’s exponent field after shifting 20 bits (ix >>= 20) is nonzero: (ix >> 20) != 0.

  5) Encoding/format specifics for input text:
  - Acceptable textual forms include optional leading sign (+/-), digits with optional decimal point, and optional exponent (e.g., e/E followed by optional sign and digits). Avoid hexadecimal float syntax unless known to be supported by atof; stick to decimal notation.
  - Whitespace around the token is permissible but should not introduce additional tokens; the entire argv[1] must be a single token representing x.

  6) Environment constraints:
  - No file I/O is used here; ensure normal process environment where atof behaves per C standard for default C locale (period as decimal separator). No environment variables should alter locale in ways that change atof behavior.

  These constraints ensure that when logb(x) executes, the expression (ix >>= 20) yields a nonzero value, taking the false branch of "if ((ix >>= 20) == 0)" and entering its else block.
