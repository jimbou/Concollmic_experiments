  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      # Ensure standard C locale so atof parses decimal dot correctly
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"

      try:
          # Use a single numeric token that is a finite, non-zero, normalized double
          # Here we choose 2.0 (normalized, finite, non-zero) to ensure (ix >> 20) != 0
          result = subprocess.run(
              ["./temp_executable 2.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
