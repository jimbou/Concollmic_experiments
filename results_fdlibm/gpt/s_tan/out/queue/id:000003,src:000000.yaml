  Chronological, external-input constraints to reach s_tan.c:tan branch `else if (ix >= 0x7ff00000)` -> true:

  1. Command invocation format:
     - The program is launched via a shell with a single argument string. The harness executes: `./temp_executable 1.0` using `shell=True`. This means the OS will parse the command line as a single shell command. To reach the target branch, the effective program invocation must be: `./temp_executable <ARG>` where `<ARG>` is one token supplied to the executable as its first argument.
     - Ensure exactly one user-supplied argument is passed to the executable at runtime (argc must be 2 in C: program name + one argument). The shell command must be constructed such that no extra tokens are introduced (e.g., no unintended quoting expansion that yields multiple arguments).

  2. Argument parsing requirement:
     - The program converts the argument string to a double using `atof(argv[1])`. `atof` follows C locale parsing rules: it accepts optional leading/trailing whitespace, an optional sign (+/-), decimal digits, an optional decimal point, an optional exponent part (e/E followed by an optional sign and digits), and certain special case keywords for non-finite values depending on implementation.

  3. Non-finite input requirement (to trigger ix >= 0x7ff00000):
     - The double value produced by `atof(argv[1])` must be non-finite: either positive infinity, negative infinity, or NaN (Not-a-Number). In IEEE-754 double precision, non-finite values have an exponent field of all ones (0x7ff) and thus the high 32-bit word (ix = __HI(x)) masked with 0x7fffffff is >= 0x7ff00000.
     - Therefore, constrain `<ARG>` such that `atof(<ARG>)` yields:
       a) Positive infinity, or
       b) Negative infinity, or
       c) NaN.

  4. Shell/locale considerations:
     - The argument must be a single token that `atof` recognizes as one of the above non-finite values. Avoid characters that the shell would expand or split into multiple arguments unless properly quoted such that the executable still receives a single argv[1] string.
     - No environment variable or locale changes are required; the default C locale is assumed. The constraint must hold under default parsing rules.

  5. Resulting path effects:
     - With `a0 = atof(argv[1])` being non-finite, calling `tan(a0)` will enter the branch `else if (ix >= 0x7ff00000)` -> true.

  These constraints focus solely on external inputs (the single command-line argument) and ensure the program follows the path into tan’s non-finite handling branch.
