  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      # Choose a non-finite token that atof parses to a non-finite double (Infinity)
      # This ensures tan() sees a non-finite x and the branch (ix >= 0x7ff00000) is true
      arg = "inf"

      # Ensure default C locale semantics so atof recognizes the token reliably
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LC_NUMERIC"] = "C"
      env["LANG"] = "C"

      try:
          result = subprocess.run(
              [f"./temp_executable {arg}"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
