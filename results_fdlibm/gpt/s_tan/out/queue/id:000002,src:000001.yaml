target_path_constraint: |-
  Chronological, self-contained constraints to reach tan() branch: else if (ix>=0x7ff00000) -> true (non-finite x)

  1) Process invocation and argument count
  - The program must be launched with exactly one user-supplied numeric argument in addition to the program name, so total argc == 2 at entry to main.
  - The shell or execution environment must pass argv[1] unchanged to the process; no quoting/expansion side effects should alter the token.

  2) Argument parsability by atof
  - argv[1] must be a string that the C standard library function atof converts to a non-finite double (IEEE-754): either positive/negative infinity or NaN. Examples of textual forms typically recognized by common libc implementations include case-insensitive tokens representing infinity (e.g., "inf", "+inf", "infinity", with optional sign) or Not-a-Number (e.g., "nan", optionally with a payload), but do not rely on implementation-specific payload details.
  - The string must not contain leading/trailing characters that cause atof to parse a finite number instead; it should be a canonical non-finite token so that the resulting double is not finite.

  3) Resulting floating-point value properties (post atof)
  - Let x = atof(argv[1]). The produced double must be either:
    a) Infinity: x is +∞ or -∞; or
    b) NaN: x is a quiet or signaling NaN (payload irrelevant). 
  - In IEEE-754 representation, this implies the high 32-bit word of x (on the target platform) has all exponent bits set (0x7ff00000 mask) when inspected by the tan implementation. Equivalently, x is not finite.

  4) Platform and locale assumptions
  - The locale must not redefine decimal/number parsing such that the selected non-finite token becomes unrecognized; use the default C locale semantics for atof.
  - No environment variables should coerce the program into treating the argument differently (e.g., no custom input files are read; only argv[1] matters).

  Satisfaction of these constraints ensures tan() receives a non-finite x so that the condition (ix >= 0x7ff00000) is true and execution enters the targeted branch.
