  Chronological, external-input constraints (program input and environment):

  1) Process invocation (command-line):
     - The program must be launched with exactly one command-line argument, in addition to argv[0] (the program name). Formally: argc == 2.

  2) Argument encoding and parsing by C atof:
     - The single argument (argv[1]) must be a byte string encoded as ASCII (or any superset such as UTF-8 where bytes for needed characters are identical to ASCII) that C’s atof/strtod recognizes as a valid non-finite floating-point literal, so that atof returns a non-finite double value.
     - The accepted canonical forms are implementation-defined but POSIX systems typically accept, case-insensitively, tokens like:
       • "inf", "+inf", "-inf", "infinity", "+infinity", "-infinity" for infinities; or
       • "nan" optionally followed by payload in parentheses, e.g., "nan", "NaN", "nan(payload)", where payload characters are alphanumerics and underscores.
     - No leading or trailing non-whitespace characters may be present except optional leading spaces or sign as allowed by atof. There must not be trailing extra non-space characters after the parsed token. Whitespace (spaces, tabs, newlines) is permitted around the token.
     - The resulting parsed double must be either Infinity (positive or negative) or NaN. This ensures the bit-pattern high word satisfies ix >= 0x7ff00000.

  3) Environment assumptions:
     - Locale: Use the C/POSIX locale semantics for atof so that alphabetic tokens for special values are recognized normally. Avoid locales that alter recognition of these tokens.
     - No environment variables or files influence parsing beyond standard C library behavior; ensure the runtime environment does not override locale to one where these tokens are not recognized.

  4) Additional constraints to avoid alternate branches before tan:
     - The argument must be non-empty and not a finite numeric literal; if it is finite (e.g., "0.0"), execution will go to finite branches and skip the target branch. Ensure it specifically encodes NaN or Infinity as described above.

  By satisfying these constraints, tan(a0) will be called with a non-finite a0, leading tan to take the else-if path that checks ix >= 0x7ff00000 and enter that branch.
