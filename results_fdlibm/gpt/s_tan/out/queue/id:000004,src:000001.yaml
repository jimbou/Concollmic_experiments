exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Use a single non-finite token recognized by C's atof/strtod
      # "inf" (ASCII) parses to +Infinity, ensuring ix >= 0x7ff00000 branch
      arg = "inf"

      # Ensure POSIX/C locale so alphabetic special tokens (inf/nan) are recognized
      # Modify environment variables only (program code/test harness remains unchanged)
      os.environ["LC_ALL"] = "C"
      os.environ["LANG"] = "C"
      os.environ["LC_NUMERIC"] = "C"

      try:
          result = subprocess.run(
              [f"./temp_executable {arg}"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Raise any other execution error
          raise e
