exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      try:
          # Ensure C locale numeric parsing and non-IEEE libm mode
          env = os.environ.copy()
          env.update({
              "LC_ALL": "C",
              "LANG": "C",
              # fdlibm/libm wrappers commonly honor LIBM env to choose mode: IEEE/POSIX/SVID
              # We need non-IEEE so that the wrapper does not fast-return before checking y == 0.0
              "LIBM": "POSIX",
          })

          # Invoke the executable with exactly two arguments after the program name
          # argv[1] = valid finite double string; argv[2] = string that parses to exactly 0.0
          # This ensures isnan(y) is false and y == 0.0 is true in remainder()
          cmd = "./temp_executable 1.0 0"
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return whatever stderr was captured and a killed code
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Propagate unexpected errors
          raise e
