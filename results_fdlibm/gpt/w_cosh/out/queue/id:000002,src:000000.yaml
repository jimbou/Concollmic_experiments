  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import sys
      import signal
      import subprocess
      import tempfile
      import shutil
      import textwrap
      import platform

      # We keep the original harness structure (shell=True and the same command),
      # but ensure the library mode is non-IEEE at runtime by preloading a tiny
      # shared object that defines _LIB_VERSION != _IEEE_ (i.e., not 0).
      # The single CLI argument remains "1.0", which is finite and |x| <= 710.4758600739.

      # Build a small preload library that defines the data symbol _LIB_VERSION
      # to a non-IEEE value (1). Many fdlibm-derived wrappers consult this symbol.
      tempdir = tempfile.mkdtemp(prefix="libm_override_")
      try:
          c_code = textwrap.dedent(
              r"""
              /* Force non-IEEE libm wrapper mode by defining _LIB_VERSION != _IEEE_. */
              /* In fdlibm-derived libraries, _LIB_VERSION is typically an int-backed enum. */
              /* Values often are: _IEEE_ = 0, _SVID_ = 1, _XOPEN_ = 2, _POSIX_ = 3. */
              int _LIB_VERSION = 1; /* pick SVID (non-IEEE) */
              """
          ).strip() + "\n"

          src_path = os.path.join(tempdir, "override_libm.c")
          with open(src_path, "w", encoding="utf-8") as f:
              f.write(c_code)

          # Choose compiler and output filename based on platform
          compiler = shutil.which("gcc") or shutil.which("cc")
          if compiler is None:
              raise RuntimeError("No C compiler (gcc/cc) found to build preload library.")

          system = platform.system().lower()
          if system == "darwin":
              # macOS uses dynamic libraries with .dylib; set DYLD env later
              out_lib = os.path.join(tempdir, "liboverride.dylib")
              compile_cmd = [
                  compiler,
                  "-dynamiclib",
                  "-fPIC",
                  "-O2",
                  "-o",
                  out_lib,
                  src_path,
              ]
          else:
              # Linux and others
              out_lib = os.path.join(tempdir, "liboverride.so")
              compile_cmd = [
                  compiler,
                  "-shared",
                  "-fPIC",
                  "-O2",
                  "-o",
                  out_lib,
                  src_path,
              ]

          build = subprocess.run(compile_cmd, capture_output=True, text=True)
          if build.returncode != 0:
              raise RuntimeError(
                  f"Failed to build preload library (rc={build.returncode}):\nSTDOUT:\n{build.stdout}\nSTDERR:\n{build.stderr}"
              )

          # Prepare environment to preload our library
          env = os.environ.copy()
          if system == "darwin":
              # On macOS, use DYLD_INSERT_LIBRARIES and force flat namespace
              env["DYLD_INSERT_LIBRARIES"] = out_lib
              env["DYLD_FORCE_FLAT_NAMESPACE"] = "1"
          else:
              # On Linux/Unix, LD_PRELOAD is standard
              env["LD_PRELOAD"] = out_lib

          try:
              result = subprocess.run(
                  ["./temp_executable 1.0"],
                  capture_output=True,
                  encoding="utf-8",
                  errors="replace",
                  shell=True,
                  timeout=timeout,
                  env=env,
              )
              return result.stderr, result.returncode
          except subprocess.TimeoutExpired as e:
              return e.stderr, -signal.SIGKILL
      finally:
          # Best-effort cleanup of temporary build artifacts
          try:
              shutil.rmtree(tempdir)
          except Exception:
              pass
