exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      try:
          # Ensure C locale so atof parses the numeric string predictably
          env = os.environ.copy()
          env["LC_ALL"] = "C"
          env["LANG"] = "C"

          # Execute with a single whitespace-separated numeric argument whose |x| > 710.475860073943863426
          # Here we use 711, which is safely above the threshold.
          result = subprocess.run(
              ["./temp_executable 711"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
