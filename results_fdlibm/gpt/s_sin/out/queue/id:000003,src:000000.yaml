  Constraints to reach the branch "else if (ix >= 0x7ff00000) -> true" in s_sin.c:sin(double):

  1) Command invocation and argument count
  - The program must be executed exactly with one user-supplied argument in addition to the program name so that argc == 2 holds. Under the provided harness, this is already satisfied by invoking: ./temp_executable <arg>.

  2) Argument parsing to double via C atof
  - The single command-line argument must be a textual representation that the C standard library function atof parses into a non-finite IEEE-754 double value (Infinity or NaN). Examples of accepted textual forms (case-insensitive and with optional leading/trailing spaces) per typical libc behavior include:
    - "inf", "+inf", "-inf", "infinity", "+infinity", "-infinity" → parses to ±Infinity
    - "nan", "nan(...)" (payload ignored) → parses to NaN
  - The exact accepted spellings depend on the C library but generally include the above; ensure the string is one of those canonical forms.

  3) Numeric condition on parsed value ensuring ix >= 0x7ff00000
  - Let x be the resulting double after atof conversion.
  - The code computes ix = __HI(x) & 0x7fffffff, i.e., the absolute-value high 32 bits of the IEEE-754 binary64.
  - For all NaN and Infinity values, ix will be >= 0x7ff00000, satisfying the target branch condition.
  - Therefore, require x to be either NaN or Infinity after parsing.

  4) Environmental/encoding constraints
  - The argument string must be encoded in UTF-8 (the harness sets encoding="utf-8" but this only affects Python capturing; the C program reads argv as bytes). Avoid embedded NUL bytes, as they would terminate the string early.
  - No file I/O or environment variables are involved; only the single command-line argument is relevant.

