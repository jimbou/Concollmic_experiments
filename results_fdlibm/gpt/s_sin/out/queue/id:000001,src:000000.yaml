  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Use a single numeric argument strictly greater than ~pi/4 to trigger argument reduction in sin()
      # 0.9 is finite, parses as a valid double, and |0.9| > 0.785398...
      try:
          result = subprocess.run(
              ["./temp_executable 0.9"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
