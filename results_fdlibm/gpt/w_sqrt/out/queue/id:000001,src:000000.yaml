  Chronological constraints to reach the branch `if (x < 0.0)` -> true inside sqrt in w_sqrt.c:

  1) Process invocation via the existing harness:
     - The program is launched exactly as: shell executes `./temp_executable 1.0` (a single command string), which causes the executable to be invoked with one command-line argument token `"1.0"`.
     - Because the program checks `argc == 2`, ensure the invocation results in two arguments: the program name and exactly one argument string. No additional shell splitting that would introduce extra arguments.

  2) Environment and library mode requirement (to avoid early IEEE short-circuit):
     - The math library’s global error-handling mode must NOT be the IEEE mode. Specifically, ensure `_LIB_VERSION != _IEEE_` when the process starts. This must be achieved by environment or build/link configuration, not by modifying program source:
       a) Use a runtime environment where fdlibm is compiled/linked with non-IEEE error handling enabled (e.g., `_LIB_VERSION` initialized to a non-IEEE value like `_SVID_`).
       b) Do NOT define `_IEEE_LIBM` at compile-time for the linked libm. If `_IEEE_LIBM` is defined, the sqrt wrapper will return early and the target branch cannot be reached.
     - No environment variable is consumed directly by the program, but the runtime/link configuration must ensure the above condition holds.

  3) Argument parsing constraint (to set x < 0.0):
     - The single argument must be a valid textual representation of a floating-point number such that `atof(argv[1])` yields a strictly negative finite value. Formally: x = atof(arg) with x < 0.0 and isfinite(x) == true.
     - The string must not be NaN or an IEEE infinity representation to avoid the earlier `isnan(x)` check taking effect; it must parse as a finite negative number.

  4) Combined path guard constraints inside sqrt:
     - With the environment from step 2, the check `(_LIB_VERSION == _IEEE_ || isnan(x))` must evaluate to false:
       a) `_LIB_VERSION != _IEEE_`.
       b) `isnan(x) == false`.
     - The subsequent condition `x < 0.0` must evaluate to true: `x < 0.0`.

  Satisfying the above constraints guarantees control reaches the negative-input branch body in sqrt, thereby executing line 22 (`return __kernel_standard(x,x,26);`).
