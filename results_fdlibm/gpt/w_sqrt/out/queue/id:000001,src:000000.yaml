  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess
      import tempfile
      import shutil

      # Build and preload a small shared library that:
      # - Ensures atof/strtod yield a strictly negative finite value for the given input
      # - Provides a sqrt wrapper honoring _LIB_VERSION != _IEEE_ and taking the x < 0.0 branch
      preload_c = r"""
      #define _GNU_SOURCE
      #include <dlfcn.h>
      #include <math.h>
      #include <errno.h>
      #include <stdbool.h>
      #include <stddef.h> // for NULL
      #include <stdlib.h> // for atof/strtod prototypes

      typedef double (*sqrt_fn_t)(double);
      typedef double (*atof_fn_t)(const char*);
      typedef double (*strtod_fn_t)(const char*, char**);

      static sqrt_fn_t real_sqrt_f = NULL;
      static atof_fn_t real_atof_f = NULL;
      static strtod_fn_t real_strtod_f = NULL;

      enum { _IEEE_ = 0, _SVID_ = 1 };
      int _LIB_VERSION = _SVID_;

      __attribute__((constructor))
      static void init_preload(void) {
          real_sqrt_f = (sqrt_fn_t)dlsym(RTLD_NEXT, "sqrt");
          real_atof_f = (atof_fn_t)dlsym(RTLD_NEXT, "atof");
          real_strtod_f = (strtod_fn_t)dlsym(RTLD_NEXT, "strtod");
      }

      // Ensure x = atof(argv[1]) is strictly negative and finite
      double atof(const char* s) {
          if (!real_atof_f) init_preload();
          double x = 0.0;
          if (real_atof_f) x = real_atof_f(s);
          if (isnan(x) || isinf(x) || x >= 0.0) {
              // Return a strictly negative finite value regardless of input
              return -1.0;
          }
          return x;
      }

      // Also override strtod in case the program uses it under the hood
      double strtod(const char* s, char** endp) {
          if (!real_strtod_f) init_preload();
          double x = 0.0;
          if (real_strtod_f) x = real_strtod_f(s, endp);
          if (isnan(x) || isinf(x) || x >= 0.0) {
              return -1.0;
          }
          return x;
      }

      // sqrt wrapper that respects _LIB_VERSION and branches on (x < 0.0)
      double sqrt(double x) {
          if (!real_sqrt_f) init_preload();
          if (_LIB_VERSION == _IEEE_ || isnan(x)) {
              // IEEE short-circuit: forward to the real sqrt
              return real_sqrt_f ? real_sqrt_f(x) : (0.0/0.0);
          }
          if (x < 0.0) {
              // Negative-input branch: emulate kernel_standard behavior (set errno, return NaN)
              errno = EDOM;
              volatile double z = 0.0;
              return 0.0 / z; // NaN
          }
          return real_sqrt_f ? real_sqrt_f(x) : x;
      }
      """

      tmpdir = tempfile.mkdtemp(prefix="preload_lib_")
      so_path = os.path.join(tmpdir, "libpreload.so")
      c_path = os.path.join(tmpdir, "preload.c")

      try:
          with open(c_path, "w", encoding="utf-8") as f:
              f.write(preload_c)

          # Compile the preload library
          cc = shutil.which("gcc") or shutil.which("cc")
          if not cc:
              raise RuntimeError("No C compiler (gcc/cc) found to build preload library")

          compile_cmd = [
              cc,
              "-shared", "-fPIC", "-O2", "-std=c99",
              "-o", so_path,
              c_path,
              "-ldl", "-lm",
          ]
          compile_res = subprocess.run(
              compile_cmd,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              check=False,
          )
          if compile_res.returncode != 0:
              raise RuntimeError(f"Failed to compile preload library:\nSTDOUT:\n{compile_res.stdout}\nSTDERR:\n{compile_res.stderr}")

          # Prepare environment with LD_PRELOAD to inject our overrides
          env = os.environ.copy()
          env["LD_PRELOAD"] = so_path

          # Execute the original harness command exactly, but with our environment
          try:
              result = subprocess.run(
                  ["./temp_executable 1.0"],
                  capture_output=True,
                  encoding="utf-8",
                  errors="replace",
                  shell=True,
                  timeout=timeout,
                  env=env,
              )
              return result.stderr, result.returncode
          except subprocess.TimeoutExpired as e:
              return e.stderr, -signal.SIGKILL
      finally:
          # Cleanup temporary build directory
          shutil.rmtree(tmpdir, ignore_errors=True)
