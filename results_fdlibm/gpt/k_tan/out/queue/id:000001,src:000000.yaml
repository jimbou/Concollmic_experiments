  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Use concrete values that satisfy the target path constraints:
      # argv[1] (a0): +0.0 -> ensures ix == 0, __LO(x) == 0, (int)x == 0
      # argv[2] (a1): any valid float, choose 1.0
      # argv[3] (a2): -1 -> ensures (iy + 1) == 0
      cmd = "./temp_executable 0.0 1.0 -1"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred; return stderr captured before timeout and return code -SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Raise the error if run failed
          raise e
