  A. Command-line arity
  - There must be exactly three arguments provided to the executable (aside from the program name). This ensures argc == 4 and bypasses the argument-count error branch in main.

  B. Parsing feasibility
  - argv[1] must be a valid string representation of a finite double value (IEEE-754 binary64) accepted by atof (no NaN/Inf forms needed). Denote this parsed value as x.
  - argv[2] must be a valid string representation of a finite double value, parsed by atof. Denote this parsed value as y.
  - argv[3] must be a valid base-10 integer string parseable by atoi. Denote this parsed value as iy.

  C. Enter the tiny-|x| fast path
  - Let hx = high 32-bit word of x in IEEE-754 binary64, and ix = hx & 0x7fffffff. The condition ix < 0x3e300000 must hold. This is equivalent to |x| < 2^-28 (approximately 3.7252902985e-09) OR x is a subnormal whose magnitude is less than that threshold. Practically: require |x| < 2^-28.

  D. Ensure (int)x == 0 in C conversion semantics
  - The cast (int)x uses truncation toward zero. For it to equal 0, require -1 < x < 1. This is implied by C (int) conversion. Together with C, this is already guaranteed by C, but state explicitly: require |x| < 1.

  E. Force the inner condition to be FALSE so that the else-body executes
  - The inner condition is ((ix | __LO(x)) | (iy + 1)) == 0. Here __LO(x) is the low 32-bit word of x. This condition equals true only when all three components are simultaneously zero: ix == 0, __LO(x) == 0, and (iy + 1) == 0.
