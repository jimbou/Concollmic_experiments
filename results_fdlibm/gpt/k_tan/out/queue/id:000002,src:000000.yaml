  - Provide exactly three arguments.
  - x (argv[1]) parses to a finite double with 0 < |x| < 2^-28.
  - y (argv[2]) parses to any finite double (no special range constraints).
  - iy (argv[3]) parses to an integer not equal to -1 (e.g., any integer except -1).
  - Implicitly, these ensure (int)x == 0 and the tiny-|x| path is taken, and the tested condition evaluates to false so the uncovered else-body executes.
