  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Chosen concrete inputs to satisfy constraints:
      # - x = 1e-9 (0.000000001): finite, nonzero, and 0 < |x| < 2^-28 (~3.725e-9)
      #   ensures tiny-|x| path, (int)x == 0, and ix|__LO(x) != 0
      # - y = 0.0: any finite double is acceptable
      # - iy = 1: iy != -1 ensures the inner condition is FALSE; also matches common return path
      cmd = "./temp_executable 1e-9 0.0 1"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
