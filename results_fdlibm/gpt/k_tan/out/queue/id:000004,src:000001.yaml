  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Use concrete values that satisfy the target path constraints:
      # - x = 0.1  => finite, and 2^{-28} <= |x| < 0.673 (avoids tiny-x early return and large-|x| paths)
      # - y = 1.0  => finite double
      # - iy = 0   => integer not equal to 1, ensuring (iy == 1) is false -> else-branch
      # Also, with x = 0.1, the conjunction in step 3 is broken because |x| is not tiny.
      cmd = "./temp_executable 0.1 1.0 0"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred; return stderr captured before timeout and return code -SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Raise the error if run failed
          raise e
