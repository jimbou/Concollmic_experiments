  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Concrete values chosen to satisfy constraints:
      # argv[1] (x) = 1e-9 -> finite, |x| < 2^-26 (~1.49e-8), non-zero, and (int)x == 0
      # argv[2] (y) = 0.0 -> finite
      # argv[3] (iy) = 1 -> integer == 1 to take the target branch
      # This ensures argc == 4 and the iy == 1 branch is taken in __kernel_tan within the small-|x| path.
      try:
          result = subprocess.run(
              ["./temp_executable 1e-9 0.0 1"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and a negative return code indicating SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Raise the error if run failed
          raise e
