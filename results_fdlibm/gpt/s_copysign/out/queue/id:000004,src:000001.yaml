exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import shlex

      # We need argc == 3: program path + two numeric args acceptable by atof
      # Choose two well-formed double literals
      args = [
          "./temp_executable",
          "3.14159",
          "-2.71828e1",
      ]

      # Because the original used shell=True, build a safe shell command string
      cmd = " ".join(shlex.quote(a) for a in args)

      try:
          result = subprocess.run(
              cmd,
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
