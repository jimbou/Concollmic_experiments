exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Goal: Make argc != 3 by providing three user arguments after the program name
      # Original was: ./temp_executable 1.0 1.0  (argc == 3)
      # New command:  ./temp_executable 1.0 1.0 extra  (argc == 4)
      try:
          result = subprocess.run(
              ["./temp_executable 1.0 1.0 extra"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
