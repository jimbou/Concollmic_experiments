  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      # We choose x = 1.5, which is a finite, strictly positive, normalized double.
      # After internal normalization to exponent 0x3ff, its mantissa is 1.5 (fraction 0.5),
      # ensuring the high 20 fraction bits are not all zero (hx >= 1), so the target branch
      # condition becomes FALSE. This also trivially satisfies |x - 1.0| >= 2 * ulp(1.0).
      # Use C/POSIX locale to avoid any locale-related parsing issues.
      try:
          env = os.environ.copy()
          env["LC_ALL"] = "C"
          env["LANG"] = "C"
          env["LC_NUMERIC"] = "C"

          result = subprocess.run(
              ["./temp_executable 1.5"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
