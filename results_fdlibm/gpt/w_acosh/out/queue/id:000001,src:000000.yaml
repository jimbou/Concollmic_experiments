exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # We ensure:
      # - argc == 2 via one numeric argument (X = 1.0, finite and not NaN)
      # - X >= 1.0 to take the else-branch of (x < 1.0)
      # - Set libm mode to a non-IEEE variant via environment variables commonly used by fdlibm-based builds
      #   (these are harmless if not recognized and satisfy the constraint when honored)
      env = os.environ.copy()
      env_updates = {
          # Prefer POSIX/SVID-style error handling over IEEE short-circuit
          "LIBM_MODE": "POSIX",
          "FDLIBM_MODE": "POSIX",
          "_LIB_VERSION": "POSIX",
          "LIBM_VERSION": "POSIX",
          # Some builds consult this for math error behavior; keep disabled to avoid IEEE shortcuts
          "MATH_ERREXCEPT": "0",
      }
      env.update(env_updates)

      try:
          # Keep the original test harness structure: invoke the executable with exactly one argument
          # Use shell=True with a single string as in the original execution
          result = subprocess.run(
              ["./temp_executable 1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
