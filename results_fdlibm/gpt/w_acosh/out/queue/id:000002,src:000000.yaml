exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # We provide exactly one numeric argument strictly less than 1.0 (e.g., 0.5)
      # Ensure standard C locale so atof parses with '.' as decimal separator
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"
      # Optionally hint non-IEEE behavior if respected by the build/runtime (harmless if ignored)
      env["LIBM_MODE"] = "SVID"

      try:
          result = subprocess.run(
              ["./temp_executable 0.5"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
