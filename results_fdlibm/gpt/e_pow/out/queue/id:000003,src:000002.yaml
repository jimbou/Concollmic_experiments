exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Concrete inputs to satisfy the target path:
      # - y is exactly a floating-point zero to make (iy | ly) == 0 true.
      #   Using "-0" ensures atof parses to -0.0 (signed zero), which still
      #   satisfies the condition because the implementation masks the sign bit.
      # - x is any finite double; choose 2.718281828 for simplicity.
      cmd = "./temp_executable 2.718281828 -0"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
