justification: 'Zero-coverage special-case branch for y == ±0.0 (line cov: 0/1, 0%).
  This is a fundamental path in pow(x, y) that short-circuits early and is not covered
  at all by existing tests. Hitting it increases coverage of the core edge-case handling
  without depending on deeper math code. It is reachable via command-line inputs (set
  the second argument to represent ±0.0).'
target_path_constraint: |-
  Objective: Drive execution in __ieee754_pow to the early-return branch guarded by the condition (iy | ly) == 0, which is true exactly when the exponent y is a floating-point zero (+0.0 or -0.0).

  Program interface and inputs:
  - The executable is invoked via a shell with two command-line arguments representing decimal floating-point numbers x and y, respectively. The program parses them using the C library function atof, converting the strings to double-precision (IEEE-754 binary64) values. No localization is assumed; decimal point is '.'.

  Chronological constraints on inputs and environment:
  1) Process invocation arity
     - The program must be launched with exactly three argv entries: argv[0] is the program path, argv[1] is the base x value string, and argv[2] is the exponent y value string. From the harness perspective, ensure exactly two user-supplied arguments are provided.

  2) Argument parseability
     - Both argv[1] and argv[2] must be valid strings that atof can parse into finite double values (no need to restrict x; y must parse as a zero value). Avoid locale-dependent formats (use '.' as decimal separator; optional leading sign allowed; optional exponent part allowed but must evaluate to zero for y).

  3) Exponent y equals signed zero (to satisfy (iy | ly) == 0)
     - Constraint on argv[2]: When converted by atof to an IEEE-754 binary64 value, the result must be exactly +0.0 or -0.0. This ensures both the high word (iy) and low word (ly) of y are zero, making (iy | ly) == 0 true.
     - Acceptable lexical forms include numeric strings that evaluate to zero under atof, e.g., optional sign followed by zeros and optional fractional zeros; optional exponent part whose numeric value keeps the overall numeric value at zero. Examples are not required, but any format that atof recognizes as zero is acceptable, including representations of signed zero.

  4) Base x may be any finite double (no special constraints)
     - argv[1] must parse to any finite non-NaN, non-infinite double. While the branch condition does not explicitly require this, it avoids short-circuiting by earlier NaN/Inf checks which occur after the zero-exponent check only if the zero-exponent check fails. Because the zero-exponent check occurs before NaN/Inf checks, x can be arbitrary; however, to ensure deterministic reaching of the branch without invoking undefined parsing, select an atof-parsable finite numeric string for x.

  5) Environment
     - No files are read. No special environment variables or permissions are required. Standard C locale behavior for atof should be assumed ('.' as decimal separator). Shell must pass arguments unchanged to main.

  Summary of semantic relation required:
  - Let parse(y_str) denote atof(argv[2]). Require parse(y_str) == +0.0 or parse(y_str) == -0.0. No additional relationship between x and y is necessary to reach the target branch.
