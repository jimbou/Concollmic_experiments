  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Chosen concrete input:
      # x = 1048575 (an exact integer, 1 <= |x| < 2^20)
      # - Satisfies: finite, decimal atof-parsable, single token
      # - Ensures j0 in [0,19] and integer sub-branch ((i0 & i) | i1) == 0
      cmd = "./temp_executable 1048575 "

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
