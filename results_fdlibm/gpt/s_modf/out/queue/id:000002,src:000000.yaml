exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # We choose x = 1.5 to satisfy all constraints:
      # - Finite, normalized double
      # - 1 <= |x| < 2^20
      # - Non-integer (fractional part is 0.5, exact in binary and decimal)
      # Invocation preserves format: single executable path followed by ONE numeric token
      try:
          result = subprocess.run(
              ["./temp_executable 1.5"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          raise e
