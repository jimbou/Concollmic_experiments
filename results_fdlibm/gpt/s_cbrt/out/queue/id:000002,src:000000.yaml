  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Chosen argument: "1.0"
      # Justification:
      # - isfinite(1.0) == True
      # - 1.0 != 0.0
      # - |1.0| >= DBL_MIN and <= DBL_MAX (normal, finite double)
      # - Cleanly parsed by C's atof under default locale (ASCII digits, decimal point)
      # - Satisfies the path predicate to take the normal-number initialization branch

      try:
          result = subprocess.run(
              ["./temp_executable 1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
