  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      # Concrete input satisfying constraints:
      # - Single numeric argument, non-negative, finite double
      # - 0.84375 <= x < 1.25; choose x = 1.0 (within mid-range, ensures ix in [0x3feb0000, 0x3ff40000))
      cmd = "./temp_executable 1.0"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and return code -SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Ensure to raise the error if run failed
          raise e
