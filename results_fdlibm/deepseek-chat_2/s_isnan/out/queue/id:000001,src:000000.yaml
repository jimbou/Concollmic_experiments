  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Execute with separate arguments instead of shell=True
          # Using "1.0" as a valid floating-point number that can be parsed by atof
          result = subprocess.run(
              ["./temp_executable", "1.0"],  # Separate arguments: program name and float string
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed from shell=True to shell=False
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
