  1. Command-Line Arguments: argc == 2 (program must be called with exactly one argument after the program name)

  2. Argument Format: The first argument (argv[1]) must be a string that represents a floating-point number where the IEEE 754 double-precision representation has the exponent field set to 0x7ff (all ones), indicating either infinity or NaN.

  3. Specific Value Constraint: The input value must satisfy that when converted to double-precision floating-point format:
     - The high 32 bits (excluding the sign bit) have the value 0x7ff00000 or greater
     - This corresponds to values that are either positive infinity, negative infinity, or NaN (Not a Number)

  4. Mathematical Constraint: The input value x must be such that:
     - x = +∞, x = -∞, or x is NaN
     - In IEEE 754 double-precision format, this means the exponent field (bits 52-62) is all ones (0x7ff)

  5. Input Examples (for understanding, not for constraint solving):
     - Positive infinity: 1.0 / 0.0
     - Negative infinity: -1.0 / 0.0  
     - NaN: 0.0 / 0.0 or sqrt(-1.0)
