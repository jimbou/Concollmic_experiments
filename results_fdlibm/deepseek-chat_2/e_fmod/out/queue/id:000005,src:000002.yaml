  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified command-line arguments to satisfy the target path constraint:
          # First argument (argv[1]) = 0.0 (zero)
          # Second argument (argv[2]) = 1.0 (non-zero)
          # This satisfies the constraint that:
          # - argc == 3 (program name plus exactly 2 arguments)
          # - argv[1] is zero (0.0)
          # - argv[2] is non-zero (1.0)
          # - Both are finite numbers (not NaN/Infinity)
          result = subprocess.run(
              ["./temp_executable", "0.0", "1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
