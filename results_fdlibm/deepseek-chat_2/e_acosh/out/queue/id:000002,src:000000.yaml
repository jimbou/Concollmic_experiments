  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to satisfy the path constraints:
          # 1. argc == 2 (program name + 1 argument)
          # 2. Argument must parse to infinity or NaN via atof()
          # Using "inf" which atof() parses to positive infinity
          result = subprocess.run(
              ["./temp_executable", "inf"],  # Changed to proper argument format
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed to False to properly pass arguments
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
