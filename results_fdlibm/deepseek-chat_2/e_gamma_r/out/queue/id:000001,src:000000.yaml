     - Mathematical constraint: x ∈ {..., -3, -2, -1}
     - The value must be exactly representable as a negative integer in double-precision floating point
     - Examples: -1.0, -2.0, -3.0 (but not -1.5 or -2.3)

  3. Input Parsing: The string representation of <x> must be successfully parsed by `atof()` function into a negative integer value
