justification: The gamma function has poles at negative integers where it becomes
  undefined. The implementation likely contains special handling for these cases that
  hasn't been exercised by the current test with input 1.0. This is a mathematically
  important edge case that would reveal error handling or special computation paths
  within the gamma function implementation. Since I cannot see the actual implementation,
  I'm selecting this based on mathematical properties of the gamma function.
