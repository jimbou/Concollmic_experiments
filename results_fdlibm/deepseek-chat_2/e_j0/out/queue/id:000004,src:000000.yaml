  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Execute with exactly 2 arguments: program name and input value
          # Using "inf" as the input value which atof() will parse to infinity (exponent field 0x7ff)
          result = subprocess.run(
              ["./temp_executable", "inf"],  # Two arguments: program name and "inf"
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Use shell=False to pass arguments separately
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
