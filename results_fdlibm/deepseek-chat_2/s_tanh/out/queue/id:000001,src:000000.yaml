exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to pass "inf" as the argument, which satisfies:
          # 1. argc == 2 (program name + "inf")
          # 2. "inf" represents infinity (floating-point value)
          # 3. IEEE 754 representation has exponent field 0x7FF
          # 4. atof() successfully parses "inf" as infinity
          result = subprocess.run(
              ["./temp_executable", "inf"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed to shell=False for safer argument passing
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
