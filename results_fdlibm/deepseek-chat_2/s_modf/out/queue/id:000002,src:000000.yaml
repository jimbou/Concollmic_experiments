  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use separate arguments instead of shell=True to ensure proper argc counting
          # The argument "1.5" satisfies all floating-point constraints:
          # - Valid double that can be parsed by atof()
          # - j0 = 0 (exponent 1023 - 1023), which satisfies 0 ≤ j0 < 20
          # - Non-zero fractional part (0.5)
          result = subprocess.run(
              ["./temp_executable", "1.5"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Use shell=False for proper argument parsing
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
