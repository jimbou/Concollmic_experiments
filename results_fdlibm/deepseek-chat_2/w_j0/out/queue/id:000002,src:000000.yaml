  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to satisfy the constraint: argc != 2
          # Current execution: "./temp_executable 1.0" (argc = 2)
          # Option 1: Remove argument (argc = 1)
          # Option 2: Add arguments (argc ≥ 3)
          # I'll choose option 2 - add one more argument to make argc = 3
          result = subprocess.run(
              ["./temp_executable 1.0 additional_arg"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
