exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use "inf" as the argument to satisfy the constraint ix >= 0x7ff00000
          # "inf" represents positive infinity in IEEE 754 double format, which has 
          # the exponent field (bits 52-62) set to all 1s (0x7ff)
          result = subprocess.run(
              ["./temp_executable", "inf"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed to shell=False for safer argument passing
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
