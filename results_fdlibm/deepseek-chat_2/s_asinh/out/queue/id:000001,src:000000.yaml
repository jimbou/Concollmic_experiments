target_path_constraint: |-
  1. Command-Line Argument: The program must be executed with exactly one argument (argc == 2)
  2. Input Value Constraint: The command-line argument must represent a double-precision floating-point value that satisfies ix >= 0x7ff00000, where ix = (hx & 0x7fffffff) and hx is the high 32 bits of the IEEE 754 double representation.

  Specifically, the input must be one of:
  - Positive infinity (represented as "inf", "INF", or a sufficiently large value that overflows to infinity)
  - Negative infinity ("-inf", "-INF")
  - A NaN (Not-a-Number) value (represented as "nan", "NAN", "NaN")

  In IEEE 754 double format, the exponent field (bits 52-62) must be all 1s (0x7ff) for the condition to be true. This corresponds to special values where the exponent is maximum and the significand determines whether it's infinity or NaN.
