exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to use only 1 argument (program name) instead of 2 arguments
          # This satisfies the constraint argc ≠ 2
          result = subprocess.run(
              ["./temp_executable"],  # Just the program name, no additional arguments
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed to shell=False for better security and control
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
