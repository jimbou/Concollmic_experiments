exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Execute with argc = 2 (program name + 1 argument)
          # Use a large floating-point value that exceeds typical X_TLOSS thresholds
          # 1e20 is larger than typical X_TLOSS values (which are usually 1e16-1e18)
          result = subprocess.run(
              ["./temp_executable", "1e20"],  # Added argument to make argc = 2
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
