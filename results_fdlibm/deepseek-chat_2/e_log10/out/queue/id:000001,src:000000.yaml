  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          result = subprocess.run(
              ["./temp_executable", "-1.0"],  # Changed to pass program and negative float as separate arguments
              capture_output=True,
              encoding="utf-8",
              errors="replace",
