exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use "1.0" as the argument - this satisfies all constraints:
          # - Non-zero finite double value
          # - Normalized number (hx >= 0x00100000 and < 0x7ff00000)
          # - Exponent between -1022 and 1023
          # - Parseable by atof()
          result = subprocess.run(
              ["./temp_executable", "1.0"],  # Changed to use separate arguments and value "1.0"
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
