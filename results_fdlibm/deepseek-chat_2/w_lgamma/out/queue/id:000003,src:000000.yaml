     a. x is finite (not NaN or infinity)
     b. The lgamma(x) function returns a non-finite result (either infinity or NaN)
     c. x is NOT a non-positive integer (floor(x) != x OR x > 0.0)

  3. Mathematical Condition: The input value x must cause the gamma function to overflow or underflow while remaining finite itself. This typically occurs for:
     - Very large positive values (causing overflow)
     - Values very close to but not exactly at the poles of the gamma function (which occur at non-positive integers)
     - Values that cause numerical instability in the calculation

  Specifically, to satisfy the branch condition:
     - finite(x) = true
     - finite(lgamma(x)) = false
     - floor(x) != x OR x > 0.0
