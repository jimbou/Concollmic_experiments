target_path_constraint: |-
  1. Command-Line Arguments: argc == 3 (program name plus two arguments)
  2. Argument Format: Both arguments must be valid floating-point numbers that can be parsed by atof()
  3. NaN/Infinity Constraint: At least one of the two arguments must represent a NaN (Not a Number) or infinity value in IEEE 754 double-precision floating-point format:
     - For NaN: The exponent field (bits 62-52) must be all 1s (0x7FF) and the significand (bits 51-0) must be non-zero
     - For Infinity: The exponent field must be all 1s (0x7FF) and the significand must be all 0s
     - The sign bit (bit 63) can be 0 or 1 for both cases

  Specifically, the condition requires that either:
     - The high word of x (hx) with sign bit masked (ix = hx & 0x7fffffff) has exponent > 0x7ff00000, OR
     - The high word of y (hy) with sign bit masked (iy = hy & 0x7fffffff) has exponent > 0x7ff00000

  This can be achieved by providing arguments like:
     - "NaN 1.0" or "1.0 NaN"
     - "Infinity 1.0" or "1.0 Infinity" 
     - "NaN NaN"
     - Or any combination where at least one argument represents an IEEE 754 NaN or infinity
