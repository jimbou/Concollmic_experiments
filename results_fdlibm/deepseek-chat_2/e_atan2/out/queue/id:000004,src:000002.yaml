  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use the concrete values that satisfy the constraints:
          # - argc == 3 (program name plus two arguments)
          # - Both arguments are valid floating-point numbers
          # - At least one argument is NaN or Infinity ("NaN" satisfies this)
          result = subprocess.run(
              ["./temp_executable", "NaN", "1.0"],  # Pass arguments as separate list elements
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Use shell=False to ensure proper argument counting
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
