  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified command to include a special floating-point value as argument
          # Using "inf" which represents positive infinity and satisfies the constraint
          # The high 32 bits of IEEE 754 representation for infinity have exponent field 0x7ff00000
          result = subprocess.run(
              ["./temp_executable", "1.0", "inf"],  # Added "inf" as the required argument
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed to shell=False for safety with list arguments
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
