  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified command to satisfy the constraints:
          # - argc == 2 (program name + 1 argument)
          # - argv[1] must be "inf" (or other special floating-point value)
