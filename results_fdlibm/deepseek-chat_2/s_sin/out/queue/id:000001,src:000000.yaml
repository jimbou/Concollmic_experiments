  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # The program must be executed with exactly one argument after the program name
          # The input value must satisfy: 0x3fe921fb < (__HI(x) & 0x7fffffff) < 0x7ff00000
          # This corresponds to values with absolute value > π/2 (~1.5708)
          # Using 2.0 as it satisfies the constraint
          result = subprocess.run(
              ["./temp_executable 1.0", "2.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
