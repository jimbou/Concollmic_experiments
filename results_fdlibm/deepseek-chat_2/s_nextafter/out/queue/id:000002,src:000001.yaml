target_path_constraint: |-
  1. Command-Line Arguments: argc == 3 (program name plus two floating-point arguments)

  2. Input Format: Both command-line arguments must be valid string representations of floating-point numbers that can be parsed by atof()

  3. Special Floating-Point Values: At least one of the two input values must be either:
     - NaN (Not-a-Number) - any representation that results in the IEEE 754 NaN bit pattern
     - Infinity (positive or negative) - any representation that results in the IEEE 754 infinity bit pattern
     
     Specifically, the condition requires that either:
     - The first argument (x) has its high word (hx) with exponent bits >= 0x7ff00000 AND either the exponent is exactly 0x7ff00000 with non-zero mantissa (signaling NaN) or the exponent > 0x7ff00000 (quiet NaN/infinity)
     - The second argument (y) has its high word (hy) with exponent bits >= 0x7ff00000 AND either the exponent is exactly 0x7ff00000 with non-zero mantissa (signaling NaN) or the exponent > 0x7ff00000 (quiet NaN/infinity)

  4. String Representations: The input strings should be valid representations that atof() will parse as NaN or infinity, such as:
     - "nan", "NaN", "NAN" for NaN values
     - "inf", "infinity", "INF", "INFINITY" for infinity values
     - Optionally with sign prefixes: "+inf", "-inf", "+nan", "-nan"
