exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use one NaN value and one normal floating-point number
          # This satisfies the target path constraint:
          # - argc == 3 (program name plus two arguments)
          # - Both are valid floating-point strings that atof() can parse
          # - First argument is NaN (special floating-point value)
          # - Second argument is a normal finite number
          result = subprocess.run(
              ["./temp_executable", "nan", "1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
