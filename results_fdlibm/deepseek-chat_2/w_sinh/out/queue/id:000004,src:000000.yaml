  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified command: use "711.0" as the argument to cause sinh overflow
          # This satisfies the constraints: finite(711.0) = true AND finite(sinh(711.0)) = false
          # Command-line argument count: argc == 2 (program name + "711.0")
          result = subprocess.run(
              ["./temp_executable 711.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
