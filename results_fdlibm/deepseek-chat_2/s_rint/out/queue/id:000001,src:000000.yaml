  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to pass 0.5 as the argument instead of 1.0
          # 0.5 satisfies all constraints: it's a valid floating-point number in (0, 1.0)
          # which means j0 < 0 when passed to rint()
          result = subprocess.run(
              ["./temp_executable", "0.5"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed to shell=False for security and proper argument handling
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
