target_path_constraint: |-
  1. Command-Line Arguments: The program must be executed with exactly one argument (in addition to the program name). This means argc == 2, where argv[0] is the program name and argv[1] is the input value.

  2. Argument Format: The argument argv[1] must be a valid string representation of a floating-point number that can be successfully parsed by atof(). This includes formats like "1.5", "-0.75", "2", etc.

  3. Mathematical Constraint: The parsed floating-point value must have an absolute value greater than 1.0. This means either:
     - The value is greater than 1.0 (e.g., 1.1, 2.5, 100.0)
     - The value is less than -1.0 (e.g., -1.1, -2.5, -100.0)

  These constraints ensure that:
  - The program proceeds past the argc check
  - The input is successfully converted to a double
  - The asin function receives a value outside its valid domain [-1, 1], triggering the target branch
