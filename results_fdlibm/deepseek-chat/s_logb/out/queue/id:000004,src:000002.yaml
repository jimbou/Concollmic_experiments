     - NaN (Not a Number): represented as a value where the exponent bits are all 1s and the significand is non-zero

  3. Specific IEEE 754 Representation: The input value must have its IEEE 754 double-precision representation where the 11-bit exponent field (bits 52-62) equals 0x7FF (all bits set to 1). This corresponds to the condition `ix >= 0x7ff00000` in the code, where `ix` is the high 32 bits of the double value with the sign bit masked out.

  4. Input String Examples (for understanding, not as constraints):
     - Infinity: Strings like "inf", "Infinity", or very large numbers that overflow to infinity
     - NaN: Strings like "nan", "NaN", or expressions that result in undefined mathematical operations
