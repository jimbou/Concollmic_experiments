  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          result = subprocess.run(
              ["./temp_executable", "inf"],  # Using "inf" which satisfies the constraints: 
              # - argc == 2 (program name + "inf")
              # - "inf" parsed by atof() gives positive infinity
              # - Positive infinity has IEEE 754 exponent field 0x7FF and significand 0
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Use shell=False to pass arguments properly
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
