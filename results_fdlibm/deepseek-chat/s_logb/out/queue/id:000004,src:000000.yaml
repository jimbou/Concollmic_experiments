target_path_constraint: |-
  1. Command-Line Arguments: The program must be executed with exactly one argument: `argc == 2`

  2. Input Value Constraint: The argument must represent a double-precision floating-point number where the high 32 bits (excluding the sign bit) are greater than or equal to 0x7ff00000. This corresponds to IEEE 754 special values:
     - Positive infinity: represented as a double where the exponent bits are all 1 and mantissa bits are all 0
     - Negative infinity: represented as a double where the sign bit is 1, exponent bits are all 1, and mantissa bits are all 0
     - NaN (Not a Number): represented as a double where the exponent bits are all 1 and mantissa bits are not all 0

  3. Input Format: The argument must be a valid string representation that `atof()` can parse into one of these special floating-point values. This can be achieved by:
     - Providing "inf" or "infinity" (case-insensitive) for infinity
     - Providing "nan" (case-insensitive) for NaN
     - Providing a hexadecimal representation that corresponds to the IEEE 754 bit pattern

  4. Program Execution: The program must successfully parse the argument using `atof()` without errors.
