  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Using 0.25 as our input value, which satisfies the constraint:
          # 0x3c600000 < (high_word & 0x7fffffff) < 0x3fe00000
          # The IEEE 754 representation of 0.25 has high word 0x3FD00000
          # which is between 0x3c600000 and 0x3fe00000
          result = subprocess.run(
              ["./temp_executable 0.25"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
