target_path_constraint: |-
  1. Command-Line Arguments: The program must be executed with exactly one argument (the input value): `argc == 2`

  2. Input Value Constraint: The command-line argument must be a valid finite floating-point number that, when passed to the hyperbolic sine function, produces a non-finite result (NaN or infinity). This typically occurs with extremely large magnitude inputs where the exponential calculation overflows.

  3. Mathematical Constraint: The input value `x` must satisfy:
     - `finite(x) == true` (x is a finite number, not NaN or infinity)
     - `finite(sinh(x)) == false` (the hyperbolic sine of x is non-finite)

  For double-precision floating-point numbers, this typically requires:
     - `|x| > threshold` where threshold is approximately 710.0 (the point where exp(x) overflows in double precision)
     - Specifically: `x > 710.0` or `x < -710.0`

  4. Input Format: The argument must be a valid string representation of a floating-point number that can be parsed by `atof()` function.
