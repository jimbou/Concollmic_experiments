exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use a value that satisfies all constraints:
          # - Finite number: 711.0 is finite
          # - sinh(711.0) overflows (non-finite)
          # - Valid string representation parseable by atof()
          # - Exactly one argument (argc == 2)
          result = subprocess.run(
              ["./temp_executable", "711.0"],  # Changed from "1.0" to "711.0"
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed to shell=False for safer argument passing
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
