  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          result = subprocess.run(
              ["./temp_executable", "nan"],  # Changed to two arguments: program name and "nan"
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              timeout=timeout,
