     - This means the argument count (including the program name) must be either:
       * Less than 3: Only the program name, or program name plus 1 argument
       * Greater than 3: Program name plus 3 or more arguments

  2. Argument Format: All arguments must be valid strings that can be passed to the program without causing immediate termination (e.g., not null pointers or invalid memory references).

  Note: The program expects exactly 2 numeric arguments (plus the program name = 3 total). Any deviation from this will trigger the target branch.
