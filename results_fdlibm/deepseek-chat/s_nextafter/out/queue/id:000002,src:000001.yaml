exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use only 2 arguments (program name + 1 argument) to satisfy the constraint
          # that the number of arguments must NOT be equal to 3
          # This means we're providing fewer than the expected 3 arguments
          
          # Use a valid string argument that won't cause immediate termination
          result = subprocess.run(
              ["./temp_executable", "valid_argument"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
