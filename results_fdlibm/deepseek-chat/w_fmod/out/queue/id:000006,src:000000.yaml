exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to pass arguments separately to satisfy argc == 3
          # Using "nan" for both arguments to ensure atof() produces NaN
          result = subprocess.run(
              ["./temp_executable", "nan", "nan"],  # Separate arguments, both producing NaN
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed to False to properly handle separate arguments
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
