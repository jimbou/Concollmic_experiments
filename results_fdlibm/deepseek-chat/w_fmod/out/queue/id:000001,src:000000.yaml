  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified command to satisfy the constraints:
          # - argc == 3 (program name + 2 arguments)
          # - argv[2] == 0.0 (second argument is "0.0")
