  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use the very small value 2**-511 for the second argument
          # This satisfies the constraint hb < 0x20b00000
          second_arg = str(2**-511)
          
          result = subprocess.run(
              ["./temp_executable", "1.0", second_arg],  # Pass arguments separately
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Set shell=False to pass arguments correctly
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
