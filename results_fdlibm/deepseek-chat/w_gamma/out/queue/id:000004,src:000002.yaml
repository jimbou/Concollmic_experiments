  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          result = subprocess.run(
              ["./temp_executable", "1.0"],  # Added "1.0" as second argument to satisfy argc == 2
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
