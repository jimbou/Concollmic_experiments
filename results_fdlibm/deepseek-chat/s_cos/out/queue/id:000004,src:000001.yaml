  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use the value that satisfies all constraints: 1.6707963267948966
          # This is π/2 + 0.1, which satisfies |x| > π/2 and the IEEE 754 constraint
          # After angle reduction modulo π/2, we get n = 1, so (n & 3) = 1, satisfying the target constraint
          result = subprocess.run(
              ["./temp_executable", "1.6707963267948966"],  # Exactly 2 arguments: program name + value
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Use shell=False to pass arguments directly
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
