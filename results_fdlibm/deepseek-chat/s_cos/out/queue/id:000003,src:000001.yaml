  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use the value that satisfies all constraints: 6.283185307179586 (2π)
          # This value satisfies:
          # 1. |x| > π/2 (high word constraint)
          # 2. (n & 3) == 0 from __ieee754_rem_pio2 (n = 4)
          # 3. Valid finite floating-point number
          result = subprocess.run(
              ["./temp_executable", "6.283185307179586"],  # Exactly 2 arguments: program name + value
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Use shell=False to pass arguments directly
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
