exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Using "1.0" as the command-line argument which satisfies all constraints:
          # - It's a valid floating-point number parseable by atof()
          # - High 32 bits: 0x3ff00000 >= 0x00100000 (normalized double)
          # - |1.0| >= 2.2250738585072014e-308 
          # - Not zero, infinity, or NaN
          result = subprocess.run(
              ["./temp_executable", "1.0"],  # Using separate arguments instead of shell=True for better security
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
