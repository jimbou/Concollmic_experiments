  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified command-line arguments: only executable name, no additional arguments
          # This satisfies the constraint that argc != 3 (argc = 1 in this case)
          result = subprocess.run(
              ["./temp_executable"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Using shell=False to pass arguments as list for better control
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
