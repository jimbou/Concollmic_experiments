  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified command-line arguments: first argument = 0.0, second argument = 1.0
          # This satisfies the target path constraint where fmod(x, y) is called with x = 0
          # x = 0.0 (first argument) and y = 1.0 (second argument, non-zero finite floating-point)
          result = subprocess.run(
              ["./temp_executable", "0.0", "1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
