  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to include one argument: "10.0" which is a valid floating-point number
          # This satisfies argc == 2 and provides a valid number for log10 function
          result = subprocess.run(
              ["./temp_executable", "10.0"],  # Added argument to make argc = 2
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Use shell=False for better security and control
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
