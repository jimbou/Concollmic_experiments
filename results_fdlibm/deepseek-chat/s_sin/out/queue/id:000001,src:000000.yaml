target_path_constraint: |-
  1. Command-Line Arguments: The program must be executed with exactly one argument (argc == 2).

  2. Input Value Constraint: The command-line argument must represent a floating-point number that, when converted to IEEE 754 double-precision format, has its high word (most significant 32 bits) greater than or equal to 0x7ff00000. This corresponds to:
     - Positive infinity: +∞
     - Negative infinity: -∞  
     - NaN (Not a Number) values

  3. Specific Input Examples:
     - For positive infinity: Provide a string that parses to +∞ (e.g., "inf", "Infinity", or a very large number that overflows)
     - For negative infinity: Provide a string that parses to -∞ (e.g., "-inf", "-Infinity", or a very large negative number that underflows)
     - For NaN: Provide a string that parses to NaN (e.g., "nan", "NaN")

  The constraint is satisfied when the input value's high word in IEEE 754 format has the exponent field set to all 1s (0x7ff), which indicates special floating-point values.
