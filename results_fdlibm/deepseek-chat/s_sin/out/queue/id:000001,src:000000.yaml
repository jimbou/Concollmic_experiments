exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Execute with "inf" as the argument to satisfy the constraint
          # The program name is "./temp_executable 1.0" (with space)
          # We add "inf" as the argument to make argc == 2
          # "inf" will be parsed as positive infinity, which has high word >= 0x7ff00000
          result = subprocess.run(
              ["./temp_executable 1.0", "inf"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,  # Keep shell=True to handle space in program name
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
