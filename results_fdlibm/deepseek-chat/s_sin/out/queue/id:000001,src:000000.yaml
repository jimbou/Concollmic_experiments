justification: This branch has 0% historical coverage and handles special floating-point
  cases (infinity and NaN inputs). Testing edge cases in mathematical functions is
  important for robustness and can reveal potential issues with floating-point handling.
  The branch is reachable through the test harness by providing appropriate command-line
