exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified command string: remove the "1.0" argument to satisfy argc != 2 constraint
          # Original: "./temp_executable 1.0" (argc = 2)
          # Modified: "./temp_executable" (argc = 1)
          result = subprocess.run(
              ["./temp_executable"],  # argc = 1 (only program name), satisfying the constraint
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
