  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use a value that satisfies the constraints: 1.0 has IEEE 754 exponent field 1023
          # which is within the required range of 1023-1042
          # This gives us argc == 2 (program name + one argument)
          result = subprocess.run(
              ["./temp_executable", "1.0"],  # Pass as separate arguments for clarity
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Use shell=False for better control over argument passing
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
