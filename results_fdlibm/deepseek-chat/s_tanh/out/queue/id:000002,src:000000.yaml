  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          result = subprocess.run(
              ["./temp_executable 2.0"],  # Changed from "1.0" to "2.0" to satisfy the constraint
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
