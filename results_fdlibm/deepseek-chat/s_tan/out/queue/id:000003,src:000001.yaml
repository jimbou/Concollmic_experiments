target_path_constraint: |-
  1. Command-Line Arguments: The program must be executed with exactly 2 arguments (program name + 1 floating-point argument). The test harness currently provides 3 arguments but should provide only 2.

  2. Argument Value: The single floating-point argument must represent positive infinity, negative infinity, or NaN (Not a Number). This can be achieved by:
     - Using the string "inf" or "infinity" (case-insensitive) for positive infinity
     - Using the string "-inf" or "-infinity" for negative infinity  
     - Using the string "nan" for NaN
     - Or using a floating-point value that when parsed results in an IEEE 754 representation where the exponent field is 0x7FF (all bits set)

  3. Program Flow: With the correct argument count, the program will:
     - Parse the argument as a double using atof()
     - Pass it to the tan() function
     - The tan() function will extract the high 32 bits of the IEEE 754 representation
     - If the exponent field (bits 20-30) equals 0x7FF, the branch condition (ix>=0x7ff00000) will be true

  Note: The constraint requires modifying the test harness to provide only 1 floating-point argument instead of 2 arguments. The current test harness provides ["./temp_executable", "1.0", "inf"] but should provide ["./temp_executable", "inf"] to reach this branch.
