target_path_constraint: |-
  1. Command-Line Arguments: The program must be called with exactly 2 arguments (program name + 1 argument): argc == 2

  2. Input Value Constraint: The second command-line argument must represent a floating-point value where the high 32 bits of its IEEE 754 representation have the exponent field set to all 1s (indicating infinity or NaN). Specifically:
     - The input value must be such that when converted to double precision and its high 32 bits are extracted (ix = __HI(x)), the condition (ix & 0x7fffffff) >= 0x7ff00000 is true
     - This corresponds to values like: infinity (positive or negative), NaN (quiet or signaling)
     - Examples of inputs that would satisfy this: "inf", "-inf", "nan", or very large numbers that overflow to infinity

  3. Numeric Conversion: The string argument must be successfully converted to a double precision floating-point number by atof(argv[1])
