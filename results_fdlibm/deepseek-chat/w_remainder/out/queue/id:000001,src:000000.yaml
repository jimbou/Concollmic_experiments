exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified command to have fewer than 3 arguments (2 arguments total)
          # Original: "./temp_executable 1.0 1.0" (3 arguments)
          # Modified: "./temp_executable" (1 argument) - but wait, this would be just 1 argument
          # Actually need: "./temp_executable 1.0" (2 arguments) to satisfy argc < 3
          result = subprocess.run(
              ["./temp_executable 1.0"],  # Only 2 arguments total: program name and "1.0"
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
