  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use "inf" (infinity) as the first argument and a finite number as the second
          # This satisfies the constraint: at least one argument is a special floating-point value
          # Using "inf" avoids any issues with quiet NaN patterns mentioned in the constraint
          result = subprocess.run(
              ["./temp_executable", "inf", "1.0"],  # First argument is infinity, second is finite
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
