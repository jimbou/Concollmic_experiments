exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use values that will cause hypot to overflow to infinity
          # 1.5e308 for both arguments will satisfy the constraint:
          # - Both inputs are finite
          # - Their hypotenuse calculation will overflow to infinity
          result = subprocess.run(
              ["./temp_executable", "1.5e308", "1.5e308"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
