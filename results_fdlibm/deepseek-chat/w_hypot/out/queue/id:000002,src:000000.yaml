  1. Command-Line Arguments: The number of command-line arguments must NOT equal 3. Since the program name is the first argument (argv[0]), this means providing either:
     - 0 arguments: only the program name
     - 1 argument: program name plus one value
     - More than 2 arguments: program name plus 3 or more values

