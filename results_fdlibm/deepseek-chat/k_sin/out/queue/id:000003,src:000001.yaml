target_path_constraint: |-
  1. Command-Line Arguments: The program must be called with exactly 3 arguments (plus program name, so argc == 4 total)
     - Format: ./program arg1 arg2 arg3

  2. Argument Types and Conversion:
     - argv[1] must be a valid string representation of a floating-point number that can be converted by atof()
     - argv[2] must be a valid string representation of a floating-point number that can be converted by atof()
     - argv[3] must be a valid string representation of an integer that can be converted by atoi()

  3. Floating-Point Bit Pattern Constraint: For the value a0 (converted from argv[1]), the condition `(__HI(a0) & 0x7fffffff) >= 0x3e400000` must be true, where:
     - __HI(x) extracts the high-order 32 bits of the double-precision floating-point number x
     - 0x7fffffff is a mask to clear the sign bit (keeping only the exponent and mantissa)
     - 0x3e400000 in hexadecimal represents the floating-point value 1.52587890625e-5 in decimal
     - This means the absolute value of a0 must be >= approximately 1.52587890625e-5 (excluding the sign bit)

  In simpler terms: The floating-point number passed as the first argument must have an absolute value that is not extremely close to zero (specifically, >= ~1.53e-5).
