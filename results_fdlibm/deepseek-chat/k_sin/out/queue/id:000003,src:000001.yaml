  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to include 3 arguments as required by the path constraint
          # argv[1] = "1.0" (satisfies floating-point constraint: |1.0| >= 1.53e-5)
          # argv[2] = "1.0" (valid float)
          # argv[3] = "1" (valid integer)
          result = subprocess.run(
              ["./temp_executable", "1.0", "1.0", "1"],  # Now 3 arguments as required
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed to shell=False for safety with list arguments
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
