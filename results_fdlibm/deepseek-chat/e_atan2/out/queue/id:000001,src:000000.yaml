  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Execute with first argument as 1.0 and second argument as "inf"
          # "inf" will be parsed as positive infinity with IEEE 754 bit pattern 0x7ff00000
          # This satisfies all constraints:
          # 1. Exactly two arguments (plus program name)
          # 2. Both are valid floating-point numbers
          # 3. Second argument represents positive infinity
          # 4. High 32 bits of double representation equal 0x7ff00000
          # 5. Not NaN (passes NaN/infinity check)
          result = subprocess.run(
              ["./temp_executable", "1.0", "inf"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
