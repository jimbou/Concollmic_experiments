  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Change the argument from "0.0" to "1.0" to satisfy the constraints
          # "1.0" will parse to a finite, non-zero, normal floating-point number
          # satisfying the condition that hx (after masking) is between 0x00100000 and 0x7ff00000
          result = subprocess.run(
              ["./temp_executable", "1.0"],  # Use separate arguments instead of shell=True with string
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
