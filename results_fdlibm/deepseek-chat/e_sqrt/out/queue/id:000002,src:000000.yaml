  4. The branch protects complex error handling logic that hasn't been tested
target_path_constraint: |-
  1. Command-Line Arguments: The program must be executed with exactly one argument (in addition to the program name): `argc == 2`

  2. Input Format: The command-line argument must be a valid string representation of a floating-point number that, when parsed as a double, represents either:
     - NaN (Not a Number): A special floating-point value that represents an undefined or unrepresentable value
     - Positive or Negative Infinity: A special floating-point value that represents an unbounded quantity

  3. Floating-Point Representation Constraint: When the input value is converted to its IEEE 754 double-precision binary representation:
     - The exponent field (bits 52-62) must have all bits set to 1: `(exponent & 0x7FF) == 0x7FF`
     - This condition is true for both NaN and Infinity values in IEEE 754 format

  4. Specific NaN/Infinity Values: The input string must correspond to one of these special values:
     - NaN representations: "NaN", "nan", "NAN", or arithmetic operations that produce NaN (e.g., sqrt(-1))
     - Infinity representations: "Inf", "inf", "INF", "Infinity", "infinity", or very large numbers that overflow to infinity

  Note: The exact string representation that produces NaN/Infinity may depend on the C library's `atof()` implementation, but standard representations should work across most implementations.
