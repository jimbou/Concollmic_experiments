  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          result = subprocess.run(
              ["./temp_executable 0.0 1.0"],  # Changed first argument from "1.0" to "0.0" to satisfy atof(argv[1]) == 0.0
              capture_output=True,
              encoding="utf-8",
