  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use the value 710.47509765625 which satisfies the path constraint:
          # - High-order 32 bits (0x408633CD) < 0x408633CE
          # - Valid floating-point number parseable by atof()
          # - Called with exactly one argument (argc == 2)
          result = subprocess.run(
              ["./temp_executable", "710.47509765625"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
