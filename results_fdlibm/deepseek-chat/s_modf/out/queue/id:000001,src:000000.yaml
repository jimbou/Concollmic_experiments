  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use 2^52 as the argument value (4503599627370496)
          # This satisfies: exponent > 51, finite, no fractional part
          result = subprocess.run(
              ["./temp_executable", "4503599627370496"],  # Exactly 2 arguments: program name + numeric argument
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Use shell=False for better control over arguments
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
