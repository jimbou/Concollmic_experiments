  1. Command-Line Arguments: The program must be called with exactly 2 arguments (program name + one numeric argument): argc == 2

  2. Input Value Constraint: The command-line argument must be a valid floating-point number that, when converted to IEEE 754 double-precision format, has an exponent field j0 greater than 51. This corresponds to numbers with magnitude greater than 2^51 (approximately 2.25 × 10^15). The exact constraint is:
     - Let x be the double-precision floating-point value parsed from argv[1]
     - The exponent field j0 must satisfy: j0 = ((__HI(x) >> 20) & 0x7ff) - 0x3ff > 51
     - This translates to numbers with absolute value greater than 2^51 (2,251,799,813,685,248)

  3. Numerical Range: The input value must be a finite floating-point number (not NaN or infinity) with magnitude large enough that it has no fractional part when represented as a double-precision floating-point number.
