exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to pass "1e30" as the argument instead of "1.0"
          # This satisfies the constraint: high word (excluding sign) >= 0x44100000
          result = subprocess.run(
              ["./temp_executable", "1e30"],  # Pass exactly one argument that satisfies the constraints
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Use shell=False for safer execution with separate arguments
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
