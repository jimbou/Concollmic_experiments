  1. Command-Line Arguments: argc == 3 (program must be called with exactly 2 arguments after the program name)

  2. Input Format: Both arguments must be valid floating-point numbers that can be parsed by atof()

  3. Mathematical Constraints for scalb(x, fn):
     - x must be a finite number (not infinity, not NaN)
     - The result of scalb(x, fn) must be non-finite (either positive or negative infinity)
     - The result must not be NaN

  4. Specific Condition: The scalb function must overflow to infinity. This typically occurs when:
     - x is a large finite number and fn is a large positive value, causing the exponent to exceed the representable range
     - OR x is a small finite number and fn is a large negative value, causing underflow to zero followed by potential overflow scenarios

  Note: The exact mathematical relationship depends on the implementation of __ieee754_scalb(), but generally scalb(x, fn) computes x * 2^fn. To cause overflow, the product must exceed the maximum representable double-precision floating-point value (~1.8e308).
