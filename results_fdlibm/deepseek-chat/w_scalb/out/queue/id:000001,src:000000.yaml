target_path_constraint: |-
  1. Command-Line Arguments: argc == 3 (program name plus two numeric arguments)
  2. Argument Format: Both argv[1] and argv[2] must be valid string representations of floating-point numbers that can be parsed by atof()
  3. Mathematical Constraints:
     - x = atof(argv[1]) must be a finite number (not infinite, not NaN)
     - fn = atof(argv[2]) can be any value that causes the internal computation __ieee754_scalb(x, fn) to produce a result z that is neither finite nor NaN
     - The specific mathematical relationship: z = x * 2^fn must result in overflow or underflow (infinite magnitude or denormalized to zero in a way that's not representable as finite or NaN)

  This typically occurs when:
  - x is a large finite number and fn is very large positive (causing overflow to infinity)
  - x is a small finite number and fn is very large negative (causing underflow to zero in a way that's not representable)
  - Or other edge cases where the exponent calculation exceeds the floating-point range
