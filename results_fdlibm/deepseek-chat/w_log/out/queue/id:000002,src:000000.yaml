exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified command: use a negative floating-point value (-1.5) that satisfies:
          # - Valid floating-point number parseable by atof()
          # - Negative and not zero: x < 0.0
          # - Triggers the error condition in logarithm function for negative non-zero values
          result = subprocess.run(
              ["./temp_executable -1.5"],
              capture_output=True,
              encoding="utf-8", 
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
