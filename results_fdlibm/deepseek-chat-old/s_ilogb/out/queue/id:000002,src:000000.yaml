     - x ≠ 0
     - |x| < 2.2250738585072014e-308 (the smallest positive normal double)
     - The floating-point representation of x has exponent bits 52-62 set to 0 (indicating denormal number)
     - The mantissa bits 0-51 must contain non-zero values

  This will ensure the execution takes the path:
