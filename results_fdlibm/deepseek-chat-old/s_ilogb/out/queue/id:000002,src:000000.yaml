  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import struct

      try:
          # Create a denormal floating-point number that satisfies all constraints
          # We need a number where:
          # - hx != 0 (non-zero high word)
          # - hx < 0x00100000 (denormal number)
          # - (hx|lx) != 0 (non-zero number)
          # - Exponent bits are 0 (denormal)
          
          # Construct the double bit pattern manually:
          # Sign bit: 0 (positive)
          # Exponent: 0 (denormal)
          # Mantissa: 2^32 = 4294967296 (to make hx = 1)
          sign_bit = 0
          exponent_bits = 0
          mantissa_bits = 2**32  # This gives hx = 1, lx = 0
          
          double_bits = (sign_bit << 63) | (exponent_bits << 52) | mantissa_bits
          denormal_value = struct.unpack('d', struct.pack('Q', double_bits))[0]
          
          # Convert to string for command-line argument
          denormal_str = str(denormal_value)
          
          result = subprocess.run(
              ["./temp_executable 1.0", denormal_str],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
