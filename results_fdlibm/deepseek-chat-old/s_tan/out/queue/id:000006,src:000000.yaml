  1. Command-Line Argument: The program must be executed with exactly one argument: `argc == 2`

  2. Input Value Constraint: The command-line argument must represent a double-precision floating-point number that, when processed by the `tan` function, satisfies the condition `ix >= 0x7ff00000` where `ix` is the high word of the IEEE 754 double-precision representation with the sign bit masked out.

  3. IEEE 754 Double-Precision Representation: The input value must be a special floating-point value where the exponent field (bits 52-62) is all 1s (0x7ff). This includes:
     - Positive Infinity: exponent = 0x7ff, mantissa = 0
     - Negative Infinity: exponent = 0x7ff, mantissa = 0 (sign bit will be handled by masking)
     - NaN (Not a Number): exponent = 0x7ff, mantissa ≠ 0

  4. Input Format: The argument must be a valid string representation of such a special floating-point value that `atof()` can parse correctly. Common representations include:
     - "inf" or "Infinity" for positive infinity
     - "-inf" or "-Infinity" for negative infinity  
     - "nan" or "NaN" for NaN values

  Note: The condition `ix >= 0x7ff00000` specifically targets the high word of the double after masking the sign bit, which means both positive and negative special values will satisfy this condition.
