  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to pass executable and argument separately to satisfy argc == 2
          # Using "inf" as the argument which represents positive infinity
          # This satisfies the IEEE 754 special value requirement (exponent = 0x7ff, mantissa = 0)
          # and the condition ix >= 0x7ff00000 when processed by tan function
          result = subprocess.run(
              ["./temp_executable", "inf"],  # Separate arguments: program and "inf"
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed to False to properly handle separate arguments
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
