  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # X_TLOSS for j1() Bessel function is typically 1.073741824e9
          # We need fabs(input_value) > X_TLOSS
          # Using 1.1e9 which is greater than X_TLOSS and a valid float
          input_value = "1.1e9"
          
          # Execute with exactly one command-line argument (argc == 2)
          # The program name is argv[0], input_value is argv[1]
          result = subprocess.run(
              ["./temp_executable", input_value],  # Pass as separate arguments
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Use shell=False for better security and control
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
