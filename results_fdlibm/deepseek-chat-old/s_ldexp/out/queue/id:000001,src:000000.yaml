justification: This branch has 0% historical coverage and represents critical error
  handling for the ldexp function. When the result of scalbn(value, exp) is not finite
  or zero, the function sets errno = ERANGE to indicate a range error. This is an
  important edge case for floating-point arithmetic functions that is not currently
  tested. The branch protects complex error handling logic that is essential for robust
  mathematical library behavior.
target_path_constraint: |-
  1. Command-line Arguments: The program must be called with exactly 3 arguments (program name + 2 parameters). The test harness already ensures this with the command "./temp_executable 1.0 1".

  2. First Argument (value): The first command-line argument must be a valid floating-point number that will be parsed by atof(). This value must be finite and non-zero when passed to ldexp() to avoid the first condition check.

  3. Second Argument (exp): The second command-line argument must be a valid integer that will be parsed by atoi().

  4. Mathematical Constraint: The combination of value and exponent must cause the result of scalbn(value, exp) to be either non-finite (NaN or infinity) or exactly zero. This can happen through:
     - Overflow: When the exponent is large enough to cause the result to exceed the representable range, producing infinity
     - Underflow: When the exponent is negative enough to cause the result to be smaller than the smallest representable positive number, producing zero
     - Special cases: When value is already infinity/NaN and the exponent manipulation maintains that state

  Specifically, the constraint is: scalbn(atof(argv[1]), atoi(argv[2])) must be either non-finite (NaN or infinity) or equal to 0.0
