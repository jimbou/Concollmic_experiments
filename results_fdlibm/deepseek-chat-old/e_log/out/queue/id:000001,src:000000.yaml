  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use a value significantly different from 1.0 to satisfy the branch condition
          # Using 2.0 which is clearly different from 1.0 and parseable by atof()
          result = subprocess.run(
              ["./temp_executable", "2.0"],  # Split into separate arguments for argc == 2
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Set to False to properly handle separate arguments
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
