  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          result = subprocess.run(
              ["./temp_executable 0.1"],  # Changed from "1.0" to "0.1" to satisfy the path constraint
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
