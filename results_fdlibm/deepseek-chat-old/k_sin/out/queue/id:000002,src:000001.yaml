  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to have 3 arguments as required by the path constraint
          # argv[1] = 1.0 (satisfies floating-point constraint: |1.0| >= 2^(-27))
          # argv[2] = 1.0 (valid floating-point number)
          # argv[3] = 42 (valid integer)
          result = subprocess.run(
              ["./temp_executable", "1.0", "1.0", "42"],  # Now has 3 arguments as required
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed to False for better security with list arguments
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
