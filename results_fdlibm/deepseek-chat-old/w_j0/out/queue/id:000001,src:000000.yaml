exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import os

      # Set environment to ensure _LIB_VERSION != _IEEE_
      env = os.environ.copy()
      # Set MATH_ERREXCEPT to ensure non-IEEE mode
      env['MATH_ERREXCEPT'] = '1'
      
      # Use a value that satisfies |x| > X_TLOSS (X_TLOSS is typically around 1e16)
      # Using 1.1e16 which is greater than typical X_TLOSS values
      argument = "110000000000000000"  # 1.1e17 as string
      
      try:
          result = subprocess.run(
              ["./temp_executable", argument],  # Pass the argument directly
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              timeout=timeout,
              env=env
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
