target_file_lines: w_j0.c:40-40
target_lines_content: "\treturn __ieee754_y0(x);"
justification: The y0() function has 0% historical coverage and is completely untested.
  This represents a major gap in test coverage as it implements the Bessel function
  of the second kind (order 0), which is mathematically distinct from j0(). The function
  contains multiple error handling branches for edge cases like x <= 0.0 and x > X_TLOSS,
  providing significant coverage improvement potential. Since the current test harness
  only calls j0(), we need to modify the program to call y0() to achieve this coverage.
target_path_constraint: |-
  1. Command-Line Arguments: The program must be executed with a number of arguments that is NOT equal to 2.
     - The program name counts as the first argument (argv[0])
     - Therefore, the total number of arguments (argc) must be either:
       * 1 (only program name, no additional arguments)
       * 3 or more (program name plus two or more additional arguments)

  2. Program Execution: The test harness must execute the program without exactly one numerical argument after the program name.

  Note: The specific content of any additional arguments is irrelevant for reaching this branch - only the count matters.
selected_cnt: 0
successful_generation_cnt: 0
exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to have 3 arguments: program name, "1.0", and "extra_arg"
          # This gives argc = 3 (not equal to 2), satisfying the constraint
          result = subprocess.run(
              ["./temp_executable 1.0 extra_arg"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
