  3. Specific Floating-Point Constraint: The input floating-point number must have its 11-bit exponent field (bits 52-62 in IEEE 754 double format) set to 0x7ff. This can be achieved by:
     - Providing a positive or negative infinity value (e.g., "inf", "-inf", or values that overflow to infinity)
     - Providing a NaN (Not-a-Number) value (e.g., "nan", "-nan")
     - Providing a specific bit pattern that represents a double with exponent 0x7ff

  4. Mathematical Constraint: The condition k == 0x7ff must be satisfied, where k is derived from the high 32 bits of the double value as: k = (hx & 0x7ff00000) >> 20, and hx represents the high 32 bits of the IEEE 754 double.
