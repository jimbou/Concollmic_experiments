exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # The target path constraint requires:
          # 1. argc == 3 (program name + 2 arguments)
          # 2. First argument must be a floating-point number with exponent field 0x7ff
          # 3. Second argument can be any integer
          
          # Using "inf" as the first argument satisfies the exponent field constraint
          # "inf" in IEEE 754 double has exponent field = 0x7ff
          # Using "1" as the second argument (any integer is acceptable)
          
          result = subprocess.run(
              ["./temp_executable", "inf", "1"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Using shell=False for safety and proper argument handling
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
