     - k represents the biased exponent of x (actual exponent = k - 1023)
     - For the condition to be true: k + n > 2046

  5. Valid Range for k: k must not be 0 (denormalized numbers) or 0x7ff (NaN/infinity), since those cases have separate handling branches
