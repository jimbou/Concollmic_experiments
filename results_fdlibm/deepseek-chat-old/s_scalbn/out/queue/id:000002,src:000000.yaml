  2. Input Format: The second argument must be a valid floating-point number, and the third argument must be a valid integer.

  3. Mathematical Constraints:
     - Let x be the floating-point value from the second argument
     - Let n be the integer value from the third argument
     - The exponent k of x must satisfy: k + n > 0x7fe (where 0x7fe = 2046 in decimal)
     
  4. Exponent Calculation:
