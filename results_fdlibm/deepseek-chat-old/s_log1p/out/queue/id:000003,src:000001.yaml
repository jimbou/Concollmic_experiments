  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use the value 1.5e+307 which satisfies the constraint:
          # - High 32 bits (excluding sign) = 0x3FDAAE2B >= 0x3FDA827A
          # - Valid floating-point format parseable by atof()
          # - Single command-line argument after program name
          result = subprocess.run(
              ["./temp_executable", "1.5e+307"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
