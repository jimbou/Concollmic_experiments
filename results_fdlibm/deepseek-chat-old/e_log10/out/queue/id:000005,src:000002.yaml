  1. Command-Line Arguments: argc == 2 (the program must be called with exactly one argument after the program name)

  2. Input Value Constraint: The argument passed to the program must represent a double-precision floating-point number where the high 32-bit part (hx) has the value 0x7ff00000 or greater. This corresponds to special IEEE 754 floating-point values:
     - Positive infinity: represented as a double where the high 32 bits are exactly 0x7ff00000 and low 32 bits are 0x00000000
     - Negative infinity: represented as a double where the high 32 bits are exactly 0xfff00000 and low 32 bits are 0x00000000  
     - NaN (Not a Number): represented as a double where the high 32 bits are 0x7ff80000 or any value in the range 0x7ff00001 to 0x7fffffff (signaling NaN) or 0xfff00001 to 0xffffffff (quiet NaN)

  3. Input Format: The argument must be successfully parsed by atof() as a valid floating-point representation that results in one of the above special values. This could be achieved by passing strings like:
     - "inf" or "infinity" for positive infinity
     - "-inf" or "-infinity" for negative infinity  
     - "nan" or specific NaN representations

  4. The constraint can be expressed as: atof(argv[1]) must result in a double value where (__HI(x) >= 0x7ff00000), where __HI(x) extracts the high 32 bits of the double value x.
