  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use the value π (3.141592653589793) which satisfies all constraints:
          # 1. ix = __HI(x) & 0x7fffffff = 0x400921FB > 0x3fe921fb (π/2)
          # 2. ix = 0x400921FB < 0x7ff00000 (not infinity/NaN)
          # 3. After __ieee754_rem_pio2(x, y), (n & 3) == 2 (quadrant 2)
          result = subprocess.run(
              ["./temp_executable", "3.141592653589793"],  # Exactly 2 arguments: program name + π
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Use shell=False to pass arguments directly
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
