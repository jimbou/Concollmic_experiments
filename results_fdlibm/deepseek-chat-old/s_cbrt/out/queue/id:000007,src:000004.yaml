  1. Command-Line Arguments: The program must be executed with exactly one argument after the program name: `argc == 2`

  2. Special Floating-Point Value: The command-line argument must represent a special IEEE 754 double-precision floating-point value where the high 32-bit word (excluding sign bit) is greater than or equal to 0x7ff00000. This includes:
     - Positive infinity: represented as a string that parses to infinity (e.g., "inf", "INF", "Infinity")
     - Negative infinity: represented as a string that parses to negative infinity (e.g., "-inf", "-INF", "-Infinity")
     - NaN (Not a Number): represented as a string that parses to NaN (e.g., "nan", "NaN", "NAN")

  3. Input Parsing: The `atof()` function must successfully parse the argument string into one of these special floating-point values. The parsing depends on the C library's implementation of `atof()` and its handling of special floating-point string representations.

  Note: The condition `hx >= 0x7ff00000` specifically checks for values where the exponent field is all ones (0x7ff), which indicates special values in IEEE 754 format. The sign bit is masked out before this comparison, so both positive and negative special values will satisfy this condition.
