exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to use exactly 2 arguments: program name + input value
          # Using "inf" as the input value which satisfies:
          # - Represents positive infinity (floating-point special value)
          # - Has high 32-bit word ≥ 0x7ff00000 (IEEE 754 exponent field all 1s)
          # - Parseable by atof() as valid infinity representation
          result = subprocess.run(
              ["./temp_executable", "inf"],  # Two separate arguments
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed to shell=False to properly pass separate arguments
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
