  -2, ...), making it undefined at these points. The implementation likely contains
  special error handling for these cases. Since the current execution only tested
  x=1.0 (a valid input), exploring negative integer inputs would test the error handling
  path and potentially uncover edge case behavior. This branch is mathematically significant
  and likely contains complex logic for handling mathematical singularities.
