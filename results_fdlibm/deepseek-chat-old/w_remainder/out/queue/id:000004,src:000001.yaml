  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to have exactly 2 arguments in addition to program name (argc == 3)
          # Original: "./temp_executable 1.0" (2 arguments total)
          # Modified: "./temp_executable arg1 arg2" (3 arguments total)
          # Using two valid string arguments "1.0" and "2.0"
          result = subprocess.run(
              ["./temp_executable", "1.0", "2.0"],  # 3 arguments total: program name, "1.0", "2.0"
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
