exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use two distinct double values that satisfy all constraints:
          # - First argument is negative (sign bit set)
          # - Both are valid finite double-precision floating-point numbers
          # - Neither is NaN or infinity
          # - Both can be converted by atof()
          
          # Values satisfy all constraints:
          # arg1 = -1.7976931348623157e+308 (negative finite double)
          # arg2 = 2.2250738585072014e-308 (positive finite double)
          
          result = subprocess.run(
              ["./temp_executable", "-1.7976931348623157e+308", "2.2250738585072014e-308"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
