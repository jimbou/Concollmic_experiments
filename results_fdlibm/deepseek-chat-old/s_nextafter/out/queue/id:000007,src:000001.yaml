  #include "fdlibm.h"
  #include <stdio.h>

  #ifdef __STDC__
  	double nextafter(double x, double y)
  #else
  	double nextafter(x,y)
  	double x,y;
  #endif
  {
  	int	hx,hy,ix,iy;
  	unsigned lx,ly;

  	hx = __HI(x);		
  	lx = __LO(x);		
  	hy = __HI(y);		
  	ly = __LO(y);		
