  To reach the branch where j0 > 51 in the ceil() function:

  1. Command-Line Argument: The program must be executed with exactly one argument (argc == 2)
  2. Input Value Constraint: The input value must be a valid floating-point number where the exponent j0 > 51. The exponent j0 is calculated as ((i0>>20)&0x7ff)-0x3ff, where i0 is the high 32 bits of the double-precision floating-point representation.

  More specifically:
  - The input value must be a valid double-precision floating-point number
  - The exponent field (bits 52-62 in IEEE 754 double format) must represent a value greater than 51 + 1023 (the bias) = 1074
