exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Use 1.0 as the input value which satisfies the constraints:
          # - j0 = ((i0 >> 20) & 0x7ff) - 0x3ff = 0 (since exponent = 1023)
          # - 0 <= j0 <= 19 is satisfied
          # - This is a valid floating-point string that can be parsed by atof()
          result = subprocess.run(
              ["./temp_executable", "1.0"],  # Pass executable and argument separately
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed to False to properly handle separate arguments
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
