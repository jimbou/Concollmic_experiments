exec_code: |-
  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Modified to pass exactly 2 arguments: program name and a valid floating-point number
          # Using "1.0" as the second argument which will be converted to a valid double by strtod()
          # This satisfies the constraint that the number must not be NaN
          result = subprocess.run(
              ["./temp_executable", "1.0"],  # Two separate arguments with valid floating-point number
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Changed to False to properly pass separate arguments
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
