  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess

      try:
          # Execute with exactly 3 arguments: program name, negative integer, valid float
          # Using -1 as the negative integer and 1.0 as the valid float
          result = subprocess.run(
              ["./temp_executable", "-1", "1.0"],  # Separate arguments as list elements
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=False,  # Set to False to properly handle separate arguments
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
