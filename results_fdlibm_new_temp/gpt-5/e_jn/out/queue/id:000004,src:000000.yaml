  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # We keep the same harness structure (single shell command string),
      # but substitute concrete inputs to satisfy n<0 and finite non-negative x.
      # argv[1] = "-3" (negative integer), argv[2] = "2.5" (finite, non-negative double)
      cmd = "./temp_executable -3 2.5"

      try:
          # Ensure the target binary is executable
          if os.path.exists("./temp_executable"):
              st = os.stat("./temp_executable")
              if not (st.st_mode & 0o111):
                  os.chmod("./temp_executable", st.st_mode | 0o111)

          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
