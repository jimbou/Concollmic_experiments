target_path_constraint: |-
  To reach the branch where the NaN check is true in matherr (i.e., x->arg1 != x->arg1), ensure the following input and environment conditions in chronological order:

  1. Process environment (locale):
     - The execution environment must use the standard C locale for numeric parsing so that special floating tokens are recognized by strtod:
       • LC_ALL = "C"
       • LC_NUMERIC = "C"
       • LANG = "C"
     - No other locale-related environment variables should override these settings for numeric parsing.

  2. Command-line invocation shape:
     - Invoke the program with exactly one argument (excluding the program name). The shell must pass a single token as argv[1].
     - If the argument contains characters that the shell might split (e.g., spaces), it must be quoted such that the program still receives exactly one argument string.

  3. Argument content requirement (NaN under C locale):
     - Let s be the exact bytes of argv[1] as received by the program.
     - The string s must be such that, under the C locale, strtod(s, NULL) produces a double y where y != y (i.e., y is a NaN).
     - This is satisfied when s conforms to strtod’s NaN grammar in the C locale:
       • Case-insensitive base token "nan" (e.g., any casing of the letters N, A, N).
       • Optional leading sign '+' or '-' before the base token (the sign does not change the result; it still yields NaN).
       • Optional payload in parentheses immediately following the base token: "(" payload ")". The payload must consist only of characters permitted by the implementation’s NaN payload grammar in the C locale (commonly letters, digits, and underscores). No whitespace is allowed inside unless the whole argument is quoted as one token.
     - Exclusions: s must not be a finite numeric literal (integers, decimals, scientific notation) and must not be any representation of infinity (e.g., case-insensitive "inf" or "infinity" possibly with a sign), since these yield a number equal to itself and would not satisfy y != y.

  4. Error state assumptions:
     - No constraints are required on errno: the program does not branch on errno, and strtod producing NaN is sufficient to drive the NaN path in matherr.

  Under these conditions, the parsed value x is NaN, ex.arg1 = x, and the check (x->arg1 != x->arg1) evaluates to true, reaching the target branch.
