target_path_constraint: |-
  Chronological, input-level constraints to make the NaN-check in matherr true (i.e., x->arg1 != x->arg1):

  1. Program invocation arity: Launch the executable with exactly one command-line argument following the program name so that the process observes argc == 2.

  2. Argument parsing requirement: The single command-line argument must be a textual representation that, when converted by the C standard library’s floating-point parser (strtod) under the active locale, yields a NaN (Not-a-Number) value. This excludes any representation that parses to a finite number or to positive/negative infinity.

  3. Locale/environment: Ensure the process locale (particularly LC_NUMERIC) is set to one that adheres to standard C numeric tokenization for floating-point conversions so that NaN tokens are recognized. Avoid nonstandard locales or environment configurations that would cause the argument text to be interpreted as finite or infinite rather than NaN.

  4. Tokenization integrity under a shell: The single argument must be provided as one token (no embedded unquoted spaces or shell metacharacters that would split it into multiple arguments) to preserve argc == 2 and ensure the entire token is what strtod converts to NaN.

  Satisfaction of these constraints guarantees ex.arg1 is NaN when matherr is invoked, making the condition (x->arg1 != x->arg1) true and entering the target branch.
