exec_code: |
  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Prepare environment to ensure standard C locale parsing for strtod
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LC_NUMERIC"] = "C"
      env["LANG"] = "C"

      try:
          # Provide exactly one argument that parses to a finite double under C locale
          # Shell sees two tokens: program and single arg '1.0'
          result = subprocess.run(
              ["./temp_executable 1.0"],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, return stderr captured before timeout and a negative signal code
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Raise any unexpected execution error
          raise e
