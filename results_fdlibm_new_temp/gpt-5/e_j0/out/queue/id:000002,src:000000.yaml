  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      # Use a single negative floating-point argument to satisfy x < 0.0 and avoid -0.0/NaN/Inf
      # This preserves the original harness structure: a single shell command string with one argument
      cmd = "./temp_executable -1.0"

      # Ensure a standard C locale so atof parses the numeric string predictably
      env = os.environ.copy()
      env["LC_ALL"] = "C"
      env["LANG"] = "C"

      try:
          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          # Return stderr and the return code
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # ensure to raise the error if run failed
          raise e
