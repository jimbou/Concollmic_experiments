  def execute_program(timeout: int) -> tuple[str, int]:
      import os
      import signal
      import subprocess

      try:
          # Ensure the executable exists and is runnable
          exe_path = "./temp_executable"
          if not os.path.exists(exe_path):
              raise FileNotFoundError(f"Executable not found: {exe_path}")
          if not os.access(exe_path, os.X_OK):
              # Try to make it executable; if it fails, raise an error
              try:
                  st = os.stat(exe_path)
                  os.chmod(exe_path, st.st_mode | 0o111)
              except Exception as chmod_err:
                  raise PermissionError(f"Executable not accessible: {chmod_err}")

          # Enforce C locale to ensure '.' is the decimal separator for atof
          env = os.environ.copy()
          env["LC_ALL"] = "C"
          env["LANG"] = "C"

          # Use a single shell command string with one numeric argument.
          # Pick x = 1.24, which satisfies 0.941 <= |x| < 1.25 and is a valid ASCII decimal for atof.
          cmd = "./temp_executable 1.24"

          result = subprocess.run(
              [cmd],
              capture_output=True,
              encoding="utf-8",
              errors="replace",
              shell=True,
              timeout=timeout,
              env=env,
          )
          return result.stderr, result.returncode
      except subprocess.TimeoutExpired as e:
          return e.stderr, -signal.SIGKILL
      except Exception as e:
          # Propagate unexpected execution errors
          raise e
